# Copilot Setup Steps
# Pre-installs dependencies before the Copilot coding agent starts working.
# Must be on the default branch and contain a single job named copilot-setup-steps.
# See: https://docs.github.com/en/copilot/how-tos/use-copilot-agents/coding-agent/customize-the-agent-environment

name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Core deps for tests and development (skip GPU packages)
          pip install pytest pytest-cov pyyaml requests flask flask-cors \
            flask-socketio jinja2 pydantic openai chromadb websocket-client \
            apscheduler psutil pillow beautifulsoup4

      - name: Verify test infrastructure
        run: |
          python -m pytest --co -q tests/ \
            --ignore=tests/test_agent_loop.py \
            --ignore=tests/live_wire_test.py \
            2>&1 | tail -3

      - name: Show project info
        run: |
          echo "CosySim v0.52b ready"
          echo "Python: $(python --version)"
          echo "Tests collected: $(python -m pytest --co -q tests/ --ignore=tests/test_agent_loop.py --ignore=tests/live_wire_test.py 2>/dev/null | tail -1)"
