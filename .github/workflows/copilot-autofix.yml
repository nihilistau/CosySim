# Copilot Documentation Agent
# Assigns Copilot to documentation issues and opens PRs with changes.
# Triggers on labeled issues and weekly schedule.
#
# Prerequisites:
#   - copilot-setup-steps.yml installs Python deps
#   - .github/agents/doc-writer.agent.md provides writing instructions
#   - .github/hooks/cosysim-hooks.json enforces safety gates

name: Copilot Documentation Agent

on:
  issues:
    types: [opened, labeled]
  schedule:
    - cron: "0 0 * * 0"  # Weekly Sunday midnight UTC
  workflow_dispatch: {}   # Manual trigger

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  copilot-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Only run for documentation/copilot-task labels, schedule, or manual
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issues' &&
        (
          contains(github.event.issue.labels.*.name, 'documentation') ||
          contains(github.event.issue.labels.*.name, 'copilot-task')
        )
      )

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pyyaml requests flask flask-cors \
            flask-socketio jinja2 pydantic openai chromadb websocket-client \
            apscheduler psutil pillow beautifulsoup4

      - name: Create Copilot task (issue-triggered)
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            core.info(`Processing documentation issue #${issue.number}: ${issue.title}`);

            // Assign Copilot to the issue
            try {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                assignees: ['copilot[bot]']
              });
            } catch (e) {
              core.warning(`Could not assign Copilot: ${e.message}`);
            }

            // Add in-progress comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: [
                '🤖 **Copilot Documentation Agent** is working on this.',
                '',
                'Using instructions from `.github/agents/doc-writer.agent.md`.',
                'A PR will be opened when documentation changes are ready.',
              ].join('\n')
            });

      - name: Scan for scheduled doc tasks
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'documentation,copilot-task',
              state: 'open',
              per_page: 10,
              sort: 'created',
              direction: 'asc'
            });

            if (issues.length === 0) {
              core.info('No open documentation tasks found.');
              return;
            }

            core.info(`Found ${issues.length} open documentation issue(s):`);
            for (const issue of issues) {
              core.info(`  #${issue.number}: ${issue.title}`);
            }

            // Store the oldest unprocessed issue number for downstream steps
            core.exportVariable('DOC_ISSUE_NUMBER', issues[0].number);
            core.exportVariable('DOC_ISSUE_TITLE', issues[0].title);
