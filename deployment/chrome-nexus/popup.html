<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 300px; padding: 16px; font-family: -apple-system, sans-serif; background: #1a1a2e; color: #e0e0e0; }
    h2 { color: #7c3aed; margin: 0 0 12px; font-size: 16px; }
    .status { padding: 8px; border-radius: 4px; margin-bottom: 8px; font-size: 13px; }
    .status.ok { background: #064e3b; color: #6ee7b7; }
    .status.err { background: #7f1d1d; color: #fca5a5; }
    .stat { font-size: 12px; color: #a0a0c0; margin: 4px 0; }
    button { width: 100%; padding: 8px; margin-top: 8px; background: #7c3aed; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
    button:hover { background: #6d28d9; }
  </style>
</head>
<body>
  <h2>⚡ Nexus</h2>
  <div id="status" class="status">Checking...</div>
  <div id="stats"></div>
  <button id="sendPage">Send This Page</button>
  <button id="options" style="background:#334155">Options</button>
  <script src="popup.js"></script>
</body>
</html>
