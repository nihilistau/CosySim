<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CosySim — Bedroom</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bedroom.css') }}">
</head>
<body>
    <!-- ── Header ──────────────────────────────────────────────── -->
    <header class="scene-header">
        <a href="/" class="back-btn">← Back</a>
        <h1 class="scene-title">🛏️ Bedroom</h1>
        <div class="header-controls">
            <span id="agentStatus" class="agent-status off">● Agents Off</span>
            <button id="btnStartAgents" class="header-btn" onclick="toggleAgentLoop()">▶ Start</button>
            <button class="header-btn" onclick="manualTick()" title="Force one tick">⏩ Tick</button>
        </div>
    </header>

    <!-- ── 3D Canvas ───────────────────────────────────────────── -->
    <div id="scene-container">
        <canvas id="bedroom-canvas"></canvas>
    </div>

    <!-- ── Side Panel ──────────────────────────────────────────── -->
    <aside id="sidePanel" class="side-panel">
        <!-- Characters -->
        <section class="panel-section">
            <h3>Characters <small id="charCount">(0/2)</small></h3>
            <div id="charList" class="char-list"></div>
            <button class="btn-sm" onclick="openCharPicker()">+ Add Character</button>
        </section>

        <!-- Locations -->
        <section class="panel-section">
            <h3>Locations</h3>
            <div id="locationList" class="loc-list"></div>
        </section>

        <!-- Time of Day -->
        <section class="panel-section">
            <h3>Time of Day</h3>
            <div class="time-buttons">
                <button class="time-btn" data-time="morning" onclick="setTime('morning')">🌅</button>
                <button class="time-btn" data-time="afternoon" onclick="setTime('afternoon')">☀️</button>
                <button class="time-btn active" data-time="evening" onclick="setTime('evening')">🌆</button>
                <button class="time-btn" data-time="night" onclick="setTime('night')">🌙</button>
            </div>
        </section>

        <!-- Mode -->
        <section class="panel-section">
            <h3>Mode</h3>
            <div class="mode-buttons">
                <button onclick="setMode('observe')" class="mode-btn active" data-mode="observe">👁 Observe</button>
                <button onclick="setMode('direct')" class="mode-btn" data-mode="direct">🎬 Direct</button>
            </div>
        </section>

        <!-- Agent Model Config -->
        <section class="panel-section">
            <h3>🧠 Agent Models</h3>
            <div id="modelConfigList" class="model-config-list"></div>
            <button class="btn-sm" onclick="refreshModels()">🔄 Refresh Models</button>
        </section>
    </aside>

    <!-- ── Activity Feed ───────────────────────────────────────── -->
    <div id="activityFeed" class="activity-feed">
        <div class="feed-header">
            <h3>Activity Feed</h3>
            <button class="btn-clear" onclick="clearFeed()">Clear</button>
        </div>
        <div id="feedMessages" class="feed-messages"></div>
        <div id="whisperBox" class="whisper-box" style="display:none">
            <select id="whisperTarget"></select>
            <input id="whisperInput" type="text" placeholder="Whisper a direction…" onkeydown="if(event.key==='Enter')sendWhisper()">
            <button onclick="sendWhisper()">💬</button>
        </div>
    </div>

    <!-- ── Character Picker Modal ──────────────────────────────── -->
    <div id="charPickerModal" class="modal" style="display:none">
        <div class="modal-content">
            <h2>Add Character</h2>
            <div id="charPickerList" class="picker-list"></div>
            <button class="btn-cancel" onclick="closeCharPicker()">Cancel</button>
        </div>
    </div>

    <!-- ── Info Panel ──────────────────────────────────────────── -->
    <div class="info-panel">
        <div id="fps-counter">FPS: 60</div>
        <div id="status-indicator">
            <span class="status-dot"></span>
            <span id="status-text">Connected</span>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/bedroom.js') }}"></script>
</body>
</html>
