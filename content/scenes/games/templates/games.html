<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Games Arcade</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/games.css') }}">
</head>
<body>
  <header>
    <h1>🎮 Games Arcade</h1>
    <div id="status-bar">
      <span id="connection-status">⚪ Connecting...</span>
      <span id="score-display"></span>
    </div>
  </header>

  <!-- Game Selector -->
  <div id="game-select" class="panel">
    <div class="game-card" onclick="startMystery()">
      <h3>🔍 Mystery Investigation</h3>
      <p>Work through 5 clues to identify the culprit. The GameMaster narrates your journey.</p>
      <button class="btn">Play</button>
    </div>
    <div class="game-card" onclick="startTOD()">
      <h3>🎲 Truth or Dare</h3>
      <p>Roll dice, answer truths or complete dares. Score 5+ to win.</p>
      <button class="btn">Play</button>
    </div>
  </div>

  <!-- Mystery Game UI -->
  <div id="mystery-panel" class="panel" style="display:none">
    <div class="game-header">
      <h2 id="mystery-title">🔍 Mystery</h2>
      <button class="btn btn-small btn-secondary" onclick="exitGame()">✕ Exit</button>
    </div>
    <div id="mystery-setting" class="setting"></div>
    <div id="mystery-narration" class="narration"></div>
    <div id="clue-progress">
      <div id="clue-bar"><div id="clue-fill"></div></div>
      <span id="clue-count">0 / 5 clues</span>
    </div>
    <div id="clues-list"></div>
    <div id="mystery-actions">
      <button class="btn" id="btn-clue" onclick="getClue()">🔎 Search for Clue</button>
      <button class="btn btn-accent" id="btn-accuse" onclick="showAccuseForm()" style="display:none">⚖️ Make Accusation</button>
    </div>
    <div id="accuse-form" style="display:none">
      <input type="text" id="suspect-input" placeholder="Name the culprit...">
      <button class="btn btn-accent" onclick="makeAccusation()">Accuse!</button>
    </div>
    <div id="mystery-result" class="result" style="display:none"></div>
  </div>

  <!-- Truth or Dare UI -->
  <div id="tod-panel" class="panel" style="display:none">
    <div class="game-header">
      <h2>🎲 Truth or Dare</h2>
      <button class="btn btn-small btn-secondary" onclick="exitGame()">✕ Exit</button>
    </div>
    <div id="tod-narration" class="narration"></div>
    <div id="tod-score-display">Score: <span id="tod-score">0</span> / 5</div>
    <div id="tod-prompt-area" style="display:none">
      <div id="tod-type" class="tod-badge"></div>
      <div id="tod-prompt-text"></div>
      <textarea id="tod-response" placeholder="Your response..."></textarea>
      <button class="btn" onclick="submitAnswer(true)">✅ Done</button>
      <button class="btn btn-secondary" onclick="submitAnswer(false)">⏭️ Skip</button>
    </div>
    <div id="tod-actions">
      <button class="btn" id="btn-roll" onclick="rollDice()">🎲 Roll Dice</button>
    </div>
    <div id="tod-result" class="result" style="display:none"></div>
  </div>

  <!-- GameMaster Chat -->
  <div id="chat-panel">
    <div id="chat-header" onclick="toggleChat()">
      💬 <span>GameMaster</span>
      <span id="chat-toggle">▲</span>
    </div>
    <div id="chat-messages"></div>
    <div id="chat-input-area">
      <input type="text" id="chat-input" placeholder="Talk to the GameMaster..."
             onkeydown="if(event.key==='Enter')sendChat()">
      <button class="btn btn-small" onclick="sendChat()">Send</button>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.6.0/socket.io.min.js"></script>
  <script src="{{ url_for('static', filename='js/games.js') }}"></script>
</body>
</html>
