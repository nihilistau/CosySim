<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>SIGNAL — NeonCity Cyberdeck</title>
  <style>
    /* ══════════════════════════════════════════════════════════
       SIGNAL OS — v1.52 NeonCity Cyberdeck
       Cyberpunk overhaul: neon green/cyan/magenta on deep void
       v1.51.1 [2026-03-25] — Desktop mode tab bar + 5-col dock
       v1.57.3 [2026-05-12] — Phone polish: gallery featured layout, unread threads, bubble contrast, ghost-signal, wave typing
    ══════════════════════════════════════════════════════════ */
    :root {
      --bg:        #050710;
      --bg2:       #0a0e18;
      --bg3:       #10151f;
      --bg4:       #1a2030;
      --glass:     rgba(6,182,212,.08);
      --glass2:    rgba(16,185,129,.06);
      --sep:       rgba(16,185,129,.15);
      --label:     #c0d8cc;
      --label2:    rgba(192,216,204,.6);
      --label3:    rgba(192,216,204,.3);
      --accent:    #10b981;
      --accent2:   #06b6d4;
      --green:     #22c55e;
      --orange:    #f97316;
      --red:       #ef4444;
      --pink:      #ec4899;
      --yellow:    #f59e0b;
      --teal:      #06b6d4;
      --purple:    #a855f7;
      --bubble-out:rgba(16,185,129,.15);
      --bubble-in: rgba(6,182,212,.08);
      --tab-h:     80px;
      --bar-h:     44px;
      --status-h:  48px;
      --safe-b:    34px;
      --radius:    4px;
      --radius-lg: 6px;
      --font:      'JetBrains Mono','Fira Code','Share Tech Mono','Courier New',monospace;
      --wallpaper: linear-gradient(135deg, #050710 0%, #0a1628 25%, #0c1a2e 50%, #162032 75%, #0a0e18 100%);
      --scanline:  repeating-linear-gradient(0deg, rgba(16,185,129,.02) 0px, transparent 1px, transparent 2px);
    }
    [data-theme="light"] {
      --bg:     #0a0e18; --bg2: #10151f; --bg3: #1a2030; --bg4: #243040;
      --glass:  rgba(16,185,129,.1); --glass2: rgba(6,182,212,.06);
      --sep:    rgba(16,185,129,.2); --label: #e5f0ea;
      --label2: rgba(229,240,234,.6); --label3: rgba(229,240,234,.3);
      --bubble-in: rgba(6,182,212,.12);
    }

    /* ── Reset ──────────────────────────────────── */
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;background:var(--bg);font-family:var(--font);color:var(--label);overscroll-behavior:none;-webkit-user-select:none;user-select:none;font-size:13px}
    button{border:none;background:none;cursor:pointer;font-family:var(--font);color:inherit}
    input,textarea{font-family:var(--font)}
    a{color:var(--accent);text-decoration:none}
    ::-webkit-scrollbar{width:0}

    /* ══════════════════════════════════════════════════════════
       PHONE SHELL
    ══════════════════════════════════════════════════════════ */
    #phone{display:flex;flex-direction:column;height:100%;max-width:430px;margin:0 auto;position:relative;overflow:hidden;background:var(--bg);border-left:1px solid rgba(16,185,129,.1);border-right:1px solid rgba(16,185,129,.1);box-shadow:0 0 40px rgba(16,185,129,.05)}

    /* Wallpaper layer */
    #wallpaper{position:absolute;inset:0;z-index:0;background:var(--wallpaper);background-size:cover;background-position:center}

    /* Status bar */
    #status-bar{height:var(--status-h);display:flex;align-items:center;justify-content:space-between;padding:12px 20px 0;font-size:14px;font-weight:600;color:#fff;z-index:100;position:relative}
    #status-bar .time{font-size:16px;font-weight:700;letter-spacing:.3px}
    #status-bar .icons{display:flex;gap:5px;align-items:center;font-size:12px}

    /* ── Lock Screen ─────────────────────────── */
    #lock-screen{position:absolute;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--accent);cursor:pointer;transition:opacity .4s,transform .4s;background:var(--bg)}
    #lock-screen::before{content:'';position:absolute;inset:0;background:var(--scanline);pointer-events:none;z-index:1}
    #lock-screen.hidden{opacity:0;transform:translateY(-100%);pointer-events:none}
    #lock-time{font-size:56px;font-weight:700;letter-spacing:4px;text-shadow:0 0 20px rgba(16,185,129,.5),0 0 40px rgba(16,185,129,.2);font-family:var(--font)}
    #lock-date{font-size:14px;font-weight:400;opacity:.6;letter-spacing:2px;color:var(--label2)}
    #lock-hint{position:absolute;bottom:60px;font-size:12px;opacity:.5;animation:pulse 2s infinite;letter-spacing:3px;color:var(--accent)}
    @keyframes pulse{0%,100%{opacity:.2}50%{opacity:.6}}

    /* ── Home Screen ─────────────────────────── */
    #home-screen{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;padding-top:var(--status-h);transition:opacity .3s}
    #home-screen.hidden{opacity:0;pointer-events:none}

    .app-grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:16px 8px;padding:40px 20px 20px;align-content:start}
    .app-icon{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;-webkit-tap-highlight-color:transparent}
    .app-icon:active .icon-box{transform:scale(.88)}
    .icon-box{width:60px;height:60px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:28px;transition:transform .15s,box-shadow .2s;position:relative;box-shadow:0 2px 8px rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.08)}
    .icon-box:hover{box-shadow:0 0 16px rgba(16,185,129,.3)}
    .icon-box .notif-badge{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;padding:0 5px;border-radius:9px;display:flex;align-items:center;justify-content:center;border:2px solid #000}
    .app-name{font-size:11px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);text-align:center;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    /* Dock — v1.51.1 [2026-03-25] expanded to 5 cols for Desktop mode */
    .dock{background:rgba(8,14,20,.85);border:1px solid rgba(16,185,129,.12);border-radius:4px;margin:8px 16px;padding:12px 8px;display:grid;grid-template-columns:repeat(5,1fr);gap:0;box-shadow:0 -2px 12px rgba(16,185,129,.06)}
    .dock .app-icon .app-name{display:none}

    /* ── App Container ───────────────────────── */
    #app-container{position:absolute;inset:0;z-index:80;display:none;flex-direction:column;background:var(--bg)}
    #app-container.open{display:flex}

    /* App header */
    .app-header{height:calc(var(--status-h) + var(--bar-h));background:rgba(8,14,20,.92);border-bottom:1px solid rgba(16,185,129,.15);display:flex;align-items:flex-end;padding:0 8px 8px;gap:4px;flex-shrink:0;z-index:10}
    .app-back{font-size:17px;color:var(--accent);padding:0 8px;height:34px;display:flex;align-items:center;gap:2px;flex-shrink:0}
    .app-back span{font-size:28px;line-height:1;margin-top:-2px}
    .app-title{flex:1;text-align:center;font-size:17px;font-weight:600;line-height:34px}
    .app-header-right{display:flex;gap:4px;min-width:44px;justify-content:flex-end}

    /* App body */
    .app-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative}

    /* ══════════════════════════════════════════════════════════
       COMMON APP STYLES
    ══════════════════════════════════════════════════════════ */
    .section-header{padding:20px 16px 8px;font-size:28px;font-weight:700}
    .section-sub{padding:0 16px 12px;font-size:13px;color:var(--label2);text-transform:uppercase;font-weight:600;letter-spacing:.5px}
    .list-group{background:var(--bg2);border-radius:var(--radius);margin:0 16px 16px;overflow:hidden}
    .list-row{display:flex;align-items:center;padding:12px 16px;gap:12px;border-bottom:.5px solid var(--sep);cursor:pointer;transition:background .1s}
    .list-row:last-child{border-bottom:none}
    .list-row:active{background:var(--bg3)}
    .list-icon{font-size:22px;width:32px;text-align:center;flex-shrink:0}
    .list-label{flex:1;font-size:16px}
    .list-value{font-size:15px;color:var(--label2)}
    .list-chevron{color:var(--label3);font-size:14px}
    .danger-label{color:var(--red)}

    .empty-state{padding:60px 24px;text-align:center;color:var(--label2)}
    .empty-state .es-icon{font-size:56px;margin-bottom:16px}
    .empty-state h3{font-size:20px;font-weight:600;color:var(--label);margin-bottom:6px}
    .empty-state p{font-size:14px;line-height:1.5}

    #toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(8,14,20,.92);border:1px solid rgba(16,185,129,.2);color:var(--label);padding:10px 20px;border-radius:3px;font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:9999;white-space:nowrap;box-shadow:0 0 16px rgba(16,185,129,.15)}
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    .pill-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:3px;font-size:13px;font-weight:600;transition:all .15s;border:1px solid rgba(16,185,129,.2);letter-spacing:.5px}
    .pill-btn:active{opacity:.7}
    .pill-btn:hover{box-shadow:0 0 12px rgba(16,185,129,.3)}
    .pill-primary{background:rgba(16,185,129,.12);color:var(--accent);border-color:rgba(16,185,129,.3)}
    .pill-secondary{background:var(--bg3);color:var(--label);border-color:rgba(255,255,255,.08)}
    .pill-danger{background:rgba(239,68,68,.12);color:var(--red);border-color:rgba(239,68,68,.3)}

    /* ══════════════════════════════════════════════════════════
       MESSAGES APP
    ══════════════════════════════════════════════════════════ */
    .thread-list{padding:0;overflow-y:auto;max-height:calc(100vh - var(--status-h) - var(--bar-h) - 20px);-webkit-overflow-scrolling:touch}
    /* v1.57.3 [2026-05-12] — Unread thread differentiation + per-contact accent */
    .thread-item{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--bg2);border-bottom:.5px solid var(--sep);cursor:pointer;transition:background .15s;border-left:3px solid transparent}
    .thread-item:active{background:var(--bg3)}
    .thread-item.unread{background:rgba(var(--contact-accent-rgb,16 185 129),.06);border-left-color:var(--contact-accent,var(--accent))}
    .thread-item.unread .thread-name{font-weight:700}
    .thread-item:not(.unread) .thread-name{font-weight:500;color:var(--label2,var(--label))}
    .thread-item.unread .thread-preview{color:rgba(192,216,204,.75)}
    .thread-item:not(.unread) .thread-preview{color:var(--label3,rgba(192,216,204,.4))}
    .thread-item.unread .avatar{border:1px solid rgba(var(--contact-accent-rgb,16 185 129),.45);box-shadow:0 0 8px rgba(var(--contact-accent-rgb,16 185 129),.15)}
    .avatar{width:52px;height:52px;border-radius:4px;background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.2);display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:20px;font-weight:600;flex-shrink:0;overflow:hidden}
    .avatar img{width:100%;height:100%;object-fit:cover}
    .avatar-sm{width:32px;height:32px;font-size:13px}
    .avatar-xs{width:24px;height:24px;font-size:10px}
    .thread-info{flex:1;min-width:0}
    .thread-name{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .thread-preview{font-size:14px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
    .thread-meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
    .thread-time{font-size:12px;color:var(--label3)}
    .unread-badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}

    /* Chat screen */
    #chat-screen{display:none;flex-direction:column;position:absolute;inset:0;background:var(--bg);z-index:20}
    #chat-screen.open{display:flex}
    #chat-nav{height:calc(var(--status-h) + var(--bar-h));background:rgba(8,14,20,.92);border-bottom:1px solid rgba(16,185,129,.15);display:flex;align-items:flex-end;padding:0 8px 8px;gap:6px;flex-shrink:0}
    #chat-back{font-size:17px;color:var(--accent);padding:0 4px;height:34px;display:flex;align-items:center;gap:2px}
    #chat-back span:first-child{font-size:28px;line-height:1}
    #chat-title{flex:1;text-align:center;font-size:16px;font-weight:600;line-height:34px}
    #chat-messages{flex:1;min-height:0;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
    .msg-row{display:flex;align-items:flex-end;gap:6px;max-width:100%}
    .msg-row.out{justify-content:flex-end}
    .msg-row.in{justify-content:flex-start}
    .msg-row.sys{justify-content:center}
    /* v1.57.3 [2026-05-12] — Stronger contrast + rounded tails */
    .bubble{max-width:75%;padding:8px 12px;font-size:14px;line-height:1.5;word-break:break-word;position:relative;border:1px solid transparent}
    .msg-row.out .bubble{background:rgba(16,185,129,.18);color:#d1fae5;border-color:rgba(16,185,129,.35);border-radius:12px 12px 2px 12px;box-shadow:0 0 12px rgba(16,185,129,.1)}
    .msg-row.in  .bubble{background:rgba(6,182,212,.12);color:#cffafe;border-color:rgba(6,182,212,.28);border-radius:12px 12px 12px 2px;box-shadow:0 0 10px rgba(6,182,212,.08)}
    .msg-row.sys .bubble{background:rgba(168,85,247,.08);color:rgba(168,85,247,.75);font-size:12px;max-width:85%;border-radius:10px;text-align:center;border-color:rgba(168,85,247,.2)}
    .msg-row.game .bubble{background:linear-gradient(135deg,rgba(168,85,247,.12),rgba(236,72,153,.12));color:var(--label);max-width:80%;border-radius:3px;border-color:rgba(168,85,247,.2)}
    /* v1.57.3 [2026-05-12] — Incoming message avatar */
    .msg-row.in{display:flex;align-items:flex-end;gap:6px}
    .msg-avatar{width:24px;height:24px;border-radius:50%;background:rgba(6,182,212,.12);border:1px solid rgba(6,182,212,.3);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#67e8f9;flex-shrink:0;text-transform:uppercase}
    .bubble-time{display:block;font-size:11px;opacity:.5;margin-top:3px;text-align:right}
    .media-bubble{max-width:220px;padding:4px}
    .media-bubble img,.media-bubble video{width:100%;border-radius:14px;display:block}
    .voice-bubble{display:flex;align-items:center;gap:8px;min-width:160px}
    .voice-play-btn{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:14px}
    .voice-waveform{flex:1;height:20px;background:rgba(255,255,255,.15);border-radius:10px}
    .typing-indicator{display:flex;gap:4px;align-items:center;padding:10px 14px}
    /* v1.57.3 [2026-05-12] — Wave animation replaces scale bounce */
    @keyframes wave-dot{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}
    .typing-dot{width:7px;height:7px;border-radius:50%;background:var(--label3);animation:wave-dot 1.2s infinite}
    .typing-dot:nth-child(1){animation-delay:0s}
    .typing-dot:nth-child(2){animation-delay:.2s}
    .typing-dot:nth-child(3){animation-delay:.4s}

    /* Chat input */
    #chat-input-bar{background:var(--glass);backdrop-filter:blur(20px);border-top:.5px solid var(--sep);padding:8px 8px calc(var(--safe-b) - 16px);display:flex;align-items:flex-end;gap:8px;flex-shrink:0}
    .input-plus{width:32px;height:32px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--accent);flex-shrink:0}
    /* v1.57.3 [2026-05-12] — Input focus glow */
    #chat-input-wrap{flex:1;background:var(--bg3);border-radius:20px;border:.5px solid var(--sep);display:flex;align-items:flex-end;padding:6px 12px;transition:border-color .2s,box-shadow .2s}
    #chat-input-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px rgba(16,185,129,.15)}
    #chat-text-input{flex:1;background:none;border:none;outline:none;font-size:16px;color:var(--label);max-height:120px;resize:none;line-height:1.4;min-height:22px;overflow-y:hidden}
    #chat-text-input::placeholder{color:var(--label3)}
    #chat-send{width:32px;height:32px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;flex-shrink:0;transition:opacity .15s}
    #chat-send:disabled{opacity:.3}
    #attach-popup{position:absolute;bottom:64px;left:8px;background:var(--bg2);border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,.4);padding:8px 0;display:none;z-index:50;min-width:200px}
    #attach-popup.open{display:block}
    .attach-item{display:flex;align-items:center;gap:12px;padding:10px 16px;font-size:15px;cursor:pointer}
    .attach-item:active{background:var(--bg3)}
    .input-emoji{width:32px;height:32px;border-radius:50%;background:none;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;cursor:pointer;border:none;padding:0}
    .emoji-picker{display:flex;flex-wrap:wrap;gap:4px;padding:8px 12px;background:var(--bg2);border-top:.5px solid var(--sep);max-height:120px;overflow-y:auto}
    .emoji-btn{font-size:24px;cursor:pointer;padding:4px;border-radius:8px;transition:background .1s}
    .emoji-btn:hover{background:var(--bg3)}

    .fab{position:absolute;bottom:16px;right:16px;width:52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(10,132,255,.4);z-index:5;cursor:pointer}
    .fab:active{opacity:.8}

    /* ══════════════════════════════════════════════════════════
       GALLERY APP
    ══════════════════════════════════════════════════════════ */
    /* v1.57.3 [2026-05-12] — Featured-first gallery layout */
    .gallery-grid{overflow-y:auto;max-height:calc(100vh - 160px);padding:6px;display:flex;flex-direction:column;gap:6px}
    .gallery-featured-row{display:grid;grid-template-columns:2fr 1fr;gap:6px}
    .gallery-featured-main{height:130px;overflow:hidden}
    .gallery-featured-side{display:flex;flex-direction:column;gap:6px}
    .gallery-featured-sm{flex:1;overflow:hidden}
    .gallery-grid-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
    .gallery-item{aspect-ratio:1;overflow:hidden;cursor:pointer;background:var(--bg3);position:relative;border-radius:6px;border:1px solid rgba(16,185,129,0.12);transition:border-color 0.2s}
    .gallery-item:hover{border-color:rgba(16,185,129,0.4)}
    .gallery-item img,.gallery-item video{width:100%;height:100%;object-fit:cover;transition:transform .2s}
    .gallery-item:active img,.gallery-item:active video{transform:scale(.95)}
    .gallery-item .vid-badge{position:absolute;bottom:4px;right:4px;background:rgba(0,0,0,.6);color:#fff;font-size:10px;padding:1px 6px;border-radius:6px;pointer-events:none}
    #gallery-viewer{display:none;position:absolute;inset:0;background:rgba(0,0,0,.95);z-index:30;flex-direction:column;align-items:center;justify-content:center}
    #gallery-viewer.open{display:flex}
    #gallery-viewer img,#gallery-viewer video{max-width:100%;max-height:80%;object-fit:contain;border-radius:8px}
    #gallery-viewer .close-btn{position:absolute;top:60px;right:16px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;z-index:2}
    #gallery-viewer .nav-btn{position:absolute;top:50%;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;transform:translateY(-50%);cursor:pointer}
    #gallery-viewer .nav-prev{left:12px}
    #gallery-viewer .nav-next{right:12px}

    /* ══════════════════════════════════════════════════════════
       ARCADE APP
    ══════════════════════════════════════════════════════════ */
    .arcade-cabinet{position:absolute;inset:0;background:#111;display:flex;flex-direction:column}
    .arcade-header{height:50px;background:linear-gradient(90deg,#ff0080,#7928ca,#0070f3);display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex-shrink:0}
    .arcade-header h2{font-size:16px;font-weight:700;color:#fff;text-shadow:0 0 10px rgba(255,255,255,.5)}
    .arcade-back{color:#fff;font-size:14px;font-weight:600}
    .arcade-screen{flex:1;display:flex;align-items:center;justify-content:center;background:#000;position:relative}
    .arcade-screen canvas{image-rendering:pixelated;border:2px solid #333;border-radius:4px}
    .arcade-controls{height:140px;background:#1a1a1a;display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex-shrink:0}
    .arcade-dpad{width:120px;height:120px;position:relative}
    .dpad-btn{position:absolute;width:40px;height:40px;border-radius:8px;background:#333;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;border:1px solid #555}
    .dpad-btn:active{background:#555}

<script>
/* ── World / Ghost Integration ─────────────────────────────────── */
(function () {
  const _worldIncomingMessages = [];

  /* DOM helpers */
  function _renderIncomingPanel(container) {
    const existing = container.querySelector('#world-incoming-panel');
    if (existing) existing.remove();

    const panel = document.createElement('div');
    panel.id = 'world-incoming-panel';
    if (_worldIncomingMessages.length === 0) return;

    panel.innerHTML = `
      <div class="panel-header">
        <span class="panel-title">📡 INCOMING</span>
        <span class="panel-count" id="world-msg-count">${_worldIncomingMessages.length}</span>
      </div>
      <div id="world-msg-list"></div>
    `;
    const list = panel.querySelector('#world-msg-list');
    _worldIncomingMessages.slice(0, 5).forEach(m => {
      list.appendChild(_buildMsgItem(m, false));
    });
    container.insertBefore(panel, container.firstChild);
  }

  function _buildMsgItem(m, isNew) {
    const item = document.createElement('div');
    item.className = 'ghost-msg-item' + (isNew ? ' ghost-msg-new ghost-pulse' : '');
    const heat = m.heat_impact > 0 ? `<span class="heat-tag">+${m.heat_impact}🔥</span>` : '';
    const icon = m.type === 'ghost' ? '👾' : '🌐';
    item.innerHTML = `
      <div class="ghost-msg-sender">${icon} ${m.from || 'SYSTEM'}${heat}</div>
      <div class="ghost-msg-text">${m.text || ''}</div>
      <div class="ghost-msg-time">${m.time || ''}</div>
    `;
    return item;
  }

  function _prependNewMessage(m) {
    _worldIncomingMessages.unshift(m);
    if (_worldIncomingMessages.length > 10) _worldIncomingMessages.pop();
    const list = document.querySelector('#world-msg-list');
    if (list) {
      const item = _buildMsgItem(m, true);
      list.insertBefore(item, list.firstChild);
      const countEl = document.querySelector('#world-msg-count');
      if (countEl) countEl.textContent = _worldIncomingMessages.length;
    } else {
      /* panel not rendered yet — re-render next time messages app opens */
    }
  }

  /* World alert banner */
  function _showWorldAlert(data) {
    let banner = document.querySelector('#world-alert-banner');
    if (!banner) {
      banner = document.createElement('div');
      banner.id = 'world-alert-banner';
      banner.className = 'world-alert-banner';
      document.body.appendChild(banner);
    }
    banner.textContent = `⚠️ WORLD EVENT: ${data.title || 'Major event detected'}`;
    banner.classList.add('show');
    setTimeout(() => banner.classList.remove('show'), 5000);
  }

  /* Ghost Terminal modal */
  function openGhostTerminal() {
    const modal = document.createElement('div');
    modal.className = 'ghost-terminal-modal';
    modal.id = 'ghost-terminal-modal';
    modal.innerHTML = `
      <div class="ghost-terminal-sheet">
        <h3>👾 GHOST TERMINAL</h3>
        <p>Send an encrypted tip to 0xGH0ST. Intel pays 50₵.</p>
        <textarea class="ghost-input" id="ghost-input-text" placeholder="Enter intel for 0xGH0ST..."></textarea>
        <button class="ghost-send-btn" onclick="window._sendGhostTip()">TRANSMIT ⬆</button>
        <button class="pill-btn pill-secondary" style="width:100%;margin-top:8px;justify-content:center" onclick="document.querySelector('#ghost-terminal-modal').remove()">Cancel</button>
      </div>`;
    document.body.appendChild(modal);
    modal.onclick = e => { if (e.target === modal) modal.remove(); };
    setTimeout(() => document.querySelector('#ghost-input-text')?.focus(), 100);
  }

  window._sendGhostTip = async function () {
    const input = document.querySelector('#ghost-input-text');
    const msg = (input ? input.value : '').trim();
    if (!msg) return;
    try {
      const r = await fetch('/api/world/send_ghost', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: msg }),
      });
      const d = await r.json();
      document.querySelector('#ghost-terminal-modal')?.remove();
      if (typeof toast === 'function') {
        toast(d.ok ? `👾 Transmitted. +50₵ (Balance: ${d.balance}₵)` : `❌ ${d.error}`);
      }
    } catch (e) {
      if (typeof toast === 'function') toast('❌ Transmission failed');
    }
  };

  window.openGhostTerminal = openGhostTerminal;

  /* Fetch incoming messages from server */
  async function _fetchIncoming() {
    try {
      const r = await fetch('/api/world/incoming');
      const data = await r.json();
      if (Array.isArray(data) && data.length > 0) {
        _worldIncomingMessages.length = 0;
        data.forEach(m => _worldIncomingMessages.push(m));
      }
    } catch (e) { /* best-effort */ }
  }

  /* Patch Messages app render to inject INCOMING panel + GHOST button */
  function _patchMessagesApp() {
    const msgsApp = window.CosyPhone && window.CosyPhone.apps && window.CosyPhone.apps.messages;
    if (!msgsApp) return false;

    const origRender = msgsApp.render.bind(msgsApp);
    msgsApp.render = function (body) {
      origRender(body);
      /* Insert INCOMING panel before thread list */
      const threadList = body.querySelector('#msg-thread-list');
      if (threadList) {
        _renderIncomingPanel(body);
        /* Insert GHOST TERMINAL button after INCOMING panel */
        const btn = document.createElement('button');
        btn.className = 'ghost-terminal-btn';
        btn.innerHTML = '👾 GHOST TERMINAL <span style="margin-left:auto;font-size:11px;opacity:.6">+50₵</span>';
        btn.onclick = openGhostTerminal;
        body.insertBefore(btn, threadList);
      }
      _fetchIncoming().then(() => _renderIncomingPanel(body));
    };
    return true;
  }

  /* Wire socket events once socket is available */
  function _wireSocket() {
    const socket = window.CosyPhone && window.CosyPhone.socket;
    if (!socket) return false;
    socket.on('incoming_message', d => {
      _prependNewMessage(d);
    });
    socket.on('world_alert', d => {
      _showWorldAlert(d);
    });
    return true;
  }

  /* Poll until CosyPhone is ready */
  let _attempts = 0;
  const _poll = setInterval(() => {
    _attempts++;
    const patched = _patchMessagesApp();
    const wired = _wireSocket();
    if ((patched && wired) || _attempts > 50) clearInterval(_poll);
  }, 100);
})();
</script>
<script>
/* ── v1.57.3 [2026-05-12] — Phone / SIGNAL Visual Polish ──────────────────
   CONNECTS: gallery app, messages app, chat bubbles, typing indicator
   CALLED BY: poll loop — patches CosyPhone.apps after phone_v2.js loads
   ──────────────────────────────────────────────────────────────────────── */
(function () {

  // ──── Helpers ────────────────────────────────────────────────

  // v1.57.3 [2026-05-12] — Hex colour to RGB component object
  function hexToRgb(hex) {
    const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    return m ? { r: parseInt(m[1], 16), g: parseInt(m[2], 16), b: parseInt(m[3], 16) } : null;
  }

  // v1.57.3 [2026-05-12] — Ghost-signal typewriter on incoming messages
  function typewriterAppend(bubbleEl, text, speedMs) {
    speedMs = speedMs || 22;
    bubbleEl.textContent = '';
    bubbleEl.classList.add('typing-in');
    let i = 0;
    const tick = () => {
      bubbleEl.textContent += text[i++];
      if (i < text.length) setTimeout(tick, speedMs);
      else bubbleEl.classList.remove('typing-in');
    };
    setTimeout(tick, 0);
  }

  // ──── Gallery: featured-first layout helpers ──────────────────

  // v1.57.3 [2026-05-12] — Featured-first gallery layout
  function _makeGalleryItemEl(item, clickFn) {
    const div = document.createElement('div');
    div.className = 'gallery-item';
    div.onclick = clickFn;
    const media = (item.type === 'video')
      ? Object.assign(document.createElement('video'), { src: item.url, muted: true })
      : Object.assign(document.createElement('img'), { src: item.url, alt: '', loading: 'lazy' });
    media.style.cssText = 'width:100%;height:100%;object-fit:cover';
    div.appendChild(media);
    if (item.type === 'video') {
      const badge = document.createElement('span');
      badge.className = 'vid-badge';
      badge.textContent = '▶ VID';
      div.appendChild(badge);
    }
    return div;
  }

  function renderGalleryItems(container, items, clickFn) {
    container.innerHTML = '';
    if (!items || items.length === 0) return;
    // Featured row — first item large, items 2–3 in side column
    const featRow = document.createElement('div');
    featRow.className = 'gallery-featured-row';
    const mainEl = _makeGalleryItemEl(items[0], () => clickFn(0));
    mainEl.classList.add('gallery-featured-main');
    featRow.appendChild(mainEl);
    if (items.length >= 2) {
      const side = document.createElement('div');
      side.className = 'gallery-featured-side';
      const sm1 = _makeGalleryItemEl(items[1], () => clickFn(1));
      sm1.classList.add('gallery-featured-sm');
      side.appendChild(sm1);
      if (items.length >= 3) {
        const sm2 = _makeGalleryItemEl(items[2], () => clickFn(2));
        sm2.classList.add('gallery-featured-sm');
        side.appendChild(sm2);
      }
      featRow.appendChild(side);
    }
    container.appendChild(featRow);
    // Remaining items in 3-col grid
    const remaining = items.slice(Math.min(3, items.length));
    if (remaining.length > 0) {
      const gridRow = document.createElement('div');
      gridRow.className = 'gallery-grid-row';
      remaining.forEach((item, ri) => {
        const idx = Math.min(3, items.length) + ri;
        gridRow.appendChild(_makeGalleryItemEl(item, () => clickFn(idx)));
      });
      container.appendChild(gridRow);
    }
  }

  // ──── Patch Functions ────────────────────────────────────────

  // v1.57.3 [2026-05-12] — Patch gallery app to use featured-first layout
  function _patchGalleryApp() {
    const galleryApp = window.CosyPhone && window.CosyPhone.apps && window.CosyPhone.apps.gallery;
    if (!galleryApp) return false;
    if (galleryApp._polished) return true;
    galleryApp._polished = true;

    // Wrap _load to use renderGalleryItems after data fetch
    const orig_load = galleryApp._load.bind(galleryApp);
    galleryApp._load = async function () {
      const grid = document.querySelector('#gallery-grid');
      if (!grid) { await orig_load(); return; }
      try {
        // Re-implement load with featured layout; mirrors orig but uses renderGalleryItems
        const qs = (s) => document.querySelector(s);
        const data = await fetch('/api/gallery').then(r => r.json());
        this._images = data.images || [];
        if (!this._images.length) {
          grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="es-icon">📷</div><h3>No media yet</h3><p>Photos and videos will appear here</p></div>';
          return;
        }
        renderGalleryItems(grid, this._images, (i) => {
          this._idx = i;
          this._showMedia();
          const viewer = qs('#gallery-viewer');
          if (viewer) viewer.style.display = 'flex';
        });
      } catch (e) {
        grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="es-icon">📷</div><h3>No photos yet</h3></div>';
      }
    };
    return true;
  }

  // v1.57.3 [2026-05-12] — Patch thread rendering for unread state + per-contact accent
  function _patchMessagesPolish() {
    const msgsApp = window.CosyPhone && window.CosyPhone.apps && window.CosyPhone.apps.messages;
    if (!msgsApp) return false;
    if (msgsApp._polished) return true;
    msgsApp._polished = true;

    // ── Thread list: unread + accent ──────────────────────────
    const origRenderThreads = msgsApp._renderThreads.bind(msgsApp);
    msgsApp._renderThreads = function () {
      origRenderThreads();
      const list = document.querySelector('#msg-thread-list');
      if (!list) return;
      const items = list.querySelectorAll('.thread-item');
      const threads = this.threads || [];
      items.forEach((el, i) => {
        const t = threads[i];
        if (!t) return;
        // Unread class based on t.unread (external JS uses t.unread, not t.unread_count)
        if ((t.unread || t.unread_count || 0) > 0) {
          el.classList.add('unread');
        }
        // Per-contact accent colour
        const accentHex = t.accent_color || '#10b981';
        const accentRgb = hexToRgb(accentHex);
        if (accentRgb) {
          el.style.setProperty('--contact-accent', accentHex);
          el.style.setProperty('--contact-accent-rgb', accentRgb.r + ' ' + accentRgb.g + ' ' + accentRgb.b);
        }
      });
    };

    // ── Bubble: typewriter for live incoming socket msgs ──────
    // NOTE: phone_v2.js already inserts .avatar.avatar-xs for incoming rows;
    // we skip re-adding an avatar to avoid duplication and only apply typewriter.
    const origAppendMsg = msgsApp._appendMsg.bind(msgsApp);
    msgsApp._appendMsg = function (msg, batch) {
      origAppendMsg(msg, batch);
      // Typewriter only for new live incoming text messages (not history batch)
      const isOut = msg.sender_id === 'user';
      const isSys = msg.sender_id === 'system' || msg.msg_type === 'system';
      if (batch || isOut || isSys) return;
      if (msg.msg_type === 'voice' || msg.msg_type === 'photo' || msg.msg_type === 'video') return;
      const box = document.querySelector('#chat-messages');
      if (!box) return;
      const rows = box.querySelectorAll('.msg-row.in');
      if (!rows.length) return;
      const lastRow = rows[rows.length - 1];
      const bubble = lastRow.querySelector('.bubble');
      // Only apply typewriter to text bubbles (those with a .bubble-time timestamp span)
      if (!bubble || !bubble.querySelector('.bubble-time')) return;
      // Extract text and timestamp
      const timeSpan = bubble.querySelector('.bubble-time');
      // Get text node content (textContent of all non-span children)
      let text = '';
      bubble.childNodes.forEach(n => {
        if (n.nodeType === Node.TEXT_NODE) text += n.textContent;
      });
      text = text.trim();
      if (!text || text.length < 2) return;
      // Clear and rebuild with typewriter
      bubble.textContent = '';
      const frag = document.createElement('span');
      frag.className = '_tw-wrap';
      bubble.appendChild(frag);
      typewriterAppend(frag, text);
      if (timeSpan) {
        setTimeout(() => { bubble.appendChild(timeSpan); }, text.length * 22 + 50);
      }
    };

    return true;
  }

  // ──── Poll until CosyPhone is ready ─────────────────────────

  let _polishAttempts = 0;
  const _polishPoll = setInterval(() => {
    _polishAttempts++;
    const g = _patchGalleryApp();
    const m = _patchMessagesPolish();
    if ((g && m) || _polishAttempts > 80) clearInterval(_polishPoll);
  }, 100);

})();
</script>
</body>
