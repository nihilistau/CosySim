<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>CosyPhone OS</title>
  <style>
    /* ══════════════════════════════════════════════════════════
       CosyPhone OS — Design Tokens
    ══════════════════════════════════════════════════════════ */
    :root {
      --bg:        #000000;
      --bg2:       #1C1C1E;
      --bg3:       #2C2C2E;
      --bg4:       #3A3A3C;
      --glass:     rgba(30,30,30,.72);
      --glass2:    rgba(255,255,255,.08);
      --sep:       rgba(84,84,88,.55);
      --label:     #FFFFFF;
      --label2:    rgba(235,235,245,.6);
      --label3:    rgba(235,235,245,.3);
      --accent:    #0A84FF;
      --accent2:   #5E5CE6;
      --green:     #30D158;
      --orange:    #FF9F0A;
      --red:       #FF453A;
      --pink:      #FF375F;
      --yellow:    #FFD60A;
      --teal:      #64D2FF;
      --purple:    #BF5AF2;
      --bubble-out:#0A84FF;
      --bubble-in: #3A3A3C;
      --tab-h:     80px;
      --bar-h:     44px;
      --status-h:  48px;
      --safe-b:    34px;
      --radius:    14px;
      --radius-lg: 20px;
      --font:      -apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue","Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;
      --wallpaper: linear-gradient(135deg, #1a1a2e 0%, #16213e 25%, #0f3460 50%, #533483 75%, #e94560 100%);
    }
    [data-theme="light"] {
      --bg:     #F2F2F7; --bg2: #FFFFFF; --bg3: #F2F2F7; --bg4: #E5E5EA;
      --glass:  rgba(249,249,249,.72); --glass2: rgba(0,0,0,.04);
      --sep:    rgba(60,60,67,.18); --label: #000000;
      --label2: rgba(60,60,67,.6); --label3: rgba(60,60,67,.3);
      --bubble-in: #E5E5EA;
    }

    /* ── Reset ──────────────────────────────────── */
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;background:#000;font-family:var(--font);color:var(--label);overscroll-behavior:none;-webkit-user-select:none;user-select:none}
    button{border:none;background:none;cursor:pointer;font-family:var(--font);color:inherit}
    input,textarea{font-family:var(--font)}
    a{color:var(--accent);text-decoration:none}
    ::-webkit-scrollbar{width:0}

    /* ══════════════════════════════════════════════════════════
       PHONE SHELL
    ══════════════════════════════════════════════════════════ */
    #phone{display:flex;flex-direction:column;height:100%;max-width:430px;margin:0 auto;position:relative;overflow:hidden;background:var(--bg)}

    /* Wallpaper layer */
    #wallpaper{position:absolute;inset:0;z-index:0;background:var(--wallpaper);background-size:cover;background-position:center}

    /* Status bar */
    #status-bar{height:var(--status-h);display:flex;align-items:center;justify-content:space-between;padding:12px 20px 0;font-size:14px;font-weight:600;color:#fff;z-index:100;position:relative}
    #status-bar .time{font-size:16px;font-weight:700;letter-spacing:.3px}
    #status-bar .icons{display:flex;gap:5px;align-items:center;font-size:12px}

    /* ── Lock Screen ─────────────────────────── */
    #lock-screen{position:absolute;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#fff;cursor:pointer;transition:opacity .4s,transform .4s}
    #lock-screen.hidden{opacity:0;transform:translateY(-100%);pointer-events:none}
    #lock-time{font-size:72px;font-weight:200;letter-spacing:-2px}
    #lock-date{font-size:18px;font-weight:400;opacity:.8}
    #lock-hint{position:absolute;bottom:60px;font-size:14px;opacity:.5;animation:pulse 2s infinite}
    @keyframes pulse{0%,100%{opacity:.3}50%{opacity:.7}}

    /* ── Home Screen ─────────────────────────── */
    #home-screen{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;padding-top:var(--status-h);transition:opacity .3s}
    #home-screen.hidden{opacity:0;pointer-events:none}

    .app-grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:16px 8px;padding:40px 20px 20px;align-content:start}
    .app-icon{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;-webkit-tap-highlight-color:transparent}
    .app-icon:active .icon-box{transform:scale(.88)}
    .icon-box{width:60px;height:60px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:28px;transition:transform .15s;position:relative;box-shadow:0 2px 8px rgba(0,0,0,.3)}
    .icon-box .notif-badge{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;padding:0 5px;border-radius:9px;display:flex;align-items:center;justify-content:center;border:2px solid #000}
    .app-name{font-size:11px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);text-align:center;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    /* Dock */
    .dock{background:rgba(30,30,30,.6);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-radius:24px;margin:8px 16px;padding:12px 8px;display:grid;grid-template-columns:repeat(4,1fr);gap:0}
    .dock .app-icon .app-name{display:none}

    /* ── App Container ───────────────────────── */
    #app-container{position:absolute;inset:0;z-index:80;display:none;flex-direction:column;background:var(--bg)}
    #app-container.open{display:flex}

    /* App header */
    .app-header{height:calc(var(--status-h) + var(--bar-h));background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:.5px solid var(--sep);display:flex;align-items:flex-end;padding:0 8px 8px;gap:4px;flex-shrink:0;z-index:10}
    .app-back{font-size:17px;color:var(--accent);padding:0 8px;height:34px;display:flex;align-items:center;gap:2px;flex-shrink:0}
    .app-back span{font-size:28px;line-height:1;margin-top:-2px}
    .app-title{flex:1;text-align:center;font-size:17px;font-weight:600;line-height:34px}
    .app-header-right{display:flex;gap:4px;min-width:44px;justify-content:flex-end}

    /* App body */
    .app-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative}

    /* ══════════════════════════════════════════════════════════
       COMMON APP STYLES
    ══════════════════════════════════════════════════════════ */
    .section-header{padding:20px 16px 8px;font-size:28px;font-weight:700}
    .section-sub{padding:0 16px 12px;font-size:13px;color:var(--label2);text-transform:uppercase;font-weight:600;letter-spacing:.5px}
    .list-group{background:var(--bg2);border-radius:var(--radius);margin:0 16px 16px;overflow:hidden}
    .list-row{display:flex;align-items:center;padding:12px 16px;gap:12px;border-bottom:.5px solid var(--sep);cursor:pointer;transition:background .1s}
    .list-row:last-child{border-bottom:none}
    .list-row:active{background:var(--bg3)}
    .list-icon{font-size:22px;width:32px;text-align:center;flex-shrink:0}
    .list-label{flex:1;font-size:16px}
    .list-value{font-size:15px;color:var(--label2)}
    .list-chevron{color:var(--label3);font-size:14px}
    .danger-label{color:var(--red)}

    .empty-state{padding:60px 24px;text-align:center;color:var(--label2)}
    .empty-state .es-icon{font-size:56px;margin-bottom:16px}
    .empty-state h3{font-size:20px;font-weight:600;color:var(--label);margin-bottom:6px}
    .empty-state p{font-size:14px;line-height:1.5}

    #toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(50,50,50,.9);backdrop-filter:blur(10px);color:#fff;padding:10px 20px;border-radius:22px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:9999;white-space:nowrap}
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    .pill-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:20px;font-size:14px;font-weight:600;transition:opacity .15s}
    .pill-btn:active{opacity:.7}
    .pill-primary{background:var(--accent);color:#fff}
    .pill-secondary{background:var(--bg3);color:var(--label)}
    .pill-danger{background:var(--red);color:#fff}

    /* ══════════════════════════════════════════════════════════
       MESSAGES APP
    ══════════════════════════════════════════════════════════ */
    .thread-list{padding:0;overflow-y:auto;max-height:calc(100vh - var(--status-h) - var(--bar-h) - 20px);-webkit-overflow-scrolling:touch}
    .thread-item{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--bg2);border-bottom:.5px solid var(--sep);cursor:pointer;transition:background .15s}
    .thread-item:active{background:var(--bg3)}
    .avatar{width:52px;height:52px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;font-weight:600;flex-shrink:0;overflow:hidden}
    .avatar img{width:100%;height:100%;object-fit:cover}
    .avatar-sm{width:32px;height:32px;font-size:13px}
    .avatar-xs{width:24px;height:24px;font-size:10px}
    .thread-info{flex:1;min-width:0}
    .thread-name{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .thread-preview{font-size:14px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
    .thread-meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
    .thread-time{font-size:12px;color:var(--label3)}
    .unread-badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}

    /* Chat screen */
    #chat-screen{display:none;flex-direction:column;position:absolute;inset:0;background:var(--bg);z-index:20}
    #chat-screen.open{display:flex}
    #chat-nav{height:calc(var(--status-h) + var(--bar-h));background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:.5px solid var(--sep);display:flex;align-items:flex-end;padding:0 8px 8px;gap:6px;flex-shrink:0}
    #chat-back{font-size:17px;color:var(--accent);padding:0 4px;height:34px;display:flex;align-items:center;gap:2px}
    #chat-back span:first-child{font-size:28px;line-height:1}
    #chat-title{flex:1;text-align:center;font-size:16px;font-weight:600;line-height:34px}
    #chat-messages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:3px}
    .msg-row{display:flex;align-items:flex-end;gap:6px;max-width:100%}
    .msg-row.out{justify-content:flex-end}
    .msg-row.in{justify-content:flex-start}
    .msg-row.sys{justify-content:center}
    .bubble{max-width:75%;padding:8px 12px;border-radius:18px;font-size:16px;line-height:1.4;word-break:break-word;position:relative}
    .msg-row.out .bubble{background:var(--bubble-out);color:#fff;border-bottom-right-radius:4px}
    .msg-row.in .bubble{background:var(--bubble-in);color:var(--label);border-bottom-left-radius:4px}
    .msg-row.sys .bubble{background:var(--glass2);color:var(--label2);font-size:13px;max-width:85%;border-radius:10px;text-align:center}
    .msg-row.game .bubble{background:linear-gradient(135deg,#5856D6,#AF52DE);color:#fff;max-width:80%;border-radius:14px}
    .bubble-time{display:block;font-size:11px;opacity:.5;margin-top:3px;text-align:right}
    .media-bubble{max-width:220px;padding:4px}
    .media-bubble img,.media-bubble video{width:100%;border-radius:14px;display:block}
    .voice-bubble{display:flex;align-items:center;gap:8px;min-width:160px}
    .voice-play-btn{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:14px}
    .voice-waveform{flex:1;height:20px;background:rgba(255,255,255,.15);border-radius:10px}
    .typing-indicator{display:flex;gap:4px;align-items:center;padding:10px 14px}
    .typing-dot{width:7px;height:7px;border-radius:50%;background:var(--label3);animation:tdot 1.2s infinite}
    .typing-dot:nth-child(2){animation-delay:.2s}
    .typing-dot:nth-child(3){animation-delay:.4s}
    @keyframes tdot{0%,80%,100%{transform:scale(.6)}40%{transform:scale(1)}}

    /* Chat input */
    #chat-input-bar{background:var(--glass);backdrop-filter:blur(20px);border-top:.5px solid var(--sep);padding:8px 8px calc(var(--safe-b) - 16px);display:flex;align-items:flex-end;gap:8px;flex-shrink:0}
    .input-plus{width:32px;height:32px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--accent);flex-shrink:0}
    #chat-input-wrap{flex:1;background:var(--bg3);border-radius:20px;border:.5px solid var(--sep);display:flex;align-items:flex-end;padding:6px 12px}
    #chat-text-input{flex:1;background:none;border:none;outline:none;font-size:16px;color:var(--label);max-height:120px;resize:none;line-height:1.4;min-height:22px}
    #chat-text-input::placeholder{color:var(--label3)}
    #chat-send{width:32px;height:32px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;flex-shrink:0;transition:opacity .15s}
    #chat-send:disabled{opacity:.3}
    #attach-popup{position:absolute;bottom:64px;left:8px;background:var(--bg2);border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,.4);padding:8px 0;display:none;z-index:50;min-width:200px}
    #attach-popup.open{display:block}
    .attach-item{display:flex;align-items:center;gap:12px;padding:10px 16px;font-size:15px;cursor:pointer}
    .attach-item:active{background:var(--bg3)}
    .input-emoji{width:32px;height:32px;border-radius:50%;background:none;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;cursor:pointer;border:none;padding:0}
    .emoji-picker{display:flex;flex-wrap:wrap;gap:4px;padding:8px 12px;background:var(--bg2);border-top:.5px solid var(--sep);max-height:120px;overflow-y:auto}
    .emoji-btn{font-size:24px;cursor:pointer;padding:4px;border-radius:8px;transition:background .1s}
    .emoji-btn:hover{background:var(--bg3)}

    .fab{position:absolute;bottom:16px;right:16px;width:52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(10,132,255,.4);z-index:5;cursor:pointer}
    .fab:active{opacity:.8}

    /* ══════════════════════════════════════════════════════════
       GALLERY APP
    ══════════════════════════════════════════════════════════ */
    .gallery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:2px;overflow-y:auto;max-height:calc(100vh - 160px)}
    .gallery-item{aspect-ratio:1;overflow:hidden;cursor:pointer;background:var(--bg3);position:relative}
    .gallery-item img,.gallery-item video{width:100%;height:100%;object-fit:cover;transition:transform .2s}
    .gallery-item:active img,.gallery-item:active video{transform:scale(.95)}
    .gallery-item .vid-badge{position:absolute;bottom:4px;right:4px;background:rgba(0,0,0,.6);color:#fff;font-size:10px;padding:1px 6px;border-radius:6px;pointer-events:none}
    #gallery-viewer{display:none;position:absolute;inset:0;background:rgba(0,0,0,.95);z-index:30;flex-direction:column;align-items:center;justify-content:center}
    #gallery-viewer.open{display:flex}
    #gallery-viewer img,#gallery-viewer video{max-width:100%;max-height:80%;object-fit:contain;border-radius:8px}
    #gallery-viewer .close-btn{position:absolute;top:60px;right:16px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;z-index:2}
    #gallery-viewer .nav-btn{position:absolute;top:50%;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;transform:translateY(-50%);cursor:pointer}
    #gallery-viewer .nav-prev{left:12px}
    #gallery-viewer .nav-next{right:12px}

    /* ══════════════════════════════════════════════════════════
       ARCADE APP
    ══════════════════════════════════════════════════════════ */
    .arcade-cabinet{position:absolute;inset:0;background:#111;display:flex;flex-direction:column}
    .arcade-header{height:50px;background:linear-gradient(90deg,#ff0080,#7928ca,#0070f3);display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex-shrink:0}
    .arcade-header h2{font-size:16px;font-weight:700;color:#fff;text-shadow:0 0 10px rgba(255,255,255,.5)}
    .arcade-back{color:#fff;font-size:14px;font-weight:600}
    .arcade-screen{flex:1;display:flex;align-items:center;justify-content:center;background:#000;position:relative}
    .arcade-screen canvas{image-rendering:pixelated;border:2px solid #333;border-radius:4px}
    .arcade-controls{height:140px;background:#1a1a1a;display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex-shrink:0}
    .arcade-dpad{width:120px;height:120px;position:relative}
    .dpad-btn{position:absolute;width:40px;height:40px;border-radius:8px;background:#333;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;border:1px solid #555}
    .dpad-btn:active{background:#555}
    .dpad-up{top:0;left:40px}
    .dpad-down{bottom:0;left:40px}
    .dpad-left{top:40px;left:0}
    .dpad-right{top:40px;right:0}
    .dpad-center{top:40px;left:40px;border-radius:50%;background:#222;border-color:#444}
    .arcade-btns{display:flex;gap:16px}
    .arcade-btn{width:52px;height:52px;border-radius:50%;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid}
    .btn-a{background:#e74c3c;border-color:#c0392b;color:#fff;box-shadow:0 0 12px rgba(231,76,60,.4)}
    .btn-b{background:#3498db;border-color:#2980b9;color:#fff;box-shadow:0 0 12px rgba(52,152,219,.4)}
    .arcade-menu{position:absolute;inset:0;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:5}
    .arcade-menu h1{font-size:24px;font-weight:800;background:linear-gradient(90deg,#ff0080,#7928ca,#0070f3);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:16px}
    .arcade-game-btn{width:200px;padding:12px;border-radius:12px;background:#222;border:1px solid #444;color:#fff;font-size:15px;font-weight:600;text-align:center;cursor:pointer;transition:background .15s}
    .arcade-game-btn:hover{background:#333}
    .arcade-game-btn .score{font-size:11px;color:#888;margin-top:2px}
    .arcade-hud{position:absolute;top:8px;left:0;right:0;display:flex;justify-content:space-between;padding:0 12px;font-size:12px;font-weight:700;color:#0f0;font-family:monospace;z-index:2;text-shadow:0 0 6px #0f0}
    .arcade-gameover{position:absolute;inset:0;background:rgba(0,0,0,.85);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:5;color:#fff}
    .arcade-gameover.show{display:flex}
    .arcade-gameover h2{font-size:28px;font-weight:800;color:#ff0080}
    .arcade-gameover .final-score{font-size:20px;font-weight:600}

    /* ══════════════════════════════════════════════════════════
       GAMES WITH FRIENDS APP
    ══════════════════════════════════════════════════════════ */
    .gwf-card{margin:12px 16px;background:var(--bg2);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:transform .15s}
    .gwf-card:active{transform:scale(.97)}
    .gwf-banner{height:100px;display:flex;align-items:center;justify-content:center;font-size:42px}
    .gwf-body{padding:14px 16px}
    .gwf-title{font-size:17px;font-weight:700}
    .gwf-desc{font-size:13px;color:var(--label2);margin-top:4px;line-height:1.4}
    .gwf-active{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--green);font-weight:600}
    .gwf-active-dot{width:8px;height:8px;border-radius:50%;background:var(--green)}

    /* Word Chain game */
    .wc-board{padding:16px}
    .wc-chain{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;min-height:40px}
    .wc-word{padding:6px 12px;border-radius:16px;font-size:14px;font-weight:600}
    .wc-word.user{background:var(--accent);color:#fff}
    .wc-word.ai{background:var(--purple);color:#fff}
    .wc-input-row{display:flex;gap:8px}
    .wc-input{flex:1;height:40px;background:var(--bg3);border:1px solid var(--sep);border-radius:20px;padding:0 16px;font-size:15px;color:var(--label);outline:none}
    .wc-input:focus{border-color:var(--accent)}

    /* Trivia game */
    .trivia-q{padding:24px 16px;font-size:18px;font-weight:600;line-height:1.5;text-align:center}
    .trivia-options{padding:0 16px;display:flex;flex-direction:column;gap:10px}
    .trivia-opt{padding:14px 16px;background:var(--bg2);border:2px solid var(--sep);border-radius:var(--radius);font-size:16px;cursor:pointer;transition:all .2s}
    .trivia-opt:active{transform:scale(.98)}
    .trivia-opt.correct{background:#1a3a1a;border-color:var(--green);color:var(--green)}
    .trivia-opt.wrong{background:#3a1a1a;border-color:var(--red);color:var(--red)}
    .trivia-score-bar{display:flex;justify-content:space-between;padding:16px;font-size:14px;font-weight:600}

    /* RPS game */
    .rps-arena{display:flex;flex-direction:column;align-items:center;gap:24px;padding:32px 16px}
    .rps-vs{display:flex;align-items:center;gap:24px}
    .rps-hand{width:80px;height:80px;border-radius:50%;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:40px;border:3px solid var(--sep)}
    .rps-hand.win{border-color:var(--green);box-shadow:0 0 20px rgba(48,209,88,.3)}
    .rps-hand.lose{border-color:var(--red);box-shadow:0 0 20px rgba(255,69,58,.3)}
    .rps-choices{display:flex;gap:12px}
    .rps-choice{width:64px;height:64px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:32px;border:2px solid var(--sep);cursor:pointer;transition:transform .15s,border-color .15s}
    .rps-choice:active{transform:scale(.9)}
    .rps-choice:hover{border-color:var(--accent)}
    .rps-result{font-size:20px;font-weight:700;min-height:28px}

    /* ══════════════════════════════════════════════════════════
       MOOD RING APP (custom showcase)
    ══════════════════════════════════════════════════════════ */
    .mood-ring{width:160px;height:160px;border-radius:50%;margin:32px auto;border:6px solid;display:flex;align-items:center;justify-content:center;font-size:56px;transition:border-color .5s,box-shadow .5s}
    .mood-cards{padding:0 16px;display:flex;flex-direction:column;gap:10px}
    .mood-card{background:var(--bg2);border-radius:var(--radius);padding:14px 16px;display:flex;align-items:center;gap:12px}
    .mood-card .mc-emoji{font-size:28px}
    .mood-card .mc-info{flex:1}
    .mood-card .mc-name{font-size:15px;font-weight:600}
    .mood-card .mc-mood{font-size:13px;color:var(--label2);margin-top:2px}
    .mood-card .mc-bar{height:4px;background:var(--bg3);border-radius:2px;margin-top:6px;overflow:hidden}
    .mood-card .mc-fill{height:100%;border-radius:2px;transition:width .5s}

    /* ══════════════════════════════════════════════════════════
       NEWS APP (custom showcase)
    ══════════════════════════════════════════════════════════ */
    .news-card{margin:12px 16px;background:var(--bg2);border-radius:var(--radius);overflow:hidden}
    .news-img{height:160px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:48px}
    .news-content{padding:14px 16px}
    .news-headline{font-size:17px;font-weight:700;line-height:1.3}
    .news-excerpt{font-size:14px;color:var(--label2);margin-top:6px;line-height:1.5}
    .news-meta{display:flex;justify-content:space-between;margin-top:10px;font-size:12px;color:var(--label3)}
    .news-loading{padding:40px;text-align:center;color:var(--label2)}
    .news-loading .spinner{width:24px;height:24px;border:3px solid var(--bg3);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* ══════════════════════════════════════════════════════════
       SETTINGS APP
    ══════════════════════════════════════════════════════════ */
    .setting-toggle{width:48px;height:28px;border-radius:14px;background:var(--bg4);position:relative;cursor:pointer;transition:background .2s;flex-shrink:0}
    .setting-toggle.on{background:var(--green)}
    .setting-toggle::after{content:'';position:absolute;width:24px;height:24px;border-radius:50%;background:#fff;top:2px;left:2px;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
    .setting-toggle.on::after{transform:translateX(20px)}

    .wallpaper-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px 16px}
    .wp-item{aspect-ratio:.6;border-radius:12px;cursor:pointer;border:3px solid transparent;overflow:hidden;transition:border-color .2s}
    .wp-item.selected{border-color:var(--accent)}

    /* ══════════════════════════════════════════════════════════
       VOICE MESSAGES + VIDEO MESSAGES
    ══════════════════════════════════════════════════════════ */
    .voice-msg-item{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--bg2);border-bottom:.5px solid var(--sep)}
    .vm-play{width:40px;height:40px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;flex-shrink:0;cursor:pointer}
    .vm-info{flex:1}
    .vm-sender{font-size:15px;font-weight:600}
    .vm-time{font-size:12px;color:var(--label2);margin-top:2px}
    .vm-duration{font-size:13px;color:var(--label3);flex-shrink:0}
    .vm-wave{height:28px;background:var(--bg3);border-radius:14px;margin-top:6px;overflow:hidden;position:relative}
    .vm-wave-fill{height:100%;background:var(--accent);border-radius:14px;width:0;transition:width .1s linear}

    .video-thumb{width:80px;height:80px;border-radius:12px;background:var(--bg3);overflow:hidden;flex-shrink:0;position:relative;display:flex;align-items:center;justify-content:center}
    .video-thumb video,.video-thumb img{width:100%;height:100%;object-fit:cover}
    .video-thumb .play-overlay{position:absolute;inset:0;background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff}

    /* ══════════════════════════════════════════════════════════
       ANIMATIONS
    ══════════════════════════════════════════════════════════ */
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @keyframes scaleIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
    .anim-fadeIn{animation:fadeIn .3s ease}
    .anim-scaleIn{animation:scaleIn .25s ease}
  </style>
