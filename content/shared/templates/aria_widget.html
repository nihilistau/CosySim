<!--
  CosySim Aria Portrait Widget
  ============================
  Animated Aria portrait — pure CSS, no external images required.
  Replaces the placeholder aria_idle.png widget with a geometric SVG face
  that reacts to voice events via CSS state animations.

  Include in any scene template:
    {% include 'shared/templates/aria_widget.html' %}

  Modes: floating | messenger | voice-call | full-portrait
  States: idle (breathing) | talking (mouth) | thinking (eyes) | listening (glow)

  Public API:
    window.AriaPortrait.setState(state)
    window.AriaPortrait.setMode(mode)
    window.AriaPortrait.toggleMode()
    window.AriaPortrait.minimize()

  Voice events consumed automatically:
    voice:speaking · voice:done · voice:listening · aria:thinking

  Backward-compat shim: window.ariaWidget.setState / .open / .toggle
-->
<link rel="stylesheet" href="/shared/static/css/cosysim-aria-portrait.css">
<script src="/shared/static/js/cosysim-aria-portrait.js" defer></script>
