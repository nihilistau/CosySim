<!-- Portrait Overlay Component -->
<div id="cs-portrait-overlay" class="cs-portrait" data-state="hidden">
  <div class="cs-portrait__panel">
    <div class="cs-portrait__image-area" id="cs-portrait-img-area">
      <img id="cs-portrait-img" src="" alt="" class="cs-portrait__img" />
      <div class="cs-portrait__placeholder">
        <span class="cs-portrait__placeholder-icon">◈</span>
      </div>
    </div>
    <div class="cs-portrait__meta">
      <div class="cs-portrait__name" id="cs-portrait-name"></div>
      <div class="cs-portrait__mood-badge" id="cs-portrait-mood"></div>
    </div>
  </div>
  <!-- Backstory panel — slides in below portrait on demand -->
  <div id="cs-backstory-panel" class="cs-backstory-panel" aria-live="polite">
    <button id="cs-backstory-close" class="cs-backstory-close" aria-label="Close">✕</button>
    <div id="cs-backstory-text" class="cs-backstory-text"></div>
  </div>
</div>
