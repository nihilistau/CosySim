<!-- reputation_hud.html — NPC reputation badge, injected into all scene responses -->
<div id="cs-rep-hud" class="cs-rep-hud" aria-live="polite" aria-label="NPC reputation" style="display:none">
  <span class="cs-rep-name" id="cs-rep-name">NPC</span>
  <span class="cs-rep-bar-wrap" aria-hidden="true">
    <span class="cs-rep-bar" id="cs-rep-bar"></span>
  </span>
  <span class="cs-rep-score" id="cs-rep-score">0</span>
  <span class="cs-rep-label" id="cs-rep-label">neutral</span>
</div>
