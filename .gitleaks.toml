# Gitleaks config for CosySim — extends the default ruleset.
# Used by the pre-commit hook (scripts/hooks/pre-commit) and can be run
# manually with:  gitleaks git --pre-commit --staged

[extend]
useDefault = true

# ──── Custom rules ────────────────────────────────────────────────
# gitleaks' default ruleset does NOT catch Google account session
# cookies or LMStudio tokens — both of which leaked into CosySim's
# public history (2026-08-03). These close that gap so a re-committed
# heap dump / cookie jar is blocked at commit time.

[[rules]]
id = "google-session-cookie"
description = "Google account session cookie (SID/SAPISID/APISID/etc.)"
regex = '''(?i)\b(?:__Secure-[13]P)?(?:SAPISID|APISID|SID|HSID|SSID|SIDCC|LOGIN_INFO)\b\s*[=:]\s*['"]?(?:g\.a000[\w./-]{20,}|[\w./+-]{20,})'''
keywords = ["sapisid", "apisid", "__secure-1papisid", "__secure-3papisid", "sidcc"]

[[rules]]
id = "lmstudio-token"
description = "LMStudio API token"
regex = '''sk-lm-[A-Za-z0-9]{6,}:[A-Za-z0-9]{10,}'''
keywords = ["sk-lm-"]

[[allowlists]]
description = "Known-safe placeholders and scrub markers"
regexes = [
  '''AIzaSyA0{31}''',                # dummy Google key used in tests
  '''sk-lm-YOUR_TOKEN_HERE''',       # .env.example placeholder
  '''REDACTED-GOOGLE-API-KEY''',     # history-scrub marker (2026-08-03)
  '''REDACTED-LMSTUDIO-TOKEN''',     # history-scrub marker (2026-08-03)
  '''ghp_ABCDEF[A-Za-z0-9]*''',      # docs placeholder token
  '''ghp_0{5,}''',                   # docs placeholder token
  '''2wpiqnS6W3104MQz7mwfyQjME6d''', # Sesame RudderStack write key (3rd-party recon; write keys are public by design)
  '''8c76a2abba5510ab798298c7e6185fbf''', # Sesame Sentry DSN (3rd-party recon; DSNs are public by design)
  '''gemma-2-9b-instruct''',         # model name, not a secret
]
