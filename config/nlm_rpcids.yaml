appcatalyst:
  meta:
    service_name: AppCatalyst
    grpc_host: appcatalyst.pa.googleapis.com
    base_path: /v1beta1
    auth_method: api_key + oauth
    source: labs.google.har
    confirmed: '2026-07-14'
    notes: >
      AppCatalyst is Google's internal application builder API. It provides DIRECT
      model access to Gemini models including Gemini 3 Flash Preview via standard
      REST endpoints. This is distinct from AI Studio's gRPC-web protocol — it uses
      simple REST with API key auth. The v1beta1 prefix indicates pre-GA status.
      Critical discovery: provides createCachedContent for server-side content caching.
  endpoints:
    check_app_access:
      path: /v1beta1/checkAppAccess
      method: POST
      description: Check if current user has access to an app/project
      category: auth
    create_cached_content:
      path: /v1beta1/cachedContents
      method: POST
      description: Create cached content for reuse across requests
      category: optimization
      notes: >
        Server-side content caching — could dramatically reduce token usage for
        repeated context. Critical for our Nexus → LLM pipeline efficiency.
    execute_step:
      path: /v1beta1/executeStep
      method: POST
      description: Execute a single step in an agent workflow
      category: agent
      notes: Agent-style step execution — implies AppCatalyst supports multi-step agent workflows
    generate_webpage_stream:
      path: /v1beta1/generateWebpageStream
      method: POST
      description: Generate webpage content via streaming
      category: generation
      notes: Streaming webpage generation — likely powers Google's web creation tools
    get_email_preferences:
      path: /v1beta1/getEmailPreferences
      method: GET
      description: Get email notification preferences
      category: account
    set_email_preferences:
      path: /v1beta1/setEmailPreferences
      method: POST
      description: Update email notification preferences
      category: account
    get_location:
      path: /v1beta1/getLocation
      method: GET
      description: Get user location context
      category: context
    generate_content:
      path: /v1beta1/models/{model}:generateContent
      method: POST
      description: Direct model inference — non-streaming
      category: inference
      models_confirmed:
        - gemini-2.5-flash
        - gemini-3-flash-preview
      notes: >
        Direct REST endpoint for model inference. Confirmed access to Gemini 3
        Flash Preview — this is the newest model available. Uses API key auth,
        not OAuth, making it potentially accessible for automation.
    stream_generate_content:
      path: /v1beta1/models/{model}:streamGenerateContent
      method: POST
      description: Direct model inference — streaming (SSE)
      category: inference
      models_confirmed:
        - gemini-2.5-flash
        - gemini-3-flash-preview
      notes: >
        Streaming variant of generateContent. Returns SSE stream with partial
        responses. Key endpoint for real-time inference integration.

