client_side_gating:
  meta:
    description: 'Comprehensive reference for client-side gating mechanisms discovered across Google Workspace services.  These
      are parameters that control feature access, tier limits, and model selection — all enforced client-side only, meaning
      they can be modified freely.

      '
    source: argus_har_capture_2026-07
    last_verified: '2026-07-14'
  tier_markers:
    description: 'Tier marker values that control access to Free vs Pro features. All are client-side only — no server-side
      enforcement observed.

      '
    positions:
      stream_generate: body[0][5][0] — [1]=Free, [2]=Pro
      quota_summary: body[2][0] — context code position
      nlm_batchexecute: Varies by rpcid — see notebooklm.operations.*.parameters.tier_marker
    values:
      1: Free tier — basic model, lower token limits
      2: Pro tier — advanced model, higher token limits, priority processing
    bypass_confirmed: true
    notes: 'Setting [2] on a free account WORKS — the server respects the tier marker value from the client payload without
      server-side validation. This gives free accounts access to Pro-tier Gemini capabilities.

      '
  controllable_parameters:
    response_length:
      values:
        4: default
        1: longer
        2: shorter
      position: Varies by endpoint
      notes: Controls response verbosity
    doc_type:
      values:
        2: brief
        9: deep/long-form
      notes: Controls document generation depth
    analysis_depth:
      values:
        1: summary
        2: detailed
      notes: Controls analysis thoroughness
    write_config:
      format: '[[model_tier, quality_level]]'
      values:
        model_tier: '[1]=standard, [2]=pro'
        quality_level: 1=standard
    source_config:
      format: '[1, null*9, [1]]'
      notes: Source creation flags — first element enables, last array controls type
    guide_type:
      values:
        1: Study Guide
        2: FAQ
        3: Briefing Doc
        4: Table of Contents
        5: Timeline
    audio_type:
      values:
        1: Deep Dive
        2: Brief Overview
        3: Critical Analysis
        4: Debate
    page_size:
      default: 20
      range: 1-100 (some endpoints)
      notes: Configurable for listing operations
    share_level:
      values:
        0: private
        1: anyone_with_link
    research_depth:
      range: 1-10
      notes: 1=shallow, 10=exhaustive
  feature_flags:
    source: experiments.get_experiment_flags
    known:
      isRoot: Document/file root ownership
      isActive: Account active state
      isCollaboratorAccount: Shared/collaboration status
      isFamilyLinkAccount: Family link restriction
      isShared: File sharing state
    notes: 'Feature flags are returned by the PeopleStack Experiments service. They control feature availability at the account
      and document level. Monitoring these flags can reveal new features before public launch.

      '
