      category: generation
      streaming: true
      description: "Generate document content from a prompt via Docs Gemini"
      notes: >
        Delegates to workspace_gemini.stream_generate with document_type='docs'.
        Includes current document context (surrounding paragraphs, style info).

    match_style:
      path: "via_workspace_gemini"
