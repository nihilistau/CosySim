    protocol: "grpc_web_json"
    source: "argus_har_capture_2026-07"
    last_verified: "2026-07-14"
    notes: >
      PeopleStack provides user lookup, autocomplete, and collaboration
      features used across all Google Workspace apps.  Uses gRPC-web
      protocol (application/json+protobuf).  Two API keys observed for
      different endpoint groups.

  operations:
    autocomplete:
      path: "/$rpc/peoplestack.PeopleStackAutocompleteService/Autocomplete"
      method: "POST"
      api_key: "AIzaSyDPU3TWHmg0FmLJIrGonio1GD6KQVrPRz4"
      category: search
      description: "Autocomplete people/contacts for sharing and @mentions"
      notes: >
        Returns matching contacts as the user types.  Used in sharing dialogs,
        @mention dropdowns, and collaborator assignment.  Results include name,
        email, photo URL, and organizational info.
      parameters:
        query: "Partial name or email address"
        max_results: 10
        context: "Calling context — sharing, mention, assignment"

    autocomplete_alt:
