# ═══════════════════════════════════════════════════════════════════════════════
# Google Workspace Gemini — appsgenaiserver-pa endpoints
# Discovered via ARGUS HAR mining (Sheets, Docs, Drive)
# These endpoints are shared across all Workspace apps when using Gemini features.
# ═══════════════════════════════════════════════════════════════════════════════
workspace_gemini:
  meta:
    service_name: "AppsGenAIServer"
    base_url: "https://appsgenaiserver-pa.clients6.google.com"
    auth_method: "api_key_query_param_plus_sapisidhash"
    api_key_param: "key"
    protocol: "grpc-json-transcoding"
    content_type: "application/json+protobuf"
    streaming: true
    transfer_encoding: "chunked"
    source: "argus_har_capture_2026-07"
    last_verified: "2026-07-08"
    notes: >
      Shared Gemini backend for Google Workspace apps (Sheets, Docs, Slides).
      Uses BOTH API key in query param AND SAPISIDHASH cookies for auth.
      Payloads are protobuf-JSON arrays (nested lists), NOT dict-style JSON.
      Context code 3=Sheets, 1=Docs determines app-specific behaviour.
    api_keys:
      sheets: "AIzaSyAkthrhpXoRv6M12CMqGivGO-rCfsy2AxU"
      docs: "AIzaSyCmh4zG9srkxnlT2O2FRJLrxBOBRaWWxNk"
    context_codes:
      sheets: 3
      docs: 1
    mime_types:
      sheets: "application/vnd.google-apps.ritz"
      docs: "application/vnd.google-apps.kix"

  operations:
    stream_generate:
      path: "/v1/genai/streamGenerate"
      method: "POST"
      category: generation
      streaming: true
      description: "Stream-based Gemini text generation for Workspace apps"
      notes: >
        Core generation endpoint.  Payload is a protobuf-JSON array:
        [[op_code, null, context_array, prompt_array, null, [null,null,1], 1], [null,null,1]].
        Operation codes: 61=init, 23=generate(sheets), 96=generate(docs), 16=continue, 15=insert.
        Prompt format varies by context:
          Sheets (op=23): body[0][3] = [null, null, "prompt_text", ...27 nulls, "0"]
          Docs (op=96):   body[0][3] = [null, null, null, [[[null, null, "prompt_text"]]]]
        Response is a single-line JSON array (not SSE chunks) with deeply nested text.
      parameters:
        op_code: "61=init, 23=generate_sheets, 96=generate_docs, 16=continue"
        context_code: "3=sheets, 1=docs (body[0][2][0])"
        session_id: "Format: goog_-NNNNNNNNNN (body[0][2][4])"
        document_id: "Spreadsheet/doc ID in doc reference (body[0][2][7+])"
        document_mime: "ritz=sheets, kix=docs"
        session_token: "Encrypted token ~1617 chars at body[0][8] (optional)"

    get_settings:
      path: "/v1/genai/getSettings"
      method: "POST"
      category: config
      streaming: false
      description: "Get current Gemini settings for the user"
      notes: >
        Payload: [[ctx, ctx]] where ctx=3 for Sheets, ctx=1 for Docs.
        Response: [null,[1,null,1,0]] or [[["timestamp",epoch],0,1],[1,null,1,0]].

    list_gems:
      path: "/v1/genai/listGems"
      method: "POST"
      category: discovery
      streaming: false
      description: "List available Gemini models and capabilities (gems)"
      notes: >
        Payload: [ctx, language_code, [...optional_context...]].
        Returns gem definitions with names, descriptions, starter prompts, and
        colour schemes.  Known gems include: sentiment-analyzer, writing-editor.

    quota_summary:
      path: "/v1/genai/quotaSummary"
      method: "POST"
      category: quota
      streaming: false
      description: "Get Gemini API usage quota summary"
      notes: >
        Payload: [null, 1, [ctx]].
        Response: [[null,["total",null,"remaining",status,null,null,["reset_epoch"]],"used",[ctx],1],[]].
        Example: total=10000000, remaining=9999998, used="2", reset_epoch="1775026800".

    update_settings:
      path: "/v1/genai/updateUserSettings"
      method: "POST"
      category: config
      streaming: false
      description: "Update user Gemini preferences"
      notes: >
        Payload: [[], [ctx, ctx], null, 1].
        Response: [[["timestamp",epoch],0,1]].

