# ═══════════════════════════════════════════════════════════════════════════════
# Google Drive v2internal — Internal Drive API (elevated capabilities)
# ═══════════════════════════════════════════════════════════════════════════════
drive_v2internal:
  meta:
    service_name: "DriveV2Internal"
    base_url: "https://clients6.google.com"
    auth_method: "api_key_query_param_plus_sapisidhash"
    protocol: "rest_json"
    source: "argus_har_capture_2026-07"
    last_verified: "2026-07-14"
    notes: >
      Internal Drive v2 API — provides file CRUD, permissions management,
      and upload capabilities.  Uses API keys in query params plus
      SAPISIDHASH auth.  Different API keys for different operation types.
      This is the INTERNAL API (v2internal) which exposes capabilities
      not available in the public Drive v3 API.
    api_keys:
      files_upload: "AIzaSyBWdFphCtg4EBuxpHu9EhAjyIiY9C-4Uq4"
      files_read: "AIzaSyAGzWfHQsxTHRSNkBG0DVRYon-iLYCkzCc"
      permissions: "AIzaSyCdvSDZmdqokt5jTUat-x7mWlUoDCZzHHc"
    common_params:
      supportsTeamDrives: true
      includeTeamDriveItems: true
      enforceSingleParent: true
      supportsAllDrives: true

  operations:
    upload_file:
      path: "/upload/drive/v2internal/files"
      method: "POST"
      api_key: "AIzaSyBWdFphCtg4EBuxpHu9EhAjyIiY9C-4Uq4"
      category: upload
      content_type: "multipart/related; boundary=..."
      description: "Upload file to Drive with metadata (multipart)"
      notes: >
        Multipart upload — first part is JSON metadata, second is file content.
        Returns full file metadata including alternateLink for browser access.
        The reason=1523 param identifies the caller context (Sheets=1523).
      parameters:
        uploadType: "multipart"
        fields: "alternateLink,title,id,mimeType,parents"
        reason: "1523 (Sheets caller), other values for other contexts"
        pinned: false
      response_fields:
        id: "Drive file ID"
        title: "File name"
        mimeType: "MIME type"
        alternateLink: "Browser URL to open the file"
        parents: "Parent folder(s)"

    get_file:
      path: "/drive/v2internal/files/{file_id}"
      method: "GET"
      api_key: "AIzaSyAGzWfHQsxTHRSNkBG0DVRYon-iLYCkzCc"
      category: read
      description: "Get file metadata from Drive"
      parameters:
        file_id: "Drive file ID"
        fields: "Comma-separated field mask — id,title,mimeType,modifiedDate,owners,capabilities"
        supportsTeamDrives: true
        includeTeamDriveItems: true

    list_files:
      path: "/drive/v2internal/files"
      method: "GET"
      api_key: "AIzaSyAGzWfHQsxTHRSNkBG0DVRYon-iLYCkzCc"
      category: list
      description: "List/search files in Drive"
      parameters:
        q: "Search query — e.g. 'title contains \"report\"', 'mimeType = \"application/vnd.google-apps.spreadsheet\"'"
        fields: "items(id,title,mimeType,modifiedDate),nextPageToken"
        maxResults: 100
        supportsTeamDrives: true
        includeTeamDriveItems: true

    get_permissions:
      path: "/drive/v2internal/files/{file_id}/permissions"
      method: "GET"
      api_key: "AIzaSyCdvSDZmdqokt5jTUat-x7mWlUoDCZzHHc"
      category: permissions
      description: "List permissions on a Drive file"
      parameters:
        file_id: "Drive file ID"
        fields: "items(emailAddress,role,type,id)"
        supportsAllDrives: true

    update_file:
      path: "/drive/v2internal/files/{file_id}"
      method: "PUT"
      api_key: "AIzaSyAGzWfHQsxTHRSNkBG0DVRYon-iLYCkzCc"
      category: update
      description: "Update file metadata (title, description, parents)"
      parameters:
        file_id: "Drive file ID"
        fields: "id,title,modifiedDate"
        supportsTeamDrives: true

    copy_file:
      path: "/drive/v2internal/files/{file_id}/copy"
      method: "POST"
      api_key: "AIzaSyAGzWfHQsxTHRSNkBG0DVRYon-iLYCkzCc"
      category: copy
      description: "Copy a file in Drive (e.g. template duplication)"
      parameters:
        file_id: "Source file ID"
        fields: "id,title,alternateLink"
        body: "JSON with title, parents, description overrides"

    trash_file:
      path: "/drive/v2internal/files/{file_id}/trash"
      method: "POST"
      api_key: "AIzaSyAGzWfHQsxTHRSNkBG0DVRYon-iLYCkzCc"
      category: delete
      description: "Move file to trash in Drive"
      parameters:
        file_id: "Drive file ID"

    insert_permission:
      path: "/drive/v2internal/files/{file_id}/permissions"
      method: "POST"
      api_key: "AIzaSyCdvSDZmdqokt5jTUat-x7mWlUoDCZzHHc"
      category: permissions
      description: "Add/modify sharing permissions on a Drive file"
      parameters:
        file_id: "Drive file ID"
        sendNotificationEmails: false
        supportsAllDrives: true
        body_format: "JSON — {role, type, emailAddress, withLink}"
      roles:
        owner: "Full ownership transfer"
        organizer: "Team Drive organizer"
        fileOrganizer: "File organizer in Team Drive"
        writer: "Can edit"
        commenter: "Can comment"
        reader: "Can view"

    export_file:
      path: "/drive/v2internal/files/{file_id}/export"
      method: "GET"
      api_key: "AIzaSyAGzWfHQsxTHRSNkBG0DVRYon-iLYCkzCc"
      category: export
      description: "Export a Google Workspace file in a specified format"
      parameters:
        file_id: "Drive file ID (must be a Google Workspace file type)"
        mimeType: "Target MIME type — text/plain, text/html, application/pdf, text/csv"
      mime_types:
        text: "text/plain"
        html: "text/html"
        pdf: "application/pdf"
        csv: "text/csv"
        docx: "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
        xlsx: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"

# ═══════════════════════════════════════════════════════════════════════════════
# Google Sheets Extended — Additional Sheets operations beyond Gemini
# ═══════════════════════════════════════════════════════════════════════════════
sheets_extended:
  meta:
    service_name: "GoogleSheetsExtended"
    base_url: "https://docs.google.com"
    auth_method: "cookie_sapisidhash"
    protocol: "mixed_form_json"
    source: "argus_har_capture_2026-07"
    last_verified: "2026-07-14"
    notes: >
      Extended Sheets operations discovered via HAR mining.  These are internal
      endpoints that provide capabilities beyond the public Sheets v4 API.
      Authentication is via session cookies + SAPISIDHASH.  Most use form-encoded
      requests with internal proto-text format.

  operations:
    save:
      path: "/spreadsheets/u/0/d/{spreadsheet_id}/save"
      method: "POST"
      category: write
      content_type: "multipart/form-data"
      description: "Save spreadsheet changes with commands bundle"
      notes: >
        Multipart form data — includes a commands JSON bundle with cell updates,
        formatting changes, formula modifications, and sheet structure changes.
        Used for batch write operations that bypass the public API limits.
      parameters:
        spreadsheet_id: "Target spreadsheet ID"
        id: "Spreadsheet numeric ID"
        sid: "Session ID"
        vc: "Version counter — increments with each save"
        c: "Change counter"
        w: "Writer ID (format: xx-NNNNNNNNNNN)"
        flr: "Flush revision number"
        smv: "Sheet model version"
        smb: "Sheet model build"
        token: "CSRF token (from document load)"
        ouid: "Owner user ID"

    get_prefs:
      path: "/spreadsheets/u/0/d/{spreadsheet_id}/prefs"
      method: "POST"
      category: config
      content_type: "application/x-www-form-urlencoded"
      description: "Get/set session preferences for spreadsheet editing"
      notes: >
        Sets or retrieves per-session editing preferences.  The body contains
        JSON preferences in a form field.  Used to configure auto-recalc,
        locale, timezone, and other session-level settings.
      parameters:
        spreadsheet_id: "Target spreadsheet ID"
        prefs_body: "JSON object with preference keys"

    external_data_batch:
      path: "/spreadsheets/u/0/d/{spreadsheet_id}/externaldata/fetchData"
      method: "POST"
      category: enrichment
      content_type: "application/x-www-form-urlencoded"
      description: "Batch fetch external data for multiple cell ranges"
      notes: >
        Extended version of external_data_fetch supporting multiple ranges
        and complex protobuf-text payloads.  Used by IMPORTDATA, IMPORTHTML,
        IMPORTFEED, IMPORTXML and 'Fill with Gemini' enrichment.
      parameters:
        spreadsheet_id: "Target spreadsheet ID"
        ranges: "Multiple cell ranges to fill"
        data_sources: "Array of external data source configs"

    get_revision_history:
      path: "/spreadsheets/u/0/d/{spreadsheet_id}/revisions"
      method: "GET"
      category: history
      description: "Get version history/revisions for a spreadsheet"
      notes: >
        Returns the revision history including timestamps, editors,
        and change summaries.  Useful for audit trails and undo.
      parameters:
        spreadsheet_id: "Target spreadsheet ID"
        maxResults: 100

# ═══════════════════════════════════════════════════════════════════════════════
# People Stack — User/people services for Workspace collaboration
# ═══════════════════════════════════════════════════════════════════════════════
people_stack:
