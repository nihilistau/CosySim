      form data with internal proto-text format (e.g. {1=14,17={1=136#prompt text...}}), NOT protobuf-JSON arrays like the
      streamGenerate endpoint.  Responses have )]}\'' XSS protection prefix followed by JSON.

      '
  operations:
    columnsmith_execute:
      path: /spreadsheets/u/0/d/{spreadsheet_id}/columnsmith/execute
      method: POST
      category: transformation
      streaming: false
      content_type: application/x-www-form-urlencoded
      description: AI-driven column transformation — applies Gemini to cell ranges
      notes: 'Columnsmith runs Gemini on a column of data to transform, classify, extract, or enrich each row.  Payload uses
        internal proto-text format in the request body, NOT JSON.  Response starts with )]}'' prefix.

        '
      parameters:
        spreadsheet_id: Target spreadsheet ID
        column: Target column letter or range (e.g. C2:C100)
        formula: Natural language transformation instruction
        source_columns: Input column(s) to read from (e.g. A2:B100)
    external_data_fetch:
      path: /spreadsheets/u/0/d/{spreadsheet_id}/externaldata/fetchData
      method: POST
      category: enrichment
      streaming: false
      content_type: application/x-www-form-urlencoded
      description: Fetch and inject external data into sheet cells
      notes: 'Used by ''Fill with Gemini'' to pull web data, research, or computed values into a cell range.  Payload uses
        internal proto-text format. Response starts with )]}'' prefix.

        '
      parameters:
        spreadsheet_id: Target spreadsheet ID
        range: Cell range to fill (e.g. B2:B50)
        prompt: What data to fetch/compute for each row
  stream_generate_template:
    description: Protobuf-JSON payload for Sheets Gemini streamGenerate (from jackpot HAR)
    source: docs.-google.com-sheets-gemini-jackpot.har
    endpoint: /v1/genai/streamGenerate
    method: POST
    content_type: application/json+protobuf
    auth: api_key_query_param
    payload_structure:
      format: positional array (protobuf-JSON transcoding)
      fields:
        '[0]': sequence_id (integer, increments per request)
        '[1]': null (reserved)
        '[2][0]': product_id (3 = Sheets, identifies calling app)
        '[2][4]': api_key_hash (string like 'goog_-NNNN', negative integer hash)
        '[2][5][0][0]': session_context_flags (integer, 1=initial, 0=continuation)
        '[2][5][0][4]': session_hash (hex string, unique per session)
        '[2][5][0][8]': continuation_flag (1=new session, 0=continue)
        '[2][5][0][10]': spreadsheet_context (nested category/scene arrays)
        '[2][6]': turn_number (string '0','1','2' - conversation turn index)
        '[2][7]': spreadsheet_data_context (nested cell data from active sheet)
        '[2][-1]': 'user_prompt_text (nested in triple array: [[[null,null,''prompt text'']]])'
      example_product_ids:
        '3': Google Sheets
        '1': Google Docs (inferred)
        '2': Google Slides (inferred)
    known_api_keys: &id001
    - AIzaSyAkthrhpXoRv6M12CMqGivGO-rCfsy2AxU
    - AIzaSyCB6OnnfuitFnaYWu4BvtGKaoLFk4cm-GE
    - AIzaSyDf32okzEbtG3DbBXzU_UvsWsetuHFFUiQ
    - AIzaSyBvuuU20zeaBQb-M8WEzJVwxQ1lI4k1cXY
    - AIzaSyD2io-Kkh49oO30SyPhbrurJXHMeUHhpOM
    response_format:
      type: chunked streaming
      content_type: application/json+protobuf
      segments: sequential indexed arrays with formatting metadata
      fields:
        '[0]': response_sequence_index
        '[1]': text_content (string)
        '[2]': formatting_metadata (array of format descriptors)
