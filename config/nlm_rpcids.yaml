# NLM Quota Events — Client-side observables for rate-limit detection
# ═══════════════════════════════════════════════════════════════════════════════
# Discovered via ARGUS heap dump (2026-03-05). These are RxJS observable names
# that fire when the NLM SPA detects a quota has been hit. Useful for
# client-side detection before the server returns 429.
quota_events:
  audio_overview:
    observable: "audioOverviewQuotaReached$"
    description: "Fires when audio overview generation quota is exhausted."
    detection: "Listen via `__zone_symbol__ON_PROPERTYquotaReached` or SPA globals."
  deep_research:
    observable: "deepResearchQuotaReached$"
    description: "Fires when deep research quota is exhausted."
  notebook_limit:
    observable: "notebookLimitReached$"
    description: "Fires when max notebook count is reached (100 free / 500 pro)."
  source_limit:
    observable: "sourceLimitReached$"
    description: "Fires when max sources per notebook is reached (50 free / 300 pro)."

