      notes: "Same endpoint, different key — likely for rate-limit distribution."

    warmup:
      path: "/$rpc/peoplestack.PeopleStackAutocompleteService/Warmup"
      method: "POST"
      api_key: "AIzaSyDPU3TWHmg0FmLJIrGonio1GD6KQVrPRz4"
      category: performance
      description: "Pre-warm people autocomplete service"
      notes: >
        Fire-and-forget call to pre-load contact data and ML models for
        faster autocomplete responses.  Similar pattern to Gemini prewarm.

