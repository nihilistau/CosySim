# ═══════════════════════════════════════════════════════════════════════════════
# NotebookLM RPC Registry — Single Source of Truth
# ═══════════════════════════════════════════════════════════════════════════════
#
# Every batchexecute rpcid, payload template, configurable parameter, and
# shared config object lives here.  Both nlm_direct_client.py and
# nlm_live_proxy.py consume this registry through nlm_rpc_registry.py.
#
# The tier_marker and model parameters are CLIENT-SIDE hints — the server
# honours whatever values we send regardless of actual account tier.
# Tested: free-tier accounts can select pro-tier models and limits.
#
# Maintainer: Copilot + ARGUS rpcid detection pipeline
# Last verified: 2026-06-10 via live CDP traffic capture
# ═══════════════════════════════════════════════════════════════════════════════

meta:
  version: "4.0"
  updated: "2026-06-10"
  base_url: "https://notebooklm.google.com"
  rpc_path: "/_/LabsTailwindUi/data/batchexecute"
  grpc_chat_path: >-
    /_/LabsTailwindUi/data/
    google.internal.labs.tailwind.orchestration.v1.
    LabsTailwindOrchestrationService/GenerateFreeFormStreamed
  build_label_prefix: "boq_labs-tailwind-frontend_"

# ─── Configurable Parameters ─────────────────────────────────────────────────
# These are client-side values we embed in payloads.  The server respects
# whatever we send — tier gating is NOT enforced server-side.
parameters:
  tier_marker:
    description: "Account tier hint sent to NLM. Server does NOT enforce gating."
    type: array
    default: [2]
    options:
      free: [1]
      pro: [2]
      # Experimental — try [3] for Ultra-tier features if available
      ultra: [3]

  response_length:
    description: "Controls verbosity of NLM response payloads."
    type: integer
    default: 4
    options:
      default: 4
      longer: 1
      shorter: 2

  doc_type:
    description: "Document/note output format."
    type: integer
    default: 2
    options:
      brief: 2
      deep: 9

  analysis_depth:
    description: "Depth of notebook structural analysis (VfAZjd)."
    type: integer
    default: 2
    options:
      summary: 1
      detailed: 2

  page_size:
    description: "Number of results per page for list/thread RPCs."
    type: integer
    default: 20

  share_level:
    description: "Notebook sharing level."
    type: integer
    default: 1
    options:
      private: 0
      anyone_with_link: 1

  audio_type:
    description: "Audio overview format."
    type: integer
    default: 1
    options:
      deep_dive: 1
      brief: 2
      critique: 3
      debate: 4

  guide_type:
    description: "Structured guide format."
    type: integer
    default: 1
    options:
      study: 1
      faq: 2
      briefing: 3
      toc: 4
      timeline: 5

  research_depth:
    description: "Deep research intensity level."
    type: integer
    default: 5
    options:
      shallow: 1
      medium: 3
      deep: 5
      exhaustive: 10

  model_quality:
    description: >
      Model quality hint embedded in write_config [[tier, quality]].
      Higher values may select more capable Gemini variants.
    type: array
    default: [2, 1]
    options:
      standard: [2, 1]
      high: [2, 2]
      # Experimental — try different combinations
      fast: [1, 1]
      ultra: [3, 1]

# ─── Shared Config Objects ────────────────────────────────────────────────────
# Reusable payload fragments referenced by multiple operations.
shared_configs:
  write_config:
    description: >
      Write operation metadata envelope used by generate_doc (ciyUvf),
      save_report (R7cb6c), and audio options (sqTeoe).
      Structure: [doc_type, null, null, source_config, [model_quality]]
    value: [2, null, null, [1, null, null, null, null, null, null, null, null, null, [1]], [[2, 1]]]
    configurable_slots:
      0: doc_type
      4: model_quality

  source_config:
    description: >
      Source creation metadata envelope used by add_source (izAoDd),
      register_files (o4cbdc), and create_notebook (CCqFvf).
      Position 0 = create flag (1=new), position 10 = feature flags.
    value: [1, null, null, null, null, null, null, null, null, null, [1]]
    configurable_slots:
      0: "create_flag (1=create new)"

# ─── RPC Operations ──────────────────────────────────────────────────────────
# Each operation defines:
#   rpcid          — current (Pro-tier) rpcid string
#   fallback_rpcid — legacy (Free-tier) rpcid, used as retry if primary fails
#   payload        — template with $param references to parameters above
#   requires_notebook — whether source-path includes /notebook/<id>
#   timeout        — default timeout in seconds
#   confirmed      — date this rpcid was last verified via HAR/CDP
#   category       — functional group (session|notebook|source|chat|artifact|research|account|webrtc)
#   description    — human-readable purpose
#   response_hint  — brief note on how to parse the response
operations:

  # ──── Session / Account ────────────────────────────────────────────────────

  session_init:
    rpcid: "ZwVcOc"
    fallback_rpcid: null
    payload: []
    requires_notebook: false
    timeout: 15
    confirmed: "2026-02-20"
    category: session
    description: "Initialize NLM browser session; also returns user plan/quota limits."
    response_hint: "[session_token, account_info, ...]"
    service_method: null
    aliases: [user_plan]

  get_feature_flags:
    rpcid: "ozz5Z"
    fallback_rpcid: null
    payload: "$flag_ids_payload"
    requires_notebook: false
    timeout: 30
    confirmed: "2026-02-20"
    category: account
    description: "Probe feature flags and account state/storage quota."
    response_hint: "Nested flag_id → value mappings."
    service_method: null
    aliases: [account_state, user_quota]

  get_locale:
    rpcid: "DYBcR"
    fallback_rpcid: null
    payload: [null]
    requires_notebook: false
    timeout: 15
    confirmed: "2026-06-10"
    category: account
    description: "Return user locale, language, and regional preferences."
    response_hint: "[locale, language, region]"
    service_method: null

  mutate_account:
    rpcid: null
    fallback_rpcid: null
    payload: []
    requires_notebook: false
    timeout: 30
    confirmed: "2026-03-05"
    category: account
    description: "Account mutation (settings, preferences). Discovered via ARGUS heap."
    response_hint: "Unknown — needs live capture."
    service_method: "LabsTailwindOrchestrationService.MutateAccount"
    source: argus_heap

  generate_access_token:
    rpcid: null
    fallback_rpcid: null
    payload: []
    requires_notebook: false
    timeout: 30
    confirmed: "2026-03-05"
    category: account
    description: "Generate access token for API operations. Discovered via ARGUS heap."
    response_hint: "Unknown — needs live capture."
    service_method: "LabsTailwindOrchestrationService.GenerateAccessToken"
    source: argus_heap

  submit_feedback:
    rpcid: null
    fallback_rpcid: null
    payload: []
    requires_notebook: false
    timeout: 30
    confirmed: "2026-03-05"
    category: account
    description: "Submit user feedback to NLM. Discovered via ARGUS heap."
    response_hint: "Unknown — needs live capture."
    service_method: "LabsTailwindOrchestrationService.SubmitFeedback"
    source: argus_heap

  # ──── Notebook CRUD ────────────────────────────────────────────────────────

  list_notebooks:
    rpcid: "wXbhsf"
    fallback_rpcid: "ub2Bae"
    payload: [null, 1, null, "$tier_marker"]
    fallback_payload: ["$tier_marker"]
    requires_notebook: false
    timeout: 30
    confirmed: "2026-06-10"
    category: notebook
    description: "List all notebooks for the authenticated account."
    response_hint: >
      Pro (wXbhsf): [[ [nb1, nb2, ...] ]] — each nb is [title, null, uuid, ...]
      Legacy (ub2Bae): [[[nb_obj, ...]]] — each nb_obj has UUID and name strings.
    service_method: "LabsTailwindOrchestrationService.ListRecentlyViewedProjects"
    notes: >
      Same rpcid as list_sources (wXbhsf) but called WITHOUT notebook context.
      With notebook context it lists sources instead.
    configurable:
      - tier_marker

  create_notebook:
    rpcid: "CCqFvf"
    fallback_rpcid: "VqhFhd"
    payload: ["$title", null, null, "$tier_marker", "$source_config"]
    fallback_payload: ["$title", null, null]
    requires_notebook: false
    timeout: 30
    confirmed: "2026-06-10"
    category: notebook
    description: "Create a new empty notebook."
    response_hint: >
      Pro (CCqFvf): [title, null, uuid, ...] — UUID at index 2.
      Legacy (VqhFhd): [uuid, title, ...] — UUID at index 0.
    service_method: "LabsTailwindOrchestrationService.CreateProject"
    configurable:
      - tier_marker
      - source_config

  delete_notebook:
    rpcid: "WWINqb"
    fallback_rpcid: "kVoZqc"
    payload: [["$notebook_id"], "$tier_marker"]
    fallback_payload: [["$notebook_id"]]
    requires_notebook: false
    timeout: 30
    confirmed: "2026-06-10"
    category: notebook
    description: "Delete a notebook by UUID."
    response_hint: "Minimal acknowledgement."
    service_method: "LabsTailwindOrchestrationService.RemoveRecentlyViewedProject"
    configurable:
      - tier_marker

  rename_notebook:
    rpcid: "s0tc2d"
    fallback_rpcid: null
    payload: ["$notebook_id", [[null, null, null, [null, "$new_name"]]]]
    requires_notebook: true
    timeout: 30
    confirmed: "2026-02-28"
    category: notebook
    description: "Rename a notebook."
    response_hint: "[new_name, null, notebook_id, emoji, ...]"
    service_method: null

  open_notebook:
    rpcid: "CCqFvf"
    fallback_rpcid: null
    payload: []
    requires_notebook: true
    timeout: 30
    confirmed: "2026-02-27"
    category: notebook
    description: "Open/resume last active notebook — returns notebook state."
    response_hint: "Notebook ID and metadata."
    service_method: "LabsTailwindOrchestrationService.GetProject"
    notes: "Same rpcid as create_notebook but called WITH notebook context."

  load_notebook:
    rpcid: "rLM1Ne"
    fallback_rpcid: null
    payload: ["$notebook_id", null, "$tier_marker", null, 0]
    requires_notebook: true
    timeout: 30
    confirmed: "2026-02-20"
    category: notebook
    description: "Load notebook with full source processing status."
    response_hint: "Per-source metadata with word_count (0 = still processing)."
    service_method: "LabsTailwindOrchestrationService.GetProject"
    configurable:
      - tier_marker
    aliases: [source_status, poll_source_status]

  get_notebook_info:
    rpcid: "e3bVqc"
    fallback_rpcid: null
    payload: [null, null, "$notebook_id"]
    requires_notebook: true
    timeout: 30
    confirmed: "2026-02-20"
    category: notebook
    description: "Get raw notebook content/document structure."
    response_hint: "Nested document structure."
    service_method: "LabsTailwindOrchestrationService.GetProject"
    aliases: [notebook_state]

  get_notebook_details:
    rpcid: "JFMDGd"
    fallback_rpcid: null
    payload: ["$notebook_id", "$tier_marker"]
    requires_notebook: true
    timeout: 30
    confirmed: "2026-02-24"
    category: notebook
    description: "Get notebook details: user profile, email, queries remaining."
    response_hint: "[[email, name, ...], null, queries_remaining, ...]"
    service_method: "LabsTailwindOrchestrationService.GetProjectAnalytics"
    configurable:
      - tier_marker
    aliases: [user_profile]

  get_notebook_analysis:
    rpcid: "VfAZjd"
    fallback_rpcid: null
    payload: ["$notebook_id", ["$analysis_depth"]]
    requires_notebook: true
    timeout: 60
    confirmed: "2026-02-20"
    category: notebook
    description: "Get AI structural analysis of notebook: themes, clusters, coverage."
    response_hint: "Nested text structure — join _extract_strings(data, 50)."
    service_method: "LabsTailwindOrchestrationService.GetMagicIndex"
    configurable:
      - analysis_depth
    aliases: [ai_summary, notebook_content]

  get_notebook_metadata:
    rpcid: "mFtdI"
    fallback_rpcid: null
    payload: ["$notebook_id"]
    requires_notebook: true
    timeout: 30
    confirmed: "2026-06-10"
    category: notebook
    description: "Fetch metadata for a single notebook (title, created_at, source_count)."
    response_hint: "Notebook metadata dict."
    service_method: "LabsTailwindOrchestrationService.GetProject"

  share_notebook:
    rpcid: "dI5Y8"
    fallback_rpcid: null
    payload: ["$notebook_id", "$share_level"]
    requires_notebook: false
    timeout: 30
    confirmed: "2026-06-10"
    category: notebook
    description: "Get or create a shareable link for a notebook."
    response_hint: "[shareable_url]"
    service_method: null
    configurable:
      - share_level

  get_shared_notebook:
    rpcid: "jzEKsc"
    fallback_rpcid: null
    payload: ["$share_token"]
    requires_notebook: false
    timeout: 30
    confirmed: "2026-06-10"
    category: notebook
    description: "Access a notebook shared by another user via share token."
    response_hint: "Shared notebook metadata."
    service_method: null

  remove_recently_viewed:
    rpcid: null
    fallback_rpcid: null
    payload: []
    requires_notebook: false
    timeout: 30
    confirmed: "2026-03-05"
    category: notebook
    description: "Remove notebook from recently-viewed list. Discovered via ARGUS heap."
    response_hint: "Unknown — needs live capture."
    service_method: "LabsTailwindOrchestrationService.RemoveRecentlyViewedProject"
    source: argus_heap

  # ──── Sources ──────────────────────────────────────────────────────────────

  list_sources:
    rpcid: "wXbhsf"
    fallback_rpcid: null
    payload: [null, 1, null, "$tier_marker"]
    requires_notebook: true
    timeout: 30
    confirmed: "2026-02-20"
    category: source
    description: "List all sources in a notebook (sidebar list)."
    response_hint: "[[[notebook_name, [source_obj, ...]]]] — source_obj has uid, title, meta."
    service_method: "LabsTailwindOrchestrationService.LoadSource"
    notes: "Same rpcid as list_notebooks — WITH notebook context lists sources."
    configurable:
      - tier_marker

  list_sources_advanced:
    rpcid: "jtGGne"
    fallback_rpcid: null
    payload: ["$notebook_id"]
    requires_notebook: true
    timeout: 30
    confirmed: "2026-06-10"
    category: source
    description: "List sources with rich metadata (different from wXbhsf sidebar list)."
    response_hint: "List of source metadata dicts."
    service_method: "LabsTailwindOrchestrationService.LoadSource"

  add_source:
    rpcid: "izAoDd"
    fallback_rpcid: null
    payload: [["$source_obj"], "$notebook_id", "$tier_marker", "$source_config"]
    requires_notebook: true
    timeout: 60
    confirmed: "2026-02-28"
    category: source
    description: >
      Add URL, YouTube, or pasted-text source to a notebook.
      URL: source_obj[2] = url.  YouTube: source_obj[7] = [url].
    response_hint: "New source metadata with UUID. Status = processing initially."
    service_method: "LabsTailwindOrchestrationService.AddSources"
    configurable:
      - tier_marker
      - source_config

  register_files:
    rpcid: "o4cbdc"
    fallback_rpcid: null
    payload: [[["$filenames"]], "$notebook_id", "$tier_marker", "$source_config"]
    requires_notebook: true
    timeout: 30
    confirmed: "2026-03-01"
    category: source
    description: "Register file uploads — returns upload URLs for PUT."
    response_hint: "Upload URL(s) for each registered filename."
    service_method: "LabsTailwindOrchestrationService.AddSources"
    configurable:
      - tier_marker
      - source_config

  delete_source:
    rpcid: "tGMBJ"
    fallback_rpcid: null
    payload: [[["$source_id"]], "$tier_marker"]
    requires_notebook: true
    timeout: 30
    confirmed: "2026-02-28"
    category: source
    description: "Delete a source from a notebook by UUID."
    response_hint: "Minimal acknowledgement."
    service_method: "LabsTailwindOrchestrationService.ActOnSources"
    configurable:
      - tier_marker

  read_source:
    rpcid: "tr032e"
    fallback_rpcid: null
    payload: [[[["$source_id"]]]]
    requires_notebook: false
    timeout: 60
    confirmed: "2026-02-22"
    category: source
    description: "Read full text of a source. Expensive for large sources."
    response_hint: "Nested text chunks — join via _extract_strings(data, 10)."
    service_method: "LabsTailwindOrchestrationService.LoadSource"
    aliases: [get_source_summary]

  get_source_detail:
    rpcid: "hizoJc"
    fallback_rpcid: null
    payload: [["$source_id"], "$tier_marker", "$tier_marker"]
    requires_notebook: true
    timeout: 30
    confirmed: "2026-03-01"
    category: source
    description: "Get detailed metadata for a single source."
    response_hint: "Source metadata with type, url, word count, status."
    service_method: "LabsTailwindOrchestrationService.LoadSource"
    configurable:
      - tier_marker

  get_source_metadata:
    rpcid: "K4YCPe"
    fallback_rpcid: null
    payload: ["$notebook_id", "$source_id"]
    requires_notebook: true
    timeout: 30
    confirmed: "2026-06-10"
    category: source
    description: "Fetch metadata for a specific source."
    response_hint: "Source metadata dict."
    service_method: "LabsTailwindOrchestrationService.LoadSource"

  process_source:
    rpcid: "bfEAsb"
    fallback_rpcid: null
    payload: ["$notebook_id", "$source_id"]
    requires_notebook: true
    timeout: 60
    confirmed: "2026-06-10"
    category: source
    description: "Trigger reprocessing of a failed or stale source."
    response_hint: "Acknowledgement."
    service_method: "LabsTailwindOrchestrationService.ActOnSources"

  discover_sources:
    rpcid: null
    fallback_rpcid: null
    payload: []
    requires_notebook: true
    timeout: 60
    confirmed: "2026-03-05"
    category: source
    description: "Auto-discover relevant sources for a notebook. Discovered via ARGUS heap."
    response_hint: "Unknown — needs live capture."
    service_method: "LabsTailwindOrchestrationService.DiscoverSources"
    source: argus_heap

  list_discover_sources_job:
    rpcid: null
    fallback_rpcid: null
    payload: []
    requires_notebook: true
    timeout: 30
    confirmed: "2026-03-05"
    category: source
    description: "Poll status of source discovery job. Discovered via ARGUS heap."
    response_hint: "Unknown — needs live capture."
    service_method: "LabsTailwindOrchestrationService.ListDiscoverSourcesJob"
    source: argus_heap

  add_tentative_sources:
    rpcid: null
    fallback_rpcid: null
    payload: []
    requires_notebook: true
    timeout: 60
    confirmed: "2026-03-05"
    category: source
    description: "Add tentative (suggested) sources to a notebook. Discovered via ARGUS heap."
    response_hint: "Unknown — needs live capture."
    service_method: "LabsTailwindOrchestrationService.AddTentativeSources"
    source: argus_heap

  # ──── Chat / Q&A ───────────────────────────────────────────────────────────

  create_note:
    rpcid: "CYK0Xb"
    fallback_rpcid: null
    payload: ["$notebook_id", "$question_text"]
    requires_notebook: true
    timeout: 180
    confirmed: "2026-02-22"
    category: chat
    description: >
      Citation-grounded Q&A — ask a question and get an answer with source
      citations embedded as [source_uuid] markers.
    response_hint: "[[answer_id, markdown_answer_with_citations], ...]"
    service_method: "LabsTailwindOrchestrationService.CreateNote"
    notes: >
      NOT the real multi-turn chat (that uses GenerateFreeFormStreamed gRPC).
      This is single-shot Q&A with citation annotations.
    aliases: [ask_with_citations]

  get_thread_ids:
    rpcid: "hPTbtc"
    fallback_rpcid: null
    payload: [[], null, "$notebook_id", "$page_size"]
    requires_notebook: true
    timeout: 30
    confirmed: "2026-02-24"
    category: chat
    description: "Get conversation thread IDs and pending sources list."
    response_hint: "[[thread_id_list], ...]"
    service_method: "LabsTailwindOrchestrationService.ListChatTurns"
    configurable:
      - page_size
    aliases: [pending_sources]

  read_thread:
    rpcid: "khqZz"
    fallback_rpcid: null
    payload: [[], null, null, "$thread_id", "$page_size"]
    requires_notebook: true
    timeout: 30
    confirmed: "2026-02-24"
    category: chat
    description: "Read all messages in a conversation thread."
    response_hint: "Nested message objects."
    service_method: "LabsTailwindOrchestrationService.ListChatTurns"
    configurable:
      - page_size
    aliases: [list_notes]

  get_chat_history:
    rpcid: "GzgSEd"
    fallback_rpcid: null
    payload: ["$notebook_id"]
    requires_notebook: true
    timeout: 30
    confirmed: "2026-06-10"
    category: chat
    description: "Get full chat history for a notebook."
    response_hint: "Chat history with messages."
    service_method: "LabsTailwindOrchestrationService.ListChatTurns"

  delete_chat_history:
    rpcid: "GfmCOc"
    fallback_rpcid: null
    payload: ["$notebook_id"]
    requires_notebook: true
    timeout: 30
    confirmed: "2026-06-10"
    category: chat
    description: "Delete entire chat history for a notebook."
    response_hint: "Acknowledgement."
    service_method: "LabsTailwindOrchestrationService.DeleteNotes"

  streaming_chat:
    rpcid: "tJHFsf"
    fallback_rpcid: null
    payload: ["$notebook_id", "$message", "$conversation_id"]
    requires_notebook: true
    timeout: 120
    confirmed: "2026-06-10"
    category: chat
    description: "Multi-turn streaming chat within a notebook context."
    response_hint: "Response text string."
    service_method: "LabsTailwindOrchestrationService.GenerateFreeFormStreamed"

  # ──── Artifacts / Notes / Documents ────────────────────────────────────────

  list_artifacts:
    rpcid: "gArtLc"
    fallback_rpcid: null
    payload: ["$tier_marker", "$notebook_id", "$filter_str"]
    requires_notebook: true
    timeout: 30
    confirmed: "2026-02-20"
    category: artifact
    description: "List notes and saved artifacts in a notebook."
    response_hint: "Nested artifact objects with title/content strings."
    service_method: "LabsTailwindOrchestrationService.ListArtifacts"
    configurable:
      - tier_marker
    aliases: [get_artifacts]
    notes: >
      filter_str uses SQL-like syntax, e.g.
      'NOT artifact.status = "ARTIFACT_STATUS_SUGGESTED"'

  generate_doc:
    rpcid: "ciyUvf"
    fallback_rpcid: null
    payload: ["$write_config", "$notebook_id", "$source_ids_nested"]
    requires_notebook: true
    timeout: 120
    confirmed: "2026-02-22"
    category: artifact
    description: "Generate a document/report from selected sources."
    response_hint: "[[title, description, null, [[src_ids]]], ...]"
    service_method: "LabsTailwindOrchestrationService.GenerateDocumentGuides"
    configurable:
      - write_config (inherits doc_type, model_quality)

  save_report:
    rpcid: "R7cb6c"
    fallback_rpcid: null
    payload: ["$write_config", "$notebook_id", [null, null, "$note_type", "$source_ids_nested"]]
    requires_notebook: true
    timeout: 120
    confirmed: "2026-02-22"
    category: artifact
    description: "Save a note artifact to a notebook."
    response_hint: "[[note_id, title, note_type_int, [[source_ids]]], ...]"
    service_method: "LabsTailwindOrchestrationService.UpdateArtifact"
    configurable:
      - write_config (inherits doc_type, model_quality)

  save_note:
    rpcid: "cYAfTb"
    fallback_rpcid: null
    payload: ["$notebook_id", "$note_id", [[["$html_content", "$title", [], 0]]], "$tier_marker"]
    requires_notebook: true
    timeout: 30
    confirmed: "2026-03-01"
    category: artifact
    description: "Live auto-save of a note as user types."
    response_hint: "Save acknowledgement."
    service_method: "LabsTailwindOrchestrationService.UpdateArtifact"
    configurable:
      - tier_marker

  sync_notes:
    rpcid: "cFji9"
    fallback_rpcid: null
