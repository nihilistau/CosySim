meta:
  version: '6.0'
  updated: '2026-07-14'
  base_url: https://notebooklm.google.com
  rpc_path: /_/LabsTailwindUi/data/batchexecute
  grpc_chat_path: /_/LabsTailwindUi/data/ google.internal.labs.tailwind.orchestration.v1. LabsTailwindOrchestrationService/GenerateFreeFormStreamed
  build_label_prefix: boq_labs-tailwind-frontend_
  session_parameters:
    bl:
      description: Build label — identifies the NLM frontend build version
      example: boq_labs-tailwind-frontend_20260311.12_p0
      source: notebooklm.google.com-gold.har
      notes: Changes with each NLM frontend deployment, included in batchexecute URL
    f_sid:
      description: Session fingerprint — stable per browser session
      example: '-7074006073653346490'
      source: notebooklm.google.com-gold.har
      notes: Negative 64-bit integer, included in batchexecute URL as f.sid parameter
  har_enrichment_version: v1.37
  har_sources:
  - notebooklm.google.com-gold.har
  - docs.-google.com-sheets-gemini-jackpot.har
  - m=postshellbase
  - rs=AA2YrTu55zzqRDSqVuS7VTCy_ldgsy4J6g
  - gemini.google.com-NEWEST.har
  - labs.google.har
  - artsandculture.google2-game.com.har
  - artsandculture.google2.com.har
  - dashboard.render.com.har
  build_labels_latest:
    gemini_server: boq_assistant-bard-web-server_20260311.02_p8
    opal_server: boq_labs-opal-ui_20260312.41_p0
    bard_client: boq-bard-web.BardChatUi.en_AU.aCiCIwVFaOo.2018.O
parameters:
  tier_marker:
    description: Account tier hint sent to NLM. Server does NOT enforce gating.
    type: array
    default:
    - 2
    options:
      free:
      - 1
      pro:
      - 2
      ultra:
      - 3
  response_length:
    description: Controls verbosity of NLM response payloads.
    type: integer
    default: 4
    options:
      default: 4
      longer: 1
      shorter: 2
  doc_type:
    description: Document/note output format.
    type: integer
    default: 2
    options:
      brief: 2
      deep: 9
  analysis_depth:
    description: Depth of notebook structural analysis (VfAZjd).
    type: integer
    default: 2
    options:
      summary: 1
      detailed: 2
  page_size:
    description: Number of results per page for list/thread RPCs.
    type: integer
    default: 20
  share_level:
    description: Notebook sharing level.
    type: integer
    default: 1
    options:
      private: 0
      anyone_with_link: 1
  audio_type:
    description: Audio overview format.
    type: integer
    default: 1
    options:
      deep_dive: 1
      brief: 2
      critique: 3
      debate: 4
  guide_type:
    description: Structured guide format.
    type: integer
    default: 1
    options:
      study: 1
      faq: 2
      briefing: 3
      toc: 4
      timeline: 5
  research_depth:
    description: Deep research intensity level.
    type: integer
    default: 5
    options:
      shallow: 1
      medium: 3
      deep: 5
      exhaustive: 10
  model_quality:
    description: 'Model quality hint embedded in write_config [[tier, quality]]. Higher values may select more capable Gemini
      variants.

      '
    type: array
    default:
    - 2
    - 1
    options:
      standard:
      - 2
      - 1
      high:
      - 2
      - 2
      fast:
      - 1
      - 1
      ultra:
      - 3
      - 1
shared_configs:
  write_config:
    description: 'Write operation metadata envelope used by generate_doc (ciyUvf), save_report (R7cb6c), and audio options
      (sqTeoe). Structure: [doc_type, null, null, source_config, [model_quality]]

      '
    value:
    - 2
    - null
    - null
    - - 1
      - null
      - null
      - null
      - null
      - null
      - null
      - null
      - null
      - null
      - - 1
    - - - 2
        - 1
    configurable_slots:
      0: doc_type
      4: model_quality
  source_config:
    description: 'Source creation metadata envelope used by add_source (izAoDd), register_files (o4cbdc), and create_notebook
      (CCqFvf). Position 0 = create flag (1=new), position 10 = feature flags.

      '
    value:
    - 1
    - null
    - null
    - null
    - null
    - null
    - null
    - null
    - null
    - null
    - - 1
    configurable_slots:
      0: create_flag (1=create new)
