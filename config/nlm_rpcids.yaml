# ═══════════════════════════════════════════════════════════════════════════════
# Google Workspace Gemini — appsgenaiserver-pa endpoints
# Discovered via ARGUS HAR mining (Sheets, Docs, Drive)
# These endpoints are shared across all Workspace apps when using Gemini features.
# ═══════════════════════════════════════════════════════════════════════════════
workspace_gemini:
  meta:
    service_name: "AppsGenAIServer"
    base_url: "https://appsgenaiserver-pa.clients6.google.com"
    auth_method: "api_key_query_param_plus_sapisidhash"
    api_key_param: "key"
    protocol: "grpc-json-transcoding"
    content_type: "application/json+protobuf"
    streaming: true
    transfer_encoding: "chunked"
    source: "argus_har_capture_2026-07"
    last_verified: "2026-07-08"
    notes: >
      Shared Gemini backend for Google Workspace apps (Sheets, Docs, Slides).
      Uses BOTH API key in query param AND SAPISIDHASH cookies for auth.
      Payloads are protobuf-JSON arrays (nested lists), NOT dict-style JSON.
      Context code 3=Sheets, 1=Docs determines app-specific behaviour.
    api_keys:
      sheets: "AIzaSyAkthrhpXoRv6M12CMqGivGO-rCfsy2AxU"
      docs: "AIzaSyCmh4zG9srkxnlT2O2FRJLrxBOBRaWWxNk"
    context_codes:
      sheets: 3
      docs: 1
    mime_types:
      sheets: "application/vnd.google-apps.ritz"
      docs: "application/vnd.google-apps.kix"

  operations:
    stream_generate:
      path: "/v1/genai/streamGenerate"
      method: "POST"
      category: generation
      streaming: true
      description: "Stream-based Gemini text generation for Workspace apps"
      notes: >
        Core generation endpoint.  Payload is a protobuf-JSON array:
        [[op_code, null, context_array, prompt_array, null, [null,null,1], 1], [null,null,1]].
        Operation codes: 61=init, 23=generate(sheets), 96=generate(docs), 16=continue, 15=insert.
        Prompt format varies by context:
          Sheets (op=23): body[0][3] = [null, null, "prompt_text", ...27 nulls, "0"]
          Docs (op=96):   body[0][3] = [null, null, null, [[[null, null, "prompt_text"]]]]
        Response is a single-line JSON array (not SSE chunks) with deeply nested text.
      parameters:
        op_code: "61=init, 23=generate_sheets, 96=generate_docs, 16=continue, 15=insert"
        context_code: "3=sheets, 1=docs (body[0][2][0])"
        session_id: "Format: goog_-NNNNNNNNNN (body[0][2][4])"
        document_id: "Spreadsheet/doc ID in doc reference (body[0][2][7+])"
        document_mime: "ritz=sheets, kix=docs"
        session_token: "Encrypted token ~1617 chars at body[0][8] (optional)"
        tier_marker: "body[0][5][0] — [1]=Free, [2]=Pro (CLIENT-SIDE GATING!)"
        viewport_size: "body[0][5][2][0][2] — viewport width in pixels (e.g. 1182)"
        turn_number: "body[0][2][6] — string '0','1','2' for multi-turn tracking"
        sheet_tab_info: "body[0][2][5] — array of [[tab_index, position, null, null, sheet_id, ...]]"
        conversation_history: "body[0][2][9] — null on first turn, populated on follow-ups"
      payload_map:
        # Full positional map of the streamGenerate protobuf-JSON payload
        # body = [[...outer...], [...context...]]
        outer:
          "[0]": "op_code — 61=init, 15=insert, 16=continue, 23=sheets_gen, 96=docs_gen"
          "[1]": "null (reserved)"
          "[2]": "context_array — [context_code, null, null, null, session_id, tab_info, turn_number, ...]"
          "[2][0]": "context_code — 3=Sheets, 1=Docs"
          "[2][4]": "session_id — 'goog_-NNNNNNNNNN'"
          "[2][5]": "tab_info — [[tab_index, position, null, null, sheet_hex_id, null, null, null, active, flag]]"
          "[2][5][0][4]": "sheet_hex_id — e.g. '616c29b4ceb3d1c4'"
          "[2][6]": "turn_number — string '0','1','2'"
          "[2][7]": "current_sheet_data — active cell/range data"
          "[2][8]": "sheet_schema — column/row layout info"
          "[2][9]": "conversation_history — null on first turn, populated on subsequent"
          "[3]": "user_input — null on op=61, prompt text on op=15/16/23/96"
          "[4]": "null (reserved)"
          "[5]": "tier_config — [tier_marker, null, [[null, '1', viewport_size]]]"
          "[5][0]": "tier_marker — 1=Free, 2=Pro (CLIENT-SIDE ONLY!)"
          "[5][2][0][2]": "viewport_size — integer, e.g. 1182"
          "[6]": "flag — always 1"
        context_suffix:
          "[0]": "context_code — 1=Docs, 3=Sheets (mirrors outer[2][0])"
          "[1]": "null"
          "[2]": "flag — always 1"
      operation_codes:
        61: "Initialize/prewarm — sent before first generation, no user content"
        15: "Insert content — contains actual user prompt at position [3]"
        16: "Continue/follow-up — multi-turn with history at position [2][9]"
        23: "Generate (Sheets context) — full generation with Sheets document context"
        96: "Generate (Docs context) — full generation with Docs document context"
      tier_gating:
        description: >
          Tier selection is 100% client-side.  Free accounts CAN set [2] for Pro
          tier by modifying the tier_marker at body[0][5][0].  No server-side
          enforcement observed.  Pro tier unlocks higher token limits, advanced
          model capabilities, and priority processing.
        free_marker: 1
        pro_marker: 2
        position: "body[0][5][0]"

    get_settings:
      path: "/v1/genai/getSettings"
      method: "POST"
      category: config
      streaming: false
      description: "Get current Gemini settings for the user"
      notes: >
        Payload: [[ctx, ctx]] where ctx=3 for Sheets, ctx=1 for Docs.
        Response: [null,[1,null,1,0]] or [[["timestamp",epoch],0,1],[1,null,1,0]].

    list_gems:
      path: "/v1/genai/listGems"
      method: "POST"
      category: discovery
      streaming: false
      description: "List available Gemini models and capabilities (gems)"
      notes: >
        Payload: [ctx, language_code, [...optional_context...]].
        Returns gem definitions with names, descriptions, starter prompts, and
        colour schemes.  Known gems include: sentiment-analyzer, writing-editor.
      parameters:
        context_code: "body[0] — 3=Sheets, 1=Docs"
        language_code: "body[1] — e.g. 'en', 'en-GB'"
        optional_context: "body[2] — optional context array with sheet/doc info"
      response_structure:
        # Each gem in the response array:
        gem_format:
          "[0]": "gem_id — string e.g. 'writing-editor', 'brainstormer', '00fb8f6ce227' (custom)"
          "[1]": "null"
          "[2][0][2]": "gem_name — e.g. 'Writing editor', 'Brainstormer'"
          "[2][1][2]": "gem_description — e.g. 'Elevate your writing...'"
          "[2][2]": "sample_prompts — array of [null, null, 'prompt text']"
          "[2][3][2][0]": "icon_name — e.g. 'edit_square', 'emoji_objects', '3p'"
          "[2][3][3]": "light_theme_colors — [primary, secondary, text]"
          "[2][3][4]": "dark_theme_colors — [primary, secondary, text]"
          "[2][4]": "enabled_flag — 1=enabled, 0=disabled"
          "[3][3]": "availability_flag — 1=available"
      known_gems:
        - id: "writing-editor"
          name: "Writing editor"
          description: "Elevate your writing. Get clear, constructive feedback."
          icon: "edit_square"
        - id: "brainstormer"
          name: "Brainstormer"
          description: "Find inspiration easily. Fresh ideas for parties, gifts, businesses."
          icon: "emoji_objects"
        - id: "copy-creator"
          name: "Copy creator"
          description: "Create compelling copy."
          icon: null
        - id: "custom_gems"
          name: "User-created gems"
          description: "Custom gems have hex IDs (e.g. '00fb8f6ce227') and user-defined names"
          notes: "Custom gems are fully programmable — name, description, prompts, colors"

    quota_summary:
      path: "/v1/genai/quotaSummary"
      method: "POST"
      category: quota
      streaming: false
      description: "Get Gemini API usage quota summary"
      notes: >
        Payload: [null, 1, [ctx]].
        Response: [[null,["total",null,"remaining",status,null,null,["reset_epoch"]],"used",[ctx],1],[]].
        Example: total=10000000, remaining=9999998, used="2", reset_epoch="1775026800".
      parameters:
        context_code: "body[2][0] — 3=Sheets, 1=Docs"
        tier_flag: "body[1] — always 1 observed"
      response_map:
        "[0][1][0]": "total_quota — string '10000000' (10M!)"
        "[0][1][2]": "remaining_quota — string e.g. '9999994'"
        "[0][1][3]": "status — 1=active"
        "[0][1][6][0]": "reset_timestamp — Unix epoch string e.g. '1775026800'"
        "[0][2]": "used_count — string e.g. '6'"
        "[0][3]": "context_code_echo — [3] or [1]"
        "[0][4]": "flag — always 1"
      quota_limits:
        total: 10000000
        reset_period: "daily (Unix epoch reset timestamp in response)"
        notes: "10M requests per day — effectively unlimited for our use cases"

    update_settings:
      path: "/v1/genai/updateUserSettings"
      method: "POST"
      category: config
      streaming: false
      description: "Update user Gemini preferences"
      notes: >
        Payload: [[], [ctx, ctx], null, 1].
        Response: [[["timestamp",epoch],0,1]].

# ═══════════════════════════════════════════════════════════════════════════════
# Google Sheets Gemini — Sheets-specific AI endpoints
# ═══════════════════════════════════════════════════════════════════════════════
sheets_gemini:
  meta:
    service_name: "GoogleSheetsGemini"
    base_url: "https://docs.google.com"
    auth_method: "cookie_sapisidhash"
    protocol: "internal_proto_text"
    source: "argus_har_capture_2026-07"
    last_verified: "2026-07-08"
    notes: >
      Sheets-specific Gemini features accessed through the Sheets REST base.
      IMPORTANT: These endpoints use URL-encoded form data with internal
      proto-text format (e.g. {1=14,17={1=136#prompt text...}}), NOT
      protobuf-JSON arrays like the streamGenerate endpoint.  Responses
      have )]}\' XSS protection prefix followed by JSON.

  operations:
    columnsmith_execute:
      path: "/spreadsheets/u/0/d/{spreadsheet_id}/columnsmith/execute"
      method: "POST"
      category: transformation
      streaming: false
      content_type: "application/x-www-form-urlencoded"
      description: "AI-driven column transformation — applies Gemini to cell ranges"
      notes: >
        Columnsmith runs Gemini on a column of data to transform, classify,
        extract, or enrich each row.  Payload uses internal proto-text format
        in the request body, NOT JSON.  Response starts with )]}' prefix.
      parameters:
        spreadsheet_id: "Target spreadsheet ID"
        column: "Target column letter or range (e.g. C2:C100)"
        formula: "Natural language transformation instruction"
        source_columns: "Input column(s) to read from (e.g. A2:B100)"

    external_data_fetch:
      path: "/spreadsheets/u/0/d/{spreadsheet_id}/externaldata/fetchData"
      method: "POST"
      category: enrichment
      streaming: false
      content_type: "application/x-www-form-urlencoded"
      description: "Fetch and inject external data into sheet cells"
      notes: >
        Used by 'Fill with Gemini' to pull web data, research, or computed
        values into a cell range.  Payload uses internal proto-text format.
        Response starts with )]}' prefix.
      parameters:
        spreadsheet_id: "Target spreadsheet ID"
        range: "Cell range to fill (e.g. B2:B50)"
        prompt: "What data to fetch/compute for each row"

# ═══════════════════════════════════════════════════════════════════════════════
# Google Cloud Search — Cross-workspace semantic search
# ═══════════════════════════════════════════════════════════════════════════════
cloud_search:
  meta:
    service_name: "CloudSearch"
    base_url: "https://cloudsearch.clients6.google.com"
    auth_method: "api_key_query_param_plus_sapisidhash"
    api_key: "AIzaSyDuAie05b1MZ0lMd9XCQczokBQUf4qjkzM"
    protocol: "rest_json"
    source: "argus_har_capture_2026-07"
    last_verified: "2026-07-08"
    notes: >
      Cloud Search provides unified semantic search across all Google Workspace
      content — Drive files, Docs, Sheets, Slides, Gmail, Calendar, etc.
      Uses BOTH API key in query param AND SAPISIDHASH.  Payloads are standard
      JSON dicts (NOT protobuf arrays).  Requires requestOptions with
      searchApplicationId and clientId fields.

  operations:
    query_search:
      path: "/v1/query/search"
      method: "POST"
      category: search
      streaming: false
      description: "Cross-workspace semantic search query"
      notes: >
        Payload: {"query":"text","requestOptions":{"searchApplicationId":"...","clientId":"..."},"pageSize":20}.
        Returns ranked results from across Workspace content.
        The searchApplicationId and clientId are HAR-extracted session values.
      parameters:
        query: "Natural language search query"
        page_size: 20
        request_options:
          search_application_id: "searchapplications/docs_editor"
          client_id: "DOCS_EDITOR"
        content_type_filters:
          all: "contenttype:(doc OR presentation OR spreadsheet OR pdf OR image)"
          docs_only: "contenttype:doc"
          sheets_only: "contenttype:spreadsheet"
          slides_only: "contenttype:presentation"
          pdfs_only: "contenttype:pdf"
          images_only: "contenttype:image"
      payload_template:
        query: "  contenttype:(doc OR presentation OR spreadsheet OR pdf OR image)"
        requestOptions:
          searchApplicationId: "searchapplications/docs_editor"
          clientId: "DOCS_EDITOR"
      notes_extended: >
        The query uses Workspace search syntax — supports contenttype filters,
        creator/modifier filters, date ranges, and full-text search.
        searchApplicationId and clientId are fixed values from the Workspace frontend.
        Results include: title, URL, snippet, mimeType, lastModifiedTime, owners.

