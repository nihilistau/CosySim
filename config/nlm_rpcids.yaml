      pre-warming, analytics, and recommendations.

  operations:
    prewarm:
      host: "espresso-pa.clients6.google.com"
      path: "/v1/prewarm"
      method: "POST"
      auth_method: "api_key_query_param"
      category: performance
      description: "Pre-warm Gemini AI models before generation to reduce latency"
      notes: >
        Called by Workspace apps before the first streamGenerate request.
        Pre-loads model weights and context.  Reduces first-request latency
        significantly.  Payload is a minimal protobuf-JSON array.
        CRITICAL: context_code for prewarm differs from streamGenerate!
        Prewarm uses 7=Sheets (NOT 3), and 1=Docs.
      api_keys:
        sheets: "AIzaSyAkthrhpXoRv6M12CMqGivGO-rCfsy2AxU"
        docs: "AIzaSyCmh4zG9srkxnlT2O2FRJLrxBOBRaWWxNk"
      parameters:
        context_code: "7=sheets (NOT 3!), 1=docs — differs from streamGenerate"
      payload_map:
        "[0]": "null"
        "[1]": "null"
        "[2]": "locale — e.g. 'en-GB'"
        "[3]": "null"
        "[4]": "context_code — 7=Sheets, 1=Docs"
        "[5]": "document_title — [title_string]"
        "[6]": "version — '6' (string)"
        "[7]": "null"
        "[8]": "document_id — spreadsheet/doc ID"
        "[9]": "session_token — encrypted session token"
      payload_template: >
        [[null, null, "en-GB", null, 7, ["Sheet Title"], "6", null, "spreadsheet_id", "session_token"]]
      response: "[] (empty — fire-and-forget, no meaningful response)"

    fetch_recommendation:
