      protobuf-JSON arrays like the streamGenerate endpoint.  Responses
      have )]}\' XSS protection prefix followed by JSON.

  operations:
    columnsmith_execute:
      path: "/spreadsheets/u/0/d/{spreadsheet_id}/columnsmith/execute"
      method: "POST"
      category: transformation
      streaming: false
      content_type: "application/x-www-form-urlencoded"
      description: "AI-driven column transformation — applies Gemini to cell ranges"
      notes: >
        Columnsmith runs Gemini on a column of data to transform, classify,
        extract, or enrich each row.  Payload uses internal proto-text format
        in the request body, NOT JSON.  Response starts with )]}' prefix.
      parameters:
        spreadsheet_id: "Target spreadsheet ID"
        column: "Target column letter or range (e.g. C2:C100)"
        formula: "Natural language transformation instruction"
        source_columns: "Input column(s) to read from (e.g. A2:B100)"

    external_data_fetch:
      path: "/spreadsheets/u/0/d/{spreadsheet_id}/externaldata/fetchData"
      method: "POST"
      category: enrichment
      streaming: false
      content_type: "application/x-www-form-urlencoded"
      description: "Fetch and inject external data into sheet cells"
      notes: >
        Used by 'Fill with Gemini' to pull web data, research, or computed
        values into a cell range.  Payload uses internal proto-text format.
        Response starts with )]}' prefix.
      parameters:
        spreadsheet_id: "Target spreadsheet ID"
        range: "Cell range to fill (e.g. B2:B50)"
        prompt: "What data to fetch/compute for each row"

