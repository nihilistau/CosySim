nlm_grpc:
  meta:
    service_name: LabsTailwindOrchestrationService
    grpc_service: google.internal.labs.tailwind.orchestration.v1.LabsTailwindOrchestrationService
    base_url: https://notebooklm.google.com
    base_path: /_/LabsTailwindUi/data
    auth_method: cookie_at_token
    protocol: grpc-web
    source: argus_har_capture_2026-07_v121 + heap_analysis
    last_verified: '2026-07-10'
    notes: 'NLM supports two RPC protocols: batchexecute (most operations) and direct gRPC-web (streaming operations like
      chat).  The gRPC-web path uses the full qualified service name in the URL.  Auth is cookie-based with an ''at'' CSRF
      token in the POST body (NOT SAPISIDHASH).

      '
  methods:
    GenerateFreeFormStreamed:
      category: chat
      streaming: true
      description: Stream free-form chat response from NLM (main chat endpoint)
      har_confirmed: true
      grpc_path: google.internal.labs.tailwind.orchestration.v1. LabsTailwindOrchestrationService/GenerateFreeFormStreamed
      full_url: /_/LabsTailwindUi/data/google.internal.labs.tailwind.orchestration.v1. LabsTailwindOrchestrationService/GenerateFreeFormStreamed
      notes: 'This is the primary chat streaming endpoint.  Uses direct gRPC-web instead of batchexecute.  The batchexecute
        equivalent is rpcid ozz5Z (non-streaming) or the older chat RPC.  This method is what powers the NotebookLM chat interface
        in real-time.

        '
      auth:
        method: cookie + at_token
        at_token_position: POST body parameter
        cookie_required: true
    batchexecute:
      category: transport
      streaming: false
      description: Standard batchexecute transport for NLM operations
      path: /_/LabsTailwindUi/data/batchexecute
      har_confirmed: true
      har_call_count: 29
      notes: 'All 58 registered NLM operations use this transport by default. The gRPC-web path is only used for streaming
        operations. Batchexecute supports multiplexing multiple rpcids in a single request.

        '
