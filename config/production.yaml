# Production Configuration
# Overrides for production environment

system:
  environment: "production"

# Production database
database:
  sqlite:
    path: "/var/lib/cosyvoice/simulation.db"
    pool_size: 10

# Production scene settings
scenes:
  phone:
    host: "0.0.0.0"
    port: 5555
    debug: false
  
  dashboard:
    host: "0.0.0.0"
    port: 8501
  
