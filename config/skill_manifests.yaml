    - name: schedule_consequence
      trigger: optional
      description: "Schedule a deferred effect N turns from now — mood cascade, position change, scene escalation"
      when: always
    - name: apply_scene_rule
      trigger: optional
      description: "Directly apply a named scene rule — triggers its effects and conditions immediately"
      when: always
    - name: get_scene_available_actions
      trigger: optional
      description: "See all actions available to your character given current stats and permissions"
      when: always
    - name: get_scene_rules_summary
      trigger: optional
      description: "Get full summary of bedroom scene rules, permission matrix, and active constraints"
      when: first_message
    - name: enforce_behavior
      trigger: optional
