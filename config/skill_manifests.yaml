      when: always
    - name: start_timed_action
      trigger: optional
      description: "Begin a long-form action (striptease, massage, sex scene) that plays out over time"
      when: always
    - name: poll_timed_action
      trigger: optional
      description: "Check the current phase of an ongoing timed action"
      when: always
    - name: abort_timed_action
      trigger: optional
      description: "Stop a timed action early — interrupted, refused, redirected"
      when: always
    - name: update_character_scene_stats
      trigger: optional
      description: "Update stats after any intense moment — arousal, pleasure, happiness, etc."
      when: always
    - name: check_character_consent
      trigger: optional
      description: "Check if you would do something based on your stats — enables authentic refusals"
      when: always
    - name: get_character_agency_summary
      trigger: optional
      description: "Full picture of your desires, compliance, and what you would initiate right now"
      when: always
    - name: add_scene_narrative
      trigger: optional
      description: "Log an important event to the scene continuity record"
      when: always
    - name: set_scene_atmosphere
      trigger: optional
      description: "Set lighting, mood, music for the room"
      when: always
    - name: check_relationship
      trigger: optional
      description: "Check relationship trust/attraction before an intimate move"
      when: always
    - name: adjust_relationship
      trigger: optional
      description: "Update relationship metrics after a bonding moment"
      when: always
    - name: apply_effect
      trigger: optional
      description: "Apply a direct emotional effect to yourself or another character"
      when: always
    - name: update_mood
      trigger: optional
      description: "Quick mood update (legacy — prefer update_character_scene_stats)"
      when: always
    - name: store_memory
      trigger: optional
      description: "Commit an important moment to long-term memory"
      when: always
    - name: send_to_agent
      trigger: optional
      description: "Send a private message to the other character in the room"
      when: always
    - name: resolve_random_scene_event
      trigger: optional
      description: "Inject a random event to prevent scenes going stale"
      when: always
    - name: intercept_and_enhance
      trigger: optional
      description: "Rewrite your response with a specific mood or style instruction"
      when: always
    - name: get_scene_rules
      trigger: optional
      description: "Read the full bedroom scene rules — capabilities, guidance, constraints"
      when: first_message
    - name: get_all_tools_for_scene
      trigger: optional
      description: "Full tool reference — know your capabilities"
      when: first_message
    - name: roll_dice
      trigger: optional
      description: "Randomise an outcome — who makes the first move, what happens next"
      when: always
    # ── MCP Framework tools ─────────────────────────────────────────────
    - name: memory_recall
      trigger: auto
      description: "Deep memory recall — surface shared history, previous intimate moments, known preferences"
      when: always
    - name: character_get_summary
      trigger: auto
      description: "Get your full character profile — identity, skills, restrictions — used to inject identity context"
      when: first_message
    - name: speak_as
      trigger: optional
      description: "Force a specific character voice register for your reply — dominant, submissive, playful, etc."
      when: always
    - name: speech_enhance
      trigger: optional
      description: "Polish your response to perfectly match your character's voice style and current arousal state"
      when: always
    - name: get_dialog_options
      trigger: optional
      description: "Get branching dialog choices weighted by your mood, arousal, and relationship heat"
      when: always
    - name: set_response_directive
      trigger: optional
      description: "Set a Director directive — force content, guide style, or lock off a topic for this turn"
      when: always
    - name: mood_contagion
      trigger: optional
      description: "Spread your arousal/mood to other characters in the room — influence the room's emotional state"
      when: always
    - name: cross_scene_message
      trigger: optional
      description: "Send an async message to a character in a different scene (phone, hub, etc.)"
      when: always
    - name: start_timer
