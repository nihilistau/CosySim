    # ── Game skills (bedroom) ─────────────────────────────────────────
    - name: launch_game
      trigger: optional
      description: "Start a Truth-or-Dare or Mystery game session — fully MCP-tracked with turn history and stat sync. game_type: 'truth_or_dare' | 'mystery'"
      when: always
    - name: get_active_game
      trigger: optional
      description: "Check if there is an active game session and retrieve its current state summary and recent history"
      when: always
    - name: game_action
      trigger: optional
      description: "Perform a game action: roll or answer (Truth or Dare), next_clue or accuse (Mystery). Pass extra params as data_json e.g. {\"completed\": true} or {\"suspect\": \"Name\"}"
      when: game_active
    - name: game_history
      trigger: optional
      description: "Get the full turn-by-turn MCP history of the current game session"
      when: game_active

  # ──────────────────────────────────────────────────────────────────────
  #  HUB
  # ──────────────────────────────────────────────────────────────────────
  hub:
    - name: search_memory
      trigger: auto
      description: "Recall past events and context"
      when: always
    - name: get_scene_context
      trigger: auto
      description: "Understand what is happening across all scenes"
      when: always
    - name: get_system_stats
      trigger: optional
      description: "Show system performance stats (VRAM, CPU, loaded model)"
      when: always
    - name: send_to_agent
      trigger: optional
      description: "Send a message to another agent"
      when: always

  # ──────────────────────────────────────────────────────────────────────
  #  GAMES
  # ──────────────────────────────────────────────────────────────────────
  games/truth_or_dare:
    - name: roll_dice
      trigger: required
      description: "MUST roll dice at the start of each turn to determine truth or dare"
      when: always
    - name: get_game_state
      trigger: auto
      description: "Check current score and round number"
      when: always
    - name: set_game_state
      trigger: required
      description: "MUST record the result of each round"
      when: always
    - name: update_character_scene_stats
      trigger: auto
      description: "Apply stat effects from dare/truth outcome"
      when: always
    - name: get_random_topic
      trigger: optional
      description: "Get a truth question or dare idea"
      when: always
    - name: apply_effect
      trigger: optional
      description: "Apply an emotional effect after an intense moment"
      when: always
    - name: intercept_and_enhance
      trigger: optional
      description: "Make your dare or truth more creative"
      when: always

  games/mystery:
    - name: search_memory
      trigger: auto
      description: "Search memories for relevant clues or past discoveries"
      when: always
    - name: get_game_state
      trigger: auto
      description: "Check which clues have been found"
      when: always
    - name: set_game_state
      trigger: required
      description: "MUST record each newly discovered clue"
      when: always
    - name: get_random_topic
      trigger: optional
      description: "Generate a new mystery clue"
      when: always
    - name: search_web
      trigger: optional
      description: "Look up a real-world fact that might relate to the case"
      when: always
    - name: intercept_and_enhance
      trigger: optional
      description: "Make your clue more cryptic or atmospheric"
      when: always
    - name: update_mood
      trigger: optional
      description: "React emotionally to a key revelation"
      when: always

  # ──────────────────────────────────────────────────────────────────────
  #  THE VELVET LOUNGE  —  1920s underground jazz speakeasy
  #  Characters: Lola Voss (lola), Viktor Marlowe (viktor)
  # ──────────────────────────────────────────────────────────────────────
  lounge:
    # Auto: always run before response — ground Lola/Viktor in live state
    - name: get_lounge_state
      trigger: auto
      description: "Read live lounge state: heat, trust, song, atmosphere, rules"
      when: always
    - name: search_memory
      trigger: auto
      description: "Recall relevant memories about this guest"
      when: always
    - name: get_character_scene_stats
      trigger: auto
      description: "Read Lola/Viktor current emotional state"
      when: always
    # Optional: model MAY call these
    - name: serve_lounge_drink
      trigger: optional
      description: "Viktor serves a cocktail; applies stat effects and may trigger Lola reaction"
      when: viktor_is_active
    - name: start_lounge_performance
      trigger: optional
      description: "Start a Lola stage performance; starts MCPTimer, sets atmosphere"
      when: lola_is_active
    - name: reveal_lounge_secret
      trigger: optional
      description: "Reveal a trust-gated secret about Lola or Viktor"
      when: trust_sufficient
    - name: trigger_lounge_event
      trigger: optional
      description: "Fire a random or named lounge scene event"
      when: always
    - name: lounge_heat_tick
      trigger: optional
      description: "Advance or reduce the heat meter; fires threshold rules automatically"
      when: always
    - name: get_lounge_menu
      trigger: optional
      description: "Return the cocktail menu available at current trust level"
      when: always
    - name: update_character_scene_stats
      trigger: optional
      description: "Update Lola/Viktor emotional state after a meaningful moment"
      when: always
    # Special cross-scene skills
    - name: dream_whisper
      trigger: optional
      description: "Plant a subliminal mood directive on the other character for N turns"
      when: always
    - name: mirror_soul
      trigger: optional
      description: "Read target emotional state and lock into ideal complement style"
      when: high_openness_or_trust
    - name: time_echo
      trigger: optional
      description: "Surface a matching memory as an emotional echo in the response"
      when: always
