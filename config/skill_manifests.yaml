# CosySim Skill Manifests
# ========================
# Maps scene names to skill definitions.
#
# trigger types:
#   auto     — executed before the LLM call; result injected into context
#   optional — advertised to the LLM, which MAY call it
#   required — LLM MUST call this tool before replying
#
# when: condition hint (not enforced, informational)

scenes:

  # ──────────────────────────────────────────────────────────────────────
  #  PHONE  —  Real-feeling texting / calling companion
  # ──────────────────────────────────────────────────────────────────────
  phone:
    # Auto: always run before response — ground the agent in context
    - name: search_memory
      trigger: auto
      description: "Recall relevant past conversations, shared jokes, and history"
      when: always
    - name: get_character_scene_stats
      trigger: auto
      description: "Read current mood, arousal, openness — drives how you text"
      when: always
    - name: get_scene_narrative
      trigger: auto
      description: "Read the last 10 messages to maintain conversation continuity"
      when: always
    # Optional: model chooses to use these
    - name: update_character_scene_stats
      trigger: optional
      description: "Update your emotional state after something meaningful happens"
      when: always
    - name: perform_interaction
      trigger: optional
      description: "Execute a phone interaction (flirt_text, sext, voice_call, video_call, send_media, roleplay_text)"
      when: always
    - name: list_available_interactions
      trigger: optional
      description: "See which phone interaction types are available given your current stats"
      when: always
    - name: check_character_consent
      trigger: optional
      description: "Check if you would genuinely do something given your current mood"
      when: always
    - name: get_character_agency_summary
      trigger: optional
      description: "Get a summary of your current desires, resistances, and what you might initiate"
      when: always
    - name: update_mood
      trigger: optional
      description: "Update mood (legacy shorthand — use update_character_scene_stats for precision)"
      when: always
    - name: check_relationship
      trigger: optional
      description: "Check current relationship metrics before an emotional decision"
      when: always
    - name: adjust_relationship
      trigger: optional
      description: "Update relationship trust/attraction after a meaningful exchange"
      when: always
    - name: add_scene_narrative
      trigger: optional
      description: "Log an important moment to the conversation history"
      when: always
    - name: get_random_topic
      trigger: optional
      description: "Get a fresh conversation topic or question when you want to start something new"
      when: always
    - name: apply_effect
      trigger: optional
      description: "Apply an emotional effect — excite, calm, trust_boost, etc."
      when: always
    - name: intercept_and_enhance
      trigger: optional
      description: "Rewrite your response with a specific style — more teasing, more vulnerable, etc."
      when: always
    - name: search_web
      trigger: optional
      description: "Look something up — use when they ask about real things, news, recipes, anything"
      when: always
    - name: send_to_agent
      trigger: optional
      description: "Send a message to another character in the system"
      when: always
    - name: get_all_tools_for_scene
      trigger: optional
      description: "See the complete list of tools available to you"
      when: first_message
    - name: get_scene_rules
      trigger: optional
      description: "Read the scene rules and guidelines for authentic phone interactions"
      when: first_message
    - name: resolve_random_scene_event
      trigger: optional
      description: "Inject a random event to keep the conversation surprising"
      when: always
    # ── MCP Framework tools ─────────────────────────────────────────────
    - name: memory_recall
      trigger: auto
      description: "Deep memory recall with semantic search across all past interactions"
      when: always
    - name: character_get_summary
      trigger: auto
      description: "Get your full character profile — identity, skills, restrictions — used to inject identity context"
      when: first_message
    - name: speak_as
      trigger: optional
      description: "Force a specific character voice register and speech style for your reply"
      when: always
    - name: speech_enhance
      trigger: optional
      description: "Enhance your response to match your character's voice style and emotional state"
      when: always
    - name: get_dialog_options
      trigger: optional
      description: "Get branching dialog choices weighted by your mood, relationship heat, and scene context"
      when: always
    - name: set_response_directive
      trigger: optional
      description: "Set a Director directive — force content, guide style, or lock off a topic"
      when: always
    - name: mood_contagion
      trigger: optional
      description: "Spread your current mood to other characters in the scene — influence their emotional state"
      when: always
    - name: cross_scene_message
      trigger: optional
      description: "Send a message to a character in a different scene — async cross-scene communication"
      when: always
    - name: get_cross_scene_inbox
      trigger: auto
      description: "Read messages sent to you from characters in other scenes"
      when: always
    - name: start_timer
      trigger: optional
      description: "Start a named countdown timer — e.g. 'waiting_for_callback' for 300 seconds"
      when: always
    - name: check_timer
      trigger: optional
      description: "Check if a named timer has completed and what the completion note says"
      when: always
    - name: random_pick
      trigger: optional
      description: "Pick randomly from a list of outcomes with optional weights — for spontaneous story beats"
      when: always
    - name: schedule_consequence
      trigger: optional
      description: "Schedule a deferred effect to fire after N turns — delayed mood shifts, scene changes"
      when: always
    - name: get_scene_rules_summary
      trigger: optional
      description: "Get the full summary of scene rules, available actions, and permission matrix"
      when: first_message
    - name: enforce_behavior
      trigger: optional
      description: "Apply a behavioral constraint or permission to a character for this scene"
      when: always

  # ──────────────────────────────────────────────────────────────────────
  #  BEDROOM  —  Adult multi-agent roleplay
  # ──────────────────────────────────────────────────────────────────────
  bedroom:
    # Auto: always run before response — ground the agent in the scene
    - name: get_character_scene_stats
      trigger: auto
      description: "Read your full emotional/physical stat vector — your body right now"
      when: always
    - name: wardrobe_get
      trigger: auto
      description: "Check what you are wearing — MUST know before any undressing action"
      when: always
    - name: get_scene_narrative
      trigger: auto
      description: "Read what has already happened — continuity is everything"
      when: always
    - name: search_memory
      trigger: auto
      description: "Recall past intimate moments, in-jokes, and history with this person"
      when: always
    - name: get_full_scene_snapshot
      trigger: auto
      description: "Full scene state — atmosphere, other characters, active actions"
      when: first_message
    # Optional — model chooses
    - name: perform_interaction
      trigger: optional
      description: "Execute one of 6 core interaction types: cuddle, kiss, caress, striptease, intimate, deep_talk"
      when: always
    - name: list_available_interactions
      trigger: optional
      description: "See all accessible interaction types given your stats — check before acting"
      when: always
    - name: get_interaction_details
      trigger: optional
      description: "Get full info on an interaction type — phases, fragments, stat effects"
      when: always
    - name: wardrobe_remove_outermost
      trigger: optional
      description: "Strip the next clothing layer — progressive undressing"
      when: always
    - name: wardrobe_remove_item
      trigger: optional
      description: "Remove a specific clothing item by id"
      when: always
    - name: wardrobe_add_item
      trigger: optional
