# News source definitions for CosySim intelligence system
news:
  enabled: true
  fetch_interval_hours: 8
  max_articles_per_fetch: 30
  max_article_age_hours: 48

  categories:
    - ai_ml
    - llm
    - python
    - local_inference
    - mcp_agents
    - open_source

  sources:
    - id: hn_top
      name: "Hacker News - Top"
      type: api
      url: "https://hacker-news.firebaseio.com/v0/topstories.json"
      category: ai_ml
      enabled: true
      quality_score: 0.9
      max_items: 15

    - id: hn_best
      name: "Hacker News - Best"
      type: api
      url: "https://hacker-news.firebaseio.com/v0/beststories.json"
      category: ai_ml
      enabled: true
      quality_score: 0.85
      max_items: 10

    - id: reddit_localllama
      name: "Reddit - LocalLLaMA"
      type: rss
      url: "https://www.reddit.com/r/LocalLLaMA/.rss"
      category: local_inference
      enabled: true
      quality_score: 0.8
      max_items: 10

    - id: reddit_machinelearning
      name: "Reddit - Machine Learning"
      type: rss
      url: "https://www.reddit.com/r/MachineLearning/.rss"
      category: ai_ml
      enabled: true
      quality_score: 0.8
      max_items: 10

    - id: github_trending
      name: "GitHub Trending"
      type: web_scrape
      url: "https://github.com/trending?since=daily"
      category: open_source
      enabled: true
      quality_score: 0.7
      max_items: 10

  keyword_filters:
    include:
      - llm
      - language model
      - inference
      - fine-tuning
      - quantization
      - gguf
      - lmstudio
      - ollama
      - mcp
      - agent
      - rag
      - embedding
      - transformers
      - pytorch
      - notebooklm
    exclude:
      - crypto
      - blockchain
      - nft
