# CosySim Default Configuration
# Base config file. Override settings in development.yaml or production.yaml

system:
  name: "CosySim AI Playground"
  version: "1.52"
  environment: "default"

# Paths configuration
paths:
  project_root: "."
  data_dir: "./data"
  models_dir: "./pretrained_models"
  cache_dir: "./cache"
  logs_dir: "./logs"
  media_dir: "./content/simulation/media"
  assets_dir: "./content/assets"
  database_dir: "."

# Database configuration
database:
  sqlite:
    path: "simulation.db"
    pool_size: 5
    timeout: 30
  chromadb:
    path: "./content/simulation/chroma_db"
    collection_name: "memories"
    embedding_model: "sentence-transformers/all-MiniLM-L6-v2"

# Scene configuration
scenes:
  phone:
    host: "localhost"
    port: 5555
    debug: false
    auto_reload: false
  
  dashboard:
    host: "localhost"
    port: 8501
    theme: "dark"
  
  penthouse:
    host: "localhost"
    port: 5556
    debug: false
    max_characters: 2
    agent_loop_interval: 8
    default_lighting: "evening"
    default_camera_view: "overview"
    enable_first_person: true
    positions:
      - bed
      - couch
      - fireplace
      - bar
      - bathroom
      - vanity
      - balcony
      - doorway
    outfits:
      - casual
      - formal
      - silk_robe
      - nothing
      - lingerie
      - leather
      - evening_dress
      - swimwear
      - athletic
      - sleep
    personality_profiles:
      - bold_dominant
      - shy_submissive
      - playful_tease
      - intellectual_aloof
      - nurturing_warm
    stats:
      - arousal
      - pleasure
      - happiness
      - horniness
      - drunkenness
      - dominance
      - fear
      - anger
      - openness
      - tiredness

  lounge:
    host: "localhost"
    port: 5557
    debug: false

  casino:
    host: "localhost"
    port: 5559
    debug: false

  gallery:
    host: "localhost"
    port: 5560
    debug: false

  arena:
    host: "localhost"
    port: 5561
    debug: false

  realm:
    host: "localhost"
    port: 5562
    debug: false

  neoncity:
    host: "localhost"
    port: 5563
    debug: false

  coders:
    host: "localhost"
    port: 5564
    debug: false

  heist:
    host: "localhost"
    port: 5565
    debug: false

  command_center:
    host: "localhost"
    port: 5566
    debug: false

  tavern:
    host: "localhost"
    port: 5558
    debug: false

  games:
    host: "localhost"
    port: 5567
    debug: false

  nexus_panel:
    host: "localhost"
    port: 5570
    debug: false

  system_control:
    host: "localhost"
    port: 5575
    debug: false

  intel_hub:
    host: "localhost"
    port: 5580
    debug: false

  asset_studio:
    host: "localhost"
    port: 5568
    debug: false
    library_db: "data/asset_library.db"
    voice_output_dir: "data/asset_studio/voice"
    svg_output_dir: "data/asset_studio/svg"
    audio_output_dir: "data/asset_studio/audio"
    comfyui_enabled: true
    tts_enabled: true
    lms_enabled: true
    video_enabled: true
    nexus_cache_enabled: true
    adult_enabled: false

  grid:
    host: "localhost"
    port: 5569
    debug: false

  lab_break:
    host: "localhost"
    port: 5571
    debug: false

  hub:
    host: "localhost"
    port: 8500
    type: "streamlit"

  admin:
    host: "localhost"
    port: 8502
    type: "streamlit"

  assets:
    host: "localhost"
    port: 8503
    type: "streamlit"

  creator:
    host: "localhost"
    port: 8504
    type: "streamlit"

# TTS configuration
tts:
  engine: "cosyvoice"
  model_name: "CosyVoice-300M"
  sample_rate: 22050
  warm_start: true
  stream: true
  device: "cuda"  # or "cpu"
  server_url: "http://localhost:8600"  # Qwen3-TTS FastAPI server
  default_backend: "auto"              # auto | piper | orpheus | orpheus_native | qwen3
  backends:
    piper:
      enabled: true
      model_path: "${PIPER_MODEL_PATH:-C:\\Files\\Models\\tts\\piper\\en_US-amy-medium.onnx}"
      sample_rate: 22050
    orpheus:
      enabled: false                     # LMStudio-backed (conflicts with other models)
      server_url: "http://localhost:5005"
      default_voice: "tara"
      timeout: 120
      model_dir: "${ORPHEUS_MODEL_DIR:-D:\\Files\\Models\\Orpheous}"
    orpheus_native:
      enabled: true                      # Direct GGUF — no LMStudio dependency
      model_dir: "${ORPHEUS_MODEL_DIR:-D:\\Files\\Models\\Orpheous}"
      default_quant: null                # null=auto-select by text length (q2_k/q4_k_m)
      gpu_layers: -1                     # -1=all layers on GPU (CUDA build active)
      default_voice: "tara"
    qwen3:
      enabled: true
      server_url: "http://localhost:8600"
      model_size: "0.6b"               # 0.6b | 1.7b | auto | escalate
      model_path: "pretrained_models/Qwen3-TTS-0.6B"
  streaming:
    enabled: true                      # enable chunked streaming generation
    chunk_method: "sentence"           # sentence | fixed_length
    max_chunk_chars: 500               # max characters per chunk
  speculative:
    enabled: false                     # use 0.6B as draft for 1.7B (same-family spec decode)
    draft_model: "0.6b"               # draft model size for speculative decoding

# STT configuration
stt:
  server_url: "http://localhost:5051"   # Whisper STT server
  model: "base"                         # tiny, base, small, medium, large

# LLM configuration
llm:
  provider: "lmstudio"  # or "openai", "local"
  base_url: "http://localhost:1234/v1"
  model: ""  # empty = auto-resolve to whatever is loaded in LMStudio
  temperature: 0.7
  max_tokens: 5000
  stream: true
  custom_context: ""  # Extra context injected into agent system prompts

# LMStudio SDK configuration
lmstudio:
  host: "127.0.0.1"
  port: 1234
  base_url: "http://127.0.0.1:1234"
  # v1.60.0 [2026-06-13] — affinity TaskQueue (engine/lmstudio/task_queue.py)
  task_queue_v2:
    auto_start: true            # singleton get_task_queue() auto-starts its worker pool
    workers: 2                  # background worker threads
    max_queue_depth: 100        # max queued tasks before submit rejects
  # API authentication (optional — LMStudio defaults to no auth)
  # Generate a token in LMStudio → Developer → Server Settings → Manage Tokens
  # v1.61.0 [2026-06-13] — no real token in the committed repo; set LMSTUDIO_API_TOKEN
  # in your gitignored .env (LMStudio defaults to no auth, so empty is fine locally).
  api_token: "${LMSTUDIO_API_TOKEN:-}"
  # API version: "v1" = legacy OpenAI-compat, "api_v1" = new LMStudio protocol
  api_version: "v1"
  # Default model-load options (tuned for RTX 2060 12 GB)
  default_load_opts:
    gpu: 0.9          # fraction of layers to offload to GPU
    ttl: 3600         # model time-to-live in seconds (0 = never unload)
    context_length: 4096
  # Hard cap: keep total GPU usage below this (MB)
  vram_cap_mb: 11500
  # CLI command (must be on PATH or full path)
  cli: "lms"
  # MCP integration
  mcp_enabled: true           # use per-request MCP via REST API
  cosysim_mcp_url: "http://localhost:8700/mcp/sse"   # CosySim MCP server SSE endpoint
  mcp_json_path: ""           # path to LMStudio mcp.json for auto-registration
  # Model loading strategy
  # concurrent — one model always resident; up to concurrent_slots parallel requests
  # jit        — load on demand, evict previous model
  # jit_ttl    — like jit but auto-unload after jit_ttl_seconds of inactivity
  load_mode: "concurrent"     # concurrent | jit | jit_ttl
  concurrent_slots: 4         # must match LMStudio Server → Advanced → "Max parallel requests"
  concurrent_model: ""        # pin a model for concurrent mode (empty = auto-resolve)
  jit_ttl_seconds: 300        # idle TTL for jit_ttl mode (seconds)

  # ── Resource Manager (Phase 3) ──────────────────────────────────
  resource_manager:
    # Strategy: single_big | concurrent | multi_small | jit_swap | speculative | hybrid
    strategy: "concurrent"
    default_ttl: 300            # seconds before idle models are evicted (0 = never)
    bg_workers: 2               # background task thread pool size

  # ── Inference defaults (merged into every request unless overridden) ──
  inference_defaults:
    temperature: 0.7
    top_p: 0.9
    top_k: 40
    min_p: 0.05
    repeat_penalty: 1.1
    max_output_tokens: 4000
    reasoning: false            # enable thinking/reasoning mode
    # draft_model: ""           # speculative decoding draft model
    # stop_strings: []

  # ── Load defaults (applied when loading models via REST / CLI) ──
  load_defaults:
    context_length: 4096
    gpu_offload: 0.9            # fraction (0.0-1.0) or "max" or "off"
    flash_attention: true
    eval_batch_size: 512
    keep_kv_cache_on_gpu: true
    # num_experts: null          # for MoE models
    ttl: 3600

  # ── Speculative decoding ──
  speculative:
    enabled: false
    draft_model: ""             # small fast model for draft tokens
    # main_model: ""            # override main model for spec decode

  # ── SDK Client (WebSocket connection to LMStudio SDK) ──
  sdk:
    enabled: true               # enable SDK alongside REST
    timeout: 60                 # seconds — SDK call timeout
    auto_connect: true          # connect on startup

  # ── Inference Router (three-tier priority queue) ──
  router:
    enabled: true
    max_queue_depth: 20         # reject new requests when queue exceeds this
    preempt_on_priority: true   # allow REALTIME to preempt BATCH
    worker_poll_interval: 0.05  # seconds between queue checks

  # ── Multi-Model Setup ──
  models:
    primary:
      key: ""                   # e.g. "qwen3-8b" — leave empty to auto-resolve
      device: "gpu"
      slots: 2
      context_length: 8192
      channel: "sdk"            # sdk | rest — preferred channel
    utility:
      key: ""                   # e.g. "ministral-3b"
      device: "cpu"
      slots: 1
      context_length: 4096
      channel: "sdk"
      enabled: false            # enable when utility model is loaded
    router:
      key: ""                   # e.g. "cosysim-gemma-270m-router"
      device: "cpu"
      slots: 1
      context_length: 2048
      channel: "sdk"
      enabled: false            # enable after fine-tuning
    draft:
      key: ""                   # same as router for dual-purpose
      use_as_draft_for: "primary"
      enabled: false
    embedding:
      key: "text-embedding-nomic-embed-text-v1.5"
      device: "cpu"
      enabled: true

  # ── Llmster / Daemon Mode ────────────────────────────────────────
  llmster:
    enabled: true               # enable llmster CLI management
    lms_path: ""                # explicit path to lms binary (empty = auto-detect)
    auto_daemon: false          # auto-start daemon if not running
    default_n_parallel: 4       # continuous batching slots for model loads
    unified_kv_cache: true      # LMStudio 0.4.0 unified KV cache

  # ── Task Queue (LMS Task Bridge async execution) ────────────────
  task_queue:
    enabled: true
    workers: 1                  # number of background worker threads
    max_queue_size: 100         # 0 = unbounded
    retry_max: 3                # max retries per failed task
    retry_backoff: [1, 2, 4]    # backoff seconds per retry attempt
    fallback_model: ""          # model to try when primary fails (empty = none)
    # v1.50.1 [2026-03-22] — Config-driven task affinity (model pattern matching)
    affinity:
      code: ["*coder*", "*codex*", "*starcoder*", "*deepseek-coder*", "*qwen*coder*"]
      vision: ["*vision*", "*llava*", "*qwen*vl*", "*pixtral*"]
      chat: ["*chat*", "*instruct*", "*qwen*", "*llama*"]
      router: ["*0.6b*", "*270m*", "*router*"]
      embedding: ["*embed*", "*bge*", "*e5*"]
      evaluation: ["*judge*", "*eval*", "*qwen*"]
    task_routing:               # route task types to specific models
      code_review: ""
      security_check: ""
      test_generate: ""
      doc_generate: ""
      refactor: ""
      summarize: ""
      evaluate: ""
      translate: ""

  # ── Remote Inference Hosts ──────────────────────────────────────
  remote_hosts: []
  #   - name: "colab_l4"
  #     url: "https://xxx.ngrok.io"
  #     gpu: "L4"
  #     vram_mb: 24576
  #     enabled: false
  #   - name: "colab_a100"
  #     url: "https://yyy.ngrok.io"
  #     gpu: "A100"
  #     vram_mb: 40960
  #     enabled: false

# Hardware profile (used by LMStudioManager for VRAM estimation)
hardware:
  gpu_name: "NVIDIA GeForce RTX 2060"
  gpu_vram_mb: 12288   # 12 GB
  ram_gb: 32
  cpu: "Intel Core i9"

# ComfyUI configuration
comfyui:
  enabled: false
  base_url: "http://localhost:8188"
  output_dir: "C:/ComfyUI/output"
  timeout: 500
  generation:
    steps: 30
    cfg: 5.5
    sampler_name: "euler"
    scheduler: "normal"
    denoise: 1.0
    # model: auto (detected from available checkpoints)
    # width/height: from media_standards below

# Media standards — all services read dimensions from here
media_standards:
  image:
    selfie:    { width: 512, height: 768, format: png }
    portrait:  { width: 512, height: 768, format: png }
    thumbnail: { width: 200, height: 200, format: jpg }
  video:
    message: { width: 640, height: 480, fps: 24, codec: h264, max_duration: 15 }
    call:    { width: 640, height: 480, fps: 15, codec: h264 }
  audio:
    voice_message: { sample_rate: 22050, channels: 1, format: wav, min_duration: 10, max_duration: 3600 }
    voice_mail:    { sample_rate: 22050, channels: 1, format: wav, min_duration: 10, max_duration: 3600 }

# MCP (Model Context Protocol) servers
mcp:
  port: 8700
  base_url: "http://localhost:8700"
  servers:
    - name: "cosysim"
      url: "http://localhost:8700/mcp/sse"
      allowed_tools: []   # empty = all tools enabled
      enabled: true
  # Additional servers can be appended here:
  # - name: "filesystem"
  #   url: "ws://127.0.0.1:3001"
  #   allowed_tools: []
  #   enabled: true

# Character system
characters:
  default_personality: "playful"
  default_role: "girlfriend"
  memory:
    max_context_messages: 200
    importance_threshold: 0.5
    embedding_batch_size: 32

# Services configuration
services:
  autonomous_messenger:
    enabled: true
    frequency: "moderate"  # low, moderate, high
    active_hours:
      start: 8
      end: 23
  
  voice_calls:
    enabled: true
    max_duration: 3600  # seconds
  
  video_calls:
    enabled: true
    fps: 15
    resolution: [640, 480]

# Asset management
assets:
  validation:
    check_existence: true
    check_format: true
    check_integrity: true
  versioning:
    enabled: true
    max_versions: 5

# Logging
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "./logs/cosysim.log"
  max_bytes: 10485760  # 10MB
  backup_count: 5

# Agent profiles — map agent roles to LLM parameters
# Used by MCPFramework.get_agent_profile() and ModelManager.ensure_for_agent()
agent_profiles:
  big:
    model: ""                     # empty = use default loaded model
    context_length: 8192
    max_tokens: 800
    temperature: 0.75
    top_p: 0.9
    description: "Primary character agent — deep reasoning, long context"
  small:
    model: ""
    context_length: 2048
    max_tokens: 800
    temperature: 0.6
    top_p: 0.9
    description: "Fast utility agent — narration, summaries, routing"
  router:
    model: ""
    context_length: 1024
    max_tokens: 200
    temperature: 0.3
    top_p: 0.9
    description: "Intent classifier — low tokens, deterministic"
  narrator:
    model: ""
    context_length: 4096
    max_tokens: 1500
    temperature: 0.8
    top_p: 0.95
    description: "Scene narrator — creative, atmospheric prose"
  game_master:
    model: ""
    context_length: 4096
    max_tokens: 2000
    temperature: 0.65
    top_p: 0.9
    description: "Game engine agent — fair, rule-following, dramatic"

# Pipeline configuration — VirtualPipeline parallel stream architecture
pipeline:
  enabled: true
  watcher:
    enabled: true
    model_key: ""                  # Set to Gemma 270M key when available
    trigger_tokens: 8              # Tokens before first watcher classification
    batch_size: 16                 # Tokens per subsequent batch check
  kill_switch:
    enabled: true
    threshold: 0.3                 # Acceptability below this → kill
    max_retries: 2                 # Retries before accepting best attempt
    repetition_limit: 3            # Same phrase N times → kill
  token_ahead:
    enabled: true
    pre_warm_timeout: 5.0          # Seconds to wait for pre-warmed tools
  conversation:
    max_branches: 10               # Max active branches per conversation
    branch_ttl: 300                # Seconds before pruning unused branches

# Observability — metrics and alerting system
observability:
  metrics_db: "data/metrics.db"
  system_tick_interval: 1.0        # Seconds between system snapshots
  retention_hours: 24              # Prune system_metrics older than this
  alerts:
    gpu_vram_pct:
      yellow: 80
      red: 95
    queue_depth:
      yellow: 5
      red: 15
    avg_latency_ms:
      yellow: 500
      red: 2000
    kill_rate:
      yellow: 0.1
      red: 0.3
    error_rate:
      yellow: 0.05
      red: 0.15
  process_monitoring:
    scan_interval_seconds: 60
    stall_threshold_seconds: 300
    categories:
      - git
      - python
      - lmstudio
      - node
      - chrome
      - comfyui
    alerts:
      worker_count:
        yellow: 50
        red: 100
      memory_mb:
        yellow: 8000
        red: 11000
      stalled_count:
        yellow: 1
        red: 3
  # v1.60.0 [2026-06-13] — error-aggregator LRU + rate alerting
  error_aggregator:
    max_buckets: 2000           # LRU cap on retained fingerprint buckets
    alert_threshold: 100        # errors within window that trip a rate alert (0 disables)
    alert_window_sec: 300       # sliding window for the rate alert
    alert_cooldown_sec: 300     # min spacing between alerts (throttle)
  oracle:
    flood_cooldown_sec: 5.0     # per-fingerprint callback cooldown
    flood_guard_max_keys: 1000  # LRU cap on fingerprints in the flood guard

# Training data pipeline
training:
  auto_capture: true               # Capture training data from pipeline
  min_quality: 0.7                 # Minimum quality score for capture
  # Python executable for training subprocesses (needs unsloth installed).
  # Set to conda base python path if running CosySim in a venv.
  # Override at runtime via COSYSIM_TRAIN_PYTHON env var.
  python_executable: ""            # empty = auto-detect from COSYSIM_TRAIN_PYTHON or sys.executable
  auto_train:
    enabled: false                 # Opt-in automated retraining
    min_examples: 100              # Examples needed before auto-train
    schedule: "daily"
  datasets:
    tag_extraction:
      threshold: 100
    tool_routing:
      threshold: 50
    priority_classify:
      threshold: 50
    decision_classify:
      threshold: 50
    response_validate:
      threshold: 50

# Home Assistant integration
homeassistant:
  url: "http://homeassistant.local:8123"
  token: ""
  auto_discover: true
  notification_service: "notify.mobile_app_sm_s908b"
  poll_interval_seconds: 30
  news_alert_threshold: 0.7


# AnythingLLM integration (phone + laptop instances)
anythingllm:
  default_instance: "laptop"
  timeout_seconds: 30
  instances:
    laptop:
      url: "http://localhost:3001"
      api_key: ""
    phone:
      url: ""
      api_key: ""

# NotebookLM integration — via NLM Live Proxy at :8800 (HAR-based auth)
notebooklm:
  enabled: true                        # enable NLM Live Proxy
  proxy_url: "http://localhost:8800"    # NLM Live Proxy URL
  base_url: "http://localhost:8800"    # alias for proxy_url
  default_notebook_id: ""              # default notebook for queries
  timeout: 120                         # per-request timeout seconds
  metadata_path: "data/nlm_notebooks.json"  # notebook metadata persistence
  rate_limit_seconds: 1.5              # minimum gap between outbound NLM calls
  flywheel:
    enabled: true
    min_interval_hours: 8
    max_tasks: 6
    distill_category: "notebooklm-flywheel"
    multi_ask_questions:
      - "Summarize the current Copilot/Nexus/NotebookLM control-plane state in 6 grounded bullet points. Prefer concrete modules, files, and runtime surfaces over general advice."
      - "List the highest-value integration gaps or brittle control-plane surfaces that should be addressed next so the system keeps compounding instead of re-discovering context."
      - "List the most important auth freshness, credential keepalive, checkpoint, compaction, scheduler, or browser-session actions the system should keep checking to stay reliable."

# ──── NeonCity 2 Game Systems ────

# Character neurochemistry — drives NPC emotional behaviour
neurochemistry:
  enabled: true
  tick_interval_seconds: 60     # how often decay/recovery runs (1 game hour)
  save_interval_ticks: 5        # persist every N ticks
  detailed_prompt_injection: false  # true = full NT levels in prompt; false = summary
  interceptor_priority: 4       # lower = earlier in pipeline
  # v1.60.0 [2026-06-13] — NLP stimulus auto-detection from dialogue (StimulusDetectInterceptor)
  stimulus_detect:
    enabled: true
    incoming_intensity: 0.6     # effect strength of a line said TO an agent
    reply_intensity: 0.5        # reflexive effect of the agent's own line on itself
    max_rules_per_text: 4       # cap stimuli applied per text
    min_text_len: 2
  baselines:
    dopamine: 0.45
    serotonin: 0.50
    oxytocin: 0.30
    cortisol: 0.25
    adrenaline: 0.15
    endorphins: 0.40
  half_lives:
    dopamine: 4.0
    serotonin: 12.0
    oxytocin: 6.0
    cortisol: 3.0
    adrenaline: 2.0
    endorphins: 5.0
  tolerance_decay_rate: 0.02    # per tick
  tolerance_gain_rate: 0.1      # per stimulus application

# Skill progression — player skills and level system
skill_progression:
  enabled: true
  max_skill_level: 5
  max_global_level: 50
  auto_xp_on_check: true        # award XP on skill checks automatically
  level_thresholds: [0, 100, 300, 600, 1000, 2000]
  diminishing_returns:
    0: 1.0
    1: 0.85
    2: 0.65
    3: 0.45
    4: 0.30
    5: 0.20
  difficulty_xp_multipliers:
    trivial: 0.25
    easy: 0.5
    medium: 1.0
    hard: 1.5
    very_hard: 2.0
    legendary: 3.0
    impossible: 5.0

# Territory control — faction warfare and crew HQ
territory:
  enabled: true
  war_threshold: 10.0           # control shift % that triggers faction war
  faction_tick_interval: 300    # seconds between autonomous faction moves
  max_event_history: 100
  districts:
    - DOWNTOWN
    - COMBAT_ZONE
    - HIGHRISE
    - UNDERWORLD
    - TECH_DISTRICT
    - OUTSKIRTS
  factions:
    - OmniCorp
    - NeoTech
    - BlackMarket
    - Ghost_Net
    - SynthSec
    - DeepState
  # v1.60.0 [2026-06-13] — Player standing tilts autonomous faction decisions
  faction_ai:
    player_influence: 0.4         # 0-1, how strongly player standing tilts action scores
    player_target_threshold: 25   # |standing| above which a faction steers toward player's district
    player_district: ''           # optional fallback for the player's current district id

# v1.59.0 [2026-06-13] — Economy settlement (market.buy/sell ↔ player wallet,
# inventory, and heat). Closes the inventory↔market↔heat feedback loop.
# v1.60.0 [2026-06-13] — event_shocks: world events drive supply/demand.
economy:
  settle: true                  # market.buy/sell deduct/credit the player wallet + inventory
  contraband_heat_per_unit: 4   # heat added per illegal unit purchased
  sell_to_inventory: true       # sell removes the item from inventory (requires possession)
  event_shocks:
    enabled: true               # gates Market.subscribe_to_world_events() world-event→price loop
    scale: 1.0                  # global multiplier on every world-event supply/demand shock

# ════════════════════════════════════════════════════════════════════════
# v1.60.0 [2026-06-13] — "Living Systems" — feedback-loop tunables. Every key
# below has a safe in-code default; these expose the knobs for retuning.
# ════════════════════════════════════════════════════════════════════════

# Faction standing → shop access, pricing, mission gating (engine/world/faction_gates.py)
faction_gates:
  allied_threshold: 50          # standing >= this => 'allied' band
  friendly_threshold: 20        # >= this => 'friendly'
  hostile_threshold: -20        # <= this => 'unfriendly'
  enemy_threshold: -50          # <= this => 'hostile'
  shop_min_standing: -50        # default min standing to enter a faction shop
  match_discount: 0.10          # matching-faction discount (-10%)
  rival_surcharge: 0.15         # rival-faction surcharge (+15%)
  ally_bonus_discount: 0.05     # extra discount for full allies
  enemy_bonus_surcharge: 0.15   # extra surcharge for sworn enemies

# Mission consequences, skill-scaling, and chain gating (engine/world/mission*.py)
mission:
  consequences:
    enabled: true
    control_per_difficulty: 3   # faction control gained on success (× difficulty)
    rep_success: 4              # flat reputation gained on success
    rep_fail_per_difficulty: 2  # reputation lost on failure (× difficulty)
    heat_fail_per_difficulty: 4 # heat gained on failure (× difficulty)
    heat_success_heist: 5       # heat left by a successful (loud) heist
    heist_control_bonus: 4      # extra faction control for a successful heist
  scaling:
    enabled: true
    pivot: 1.0                  # skill level around which scaling is neutral
    reward_slope: 0.20          # reward multiplier slope per skill point above pivot
    difficulty_slope: 0.30      # difficulty multiplier slope per skill point above pivot
    min_difficulty: 1
    max_difficulty: 5
  crew:
    enforce_availability: true  # reject assigning busy roster members
  chains:
    gating_enabled: false       # true => hide gated chain follow-ups until prerequisite done

# Crew operation skill-checks (engine/world/crew.py)
crew:
  skill_check:
    base_chance: 0.20           # baseline success before crew contribution
    level_weight: 0.06          # per role-weighted crew skill point
    loyalty_weight: 0.20        # contribution of avg loyalty at 100
    difficulty_weight: 0.55     # how hard per-op difficulty bites
    min_chance: 0.05            # clamp floor (never a guaranteed loss)
    max_chance: 0.95            # clamp ceiling (never a guaranteed win)
    partial_band: 0.20          # miss-by-this-much => PARTIAL not FAILURE
    partial_reward_mult: 0.45   # credit/xp scale on partial success

# Equipment bonuses + consumable wear (engine/world/equipment_effects.py)
world:
  equipment:
    condition_scales_bonus: true       # equipped-item bonus scales with condition
    decrement_condition_on_use: true   # consumables lose condition on use
    condition_loss_per_use: 0          # condition removed per use (0 = stack-decrement only)

# Scheduler per-task timeout enforcement (engine/nexus/scheduler_daemon.py)
scheduler:
  default_timeout_seconds: 300         # daemon-wide per-task hard timeout (<=0 disables)
  news_fetch_timeout_seconds: 120      # tighter timeout for network-bound news-fetch

# LMStudio federation health backoff (engine/lmstudio/lmlink_manager.py)
lmlink:
  health:
    backoff:
      base_seconds: 0.5
      max_seconds: 30.0
      factor: 2.0
      max_attempts: 3
      jitter_ratio: 0.5

comms:
  governance_enabled: true      # route CharacterAgent.reply() through interceptors
  skill_manifest_path: "config/skill_manifests.yaml"
  interceptors:
    dialogue_gate:             true    # gate NPC dialogue by player reputation
    nexus_prompt:              true    # inject Nexus knowledge/rules into agent context
    nexus_context_injector:    true    # inject Nexus search results before each LLM call
    content_intensity:         true    # adult content gate (ContentIntensityInterceptor)
    router_message_injector:  true
    auto_result_injector:     true
    skill_awareness:          true
    game_rules:               true
    personality_guard:        true
    policy_enforcer:          true
    memory_enhancer:          false   # extra RAG lookup — heavier, opt-in
    response_shaper:          true
    activity_logger:          true
    comms_logger:             true    # v1.62.0 [2026-06-15] — CB-T2: write agent replies → GlobalCommsLog
    relationship_context:     true    # inject player-NPC relationship into system prompt
    grammar_scanner:          true    # post-call grammar/quality scanner → training signal
  stats_poll_interval_ms: 2000  # how often the browser overlay polls /api/stats/live
  # ── v1.62.0 [2026-06-15] — GlobalCommsLog backbone ──────────────────
  log:
    db_path: "data/comms_log.db"  # single source of truth for all communication
    max_rows: 50000               # prune() cap to bound growth
  # ── v1.62.0 [2026-06-15] — CB-T3: NPC↔NPC hybrid messaging ───────────
  npc:
    enabled: true                 # master toggle for the NPC comms scheduler
    tick_interval: 30             # seconds between NPC↔NPC scheduling ticks
    max_pairs_per_tick: 2         # NPC pairs processed per tick
    llm_chance: 0.25              # P(an "important" exchange uses a live LLM turn)
    recent_pair_window: 6         # how many recently-messaged pairs to penalise
    roster:                       # fallback cast when the character DB is empty
      - lola
      - viktor
      - aria
      - frankie
      - mira
    # ── v1.62.0 [2026-06-15] — CB-T6: pairwise relationship effects ──────
    # Each NPC↔NPC exchange nudges the pair's relationship_level (0..1) so
    # affinity drifts gradually over many exchanges. Deltas are intentionally
    # SMALL; tone (warm/neutral/cool) and detected keywords combine, then the
    # result is clamped to [min_level, max_level].
    relationship:
      enabled: true               # master toggle for pairwise relationship drift
      warm_delta: 0.02            # template-tone "warm" exchange → +affinity
      neutral_delta: 0.005        # template-tone "neutral" exchange → tiny +affinity
      cool_delta: -0.02           # template-tone "cool" exchange → -affinity
      keyword_positive: 0.015     # per-exchange bonus when a positive keyword is present
      keyword_negative: -0.03     # per-exchange penalty when a negative keyword is present
      max_step: 0.06              # absolute cap on a single exchange's net delta
      min_level: 0.0              # clamp floor for relationship_level
      max_level: 1.0              # clamp ceiling for relationship_level
  # ── v1.62.0 [2026-06-15] — CB-T5: calmer + more varied user inbox ─────
  # Tunes the USER-facing autotext path ONLY (phone autotxt ticker). The
  # NPC↔NPC scheduler (comms.npc, above) is a separate path and is NOT
  # affected by these knobs.
  autotxt:
    user_multiplier: 1.75        # global scale on user-facing autotext intervals
                                 # (1.0 = base ranges; >1 = calmer / less spammy)
    topic_seed_chance: 0.45      # P(an autotext is seeded with a real city topic
                                 # drawn from recent world events / comms)
    # Per-character override of user_multiplier, e.g. {aria: 1.2, lola: 2.5}.
    # Omitted characters use user_multiplier. Lets clingy NPCs stay eager
    # while chatty ones get throttled harder.
    per_character: {}
  # ── v1.62.0 [2026-06-15] — CB-T4: leave-a-message presence ───────────
  presence:
    enabled: true                              # master toggle for presence/leave-a-message
    player_offline_when_disconnected: true     # player is "offline" when no phone client is connected
    npc_requires_co_presence: true             # an NPC is reachable only when co-present (same location)

# ──── Phone OS (v1.62.0 [2026-06-15] — PH-T1) ────
# Derived security/capability magnitudes for engine.world.phone_os.PhoneOS.
# These tune how base npc_phone records (security_level/firewall/installed_apps)
# plus the player's equipped cyberdeck/ICE roll up into effective stats. PH-T2
# adds the real software/hardware upgrade catalog on top of these knobs.
phone:
  os:
    base_security: 1               # fallback base security when a record lacks one
    base_firewall: 1               # fallback base firewall when a record lacks one
    base_app_slots: 6              # baseline number of apps a phone can hold
    app_slots_per_security: 1      # extra app slots granted per point of base security
    deck_crack_to_hack: 1.0        # player cyberdeck crack_speed → hack_power multiplier
    deck_trace_to_firewall: 1.0    # player cyberdeck trace_resist → firewall multiplier
    hacking_bonus_to_hack: 1.0     # player equipment "hacking" bonus → hack_power multiplier
    seed_security_spread: [1, 2, 3]  # deterministic base-security spread for seeded NPCs
    seed_archetype_security:       # archetype/faction → seeded base security (when known)
      netrunner: 4
      corpo: 3
      fixer: 2
      civilian: 1
  # ── v1.62.0 [2026-06-15] — PH-T3: player→NPC phone hacking ────────────
  hack:
    enabled: true                  # master toggle for the phone-hack skill
    die_sides: 20                  # size of the d20 attack roll (hack_power + d20)
    skill_weight: 2                # PlayerState "hacking" skill points → attack bonus (per level)
    base_difficulty: 8             # flat difficulty added to NPC security+firewall
    read_limit: 5                  # max comms entries returned/observed per intercept (moderate)
    steal_credits_min: 40          # min credit reward on a successful steal (moderate)
    steal_credits_max: 120         # max credit reward on a successful steal (scales with margin)
    success_heat: 2                # heat added on a quiet successful breach
    fail_heat: 8                   # heat added on a noisy failed breach (recoverable)
    fail_rel_delta: -0.08          # standing hit toward the player when the NPC notices (bounded)
    # ── v1.62.0 [2026-06-15] — PH-T4: reverse direction (NPC hacks the PLAYER) ──
    npc:
      enabled: true                      # master toggle for NPC→player hacking
      die_sides: 20                      # size of the attacker's d20 roll
      base_difficulty: 8                 # flat difficulty added to the player's defence
      attacker_power_floor: 2            # innate attack floor for NPCs (no offensive software)
      read_limit: 3                      # max player threads an NPC reads per breach (bounded)
      success_heat: 3                    # capped heat a successful breach adds to the player
      rel_delta: -0.08                   # bounded (player, attacker) standing hit (recoverable)
      trigger_probability: 0.05          # P(roll a hack) once an NPC is hostile — keep RARE
      hostility_standing_threshold: 0.3  # NPC→player standing at/below this counts as hostile
      # ── v1.62.1 [2026-06-15] — L2: faction hostility triggers the hack ──
      # PRIMARY faction path: hostility is DERIVED from the attacker's own
      # faction. The NPC's faction is resolved from the canonical character→
      # faction map; if the PLAYER's standing with that faction is <=
      # faction_hostile_threshold, the NPC is hostile (no list needed).
      faction_hostile_threshold: -40     # player faction standing at/below this counts as hostile
      # Optional explicit OVERRIDE: faction ids listed here are ALWAYS hostile
      # regardless of standing (an attacker in one of these factions is forced
      # hostile). Leave empty to rely purely on the derived path above.
      hostile_factions: []

# Framework settings
framework:
  state_persistence: true         # auto-save/load MCPFramework state
  state_file: "data/mcp_framework_state.json"
  max_event_log: 500              # max events in the event bus log
  max_consequence_age_turns: 50   # auto-clean old fired consequences

# Nexus Knowledge System integration
nexus:
  enabled: true
  base_url: "http://localhost:8700"
  auto_submit: false
  knowledge_expiry:
    default_max_age_days: 90
    category_ttl_days:
      news: 2
      session: 30
      memory: 60
      auto: 90
      architecture: 365
      api: 180
      debugging: 60
      testing: 90
      system: 365
      research: 90
      history: 30
      plan: 30
    stale_threshold: 0.2
    auto_archive_stale: false
  operator_inbox:
    state_path: "data/operator_inbox_state.json"
    auto_sync_schedule: "every_15m"
    plan_digest_limit: 10
  embeddings:
    enabled: true                # v1.50.2 — Controls Gemini provider init (EmbeddingService reads this)
    provider: "auto"             # "gemini" (primary), "local" (LMStudio), "auto"
    model: "gemini-embedding-2-preview"  # Gemini Embedding 2 Preview (multimodal, MRL)
    dimensions: 768              # MRL: 768 (fast), 1536 (balanced), 3072 (max quality)
    local_model: "text-embedding-nomic-embed-text-v1.5"  # LMStudio embedding model key (fallback)
    cache_size: 10000            # In-memory embedding cache entries
    batch_size: 100              # Max texts per batch API call
    auto_embed: true             # Auto-embed new Nexus entries
    normalize: true              # L2-normalize for MRL dimensions < 3072
  vector_store:
    enabled: true
    persist_dir: "data/nexus_vectors"
    default_top_k: 5
    min_score: 0.5               # Minimum similarity for query results

  # v1.50.1 [2026-03-22] — Config-driven query router thresholds
  query_router:
    cache_confidence: 0.90       # Q&A cache hit confidence
    vector_confidence: 0.82      # Vector semantic search confidence
    # v1.57.0 [2026-03-26] — Tier 2.5: Google File Search grounded citations
    file_search_confidence: 0.85 # Google File Search (managed RAG with grounded docs)
    search_high: 0.75            # Strong FTS match
    search_medium: 0.50          # Decent FTS match
    search_low: 0.30             # Weak match
    min_answer_length: 20        # Minimum chars for valid answer
    local_cache_ttl: 300         # Session cache TTL in seconds

  # v1.55.0 [2026-03-26] — Nexus-first agent cache: check knowledge before GPU
  agent_cache:
    enabled: true                # Master toggle for Nexus-first agent inference
    min_confidence: 0.75         # Minimum confidence to accept a Nexus answer
    skip_tool_calls: true        # Skip Nexus check when request has tool integrations
    skip_system_only: true       # Skip when request has no user message (system-only)

  # v1.51.0 [2026-03-24] — Backup count cap to prevent unbounded growth
  backup_max_per_db: 3             # Keep N most recent backups per database name

  # v1.50.2 [2026-03-24] — Task auto-assignment config
  tasks:
    auto_assign:
      enabled: true              # Enable automatic task→agent assignment
      interval: "every_5m"       # How often the daemon runs auto-assign
      stale_timeout_hours: 24    # Reset CLAIMED tasks to PENDING after this
      min_match_score: 0.3       # Minimum agent-task match score (0.0-1.0)

# GitHub Codespace remote execution
codespace:
  enabled: true
  gh_path: "gh.exe"
  default_repo: "nihilistau/CosySim"
  default_machine: "standardLinux32gb"
  idle_timeout: "30m"


# CDP Auth Recovery — Chrome DevTools Protocol settings
# v1.50.1 [2026-03-22] — Config-driven CDP auth recovery
cdp:
  port: 9223                         # Chrome CDP port (CLAUDE.md: always 9223)
  navigation_wait_s: 6               # Seconds to wait after page navigate
  harvest_timeout_s: 18              # API key harvest deadline
  cookie_max_age_days: 7             # Trigger recovery when cookies older
  bl_max_age_days: 8                 # Trigger BL refresh when older
  max_recovery_attempts: 3           # Retries before giving up
  account_name: "nihilistcod"        # Default account for pool sync

# NPC Scheduler — autonomous NPC world activity
npc_scheduler:
  enabled: true
  tick_interval: 60
  max_npcs_per_tick: 3
  fallback_npcs:
    - lola
    - viktor
    - aria
  activity_pool:
    - "tending to business in the area"
    - "having a quiet moment to themselves"
    - "browsing nearby goods"
    - "chatting with someone"
    - "lost in thought"

# Penthouse scene runtime tuning (read via get_config().get("penthouse.<...>"))
# v1.62.0 [2026-06-15] — ambient micro-behavior layer config namespace.
penthouse:
  # Cheap, scripted idle micro-behaviors that run BETWEEN the slow LLM agent
  # ticks so idle characters feel alive without spamming the local model.
  ambient:
    enabled: true
    tick_interval: 3.0        # seconds between cheap ambient ticks (≪ agent tick)
    action_chance: 0.6        # P(an eligible character does a micro-action per tick)
    max_per_tick: 2           # cap characters touched per tick (cheap fan-out)
    llm_line_chance: 0.04     # P(a micro-action escalates to an LLM line via agent path)
    reposition_chance: 0.15   # extra gate on the (rare) drift-to-nearby-location kind
    player_present_boost: 1.6 # weight multiplier for player-facing glances
    action_weights:
      fidget: 4.0
      glance: 3.0
      expression: 3.0
      reposition: 1.0
  # Bed-game / explicit-pose consent gate (existing reads in penthouse_combat_mixin).
  bedgame:
    explicit_pose_level: 3
    explicit_openness_min: 60

# Automated Testing Scheduler
testing:
  default_suite: "full"
  scene_ports: [5555, 5556, 5571, 8500]
  unit_test_timeout: 300
  health_check_timeout: 30
  browser_checks:
    - console_errors
    - network_failures
    - dom_health
  store_results_in_nexus: true
  schedule_interval_minutes: 0
  smart_runner:
    enabled: true
    default_tier: 2
    parallel_workers: auto
    timing_cache: "data/test_timing.json"
    reports_dir: "data/test_reports"
    hash_cache: "data/test_hash_cache.json"
    skip_patterns:
      - "test_agent_loop.py"
      - "live_wire_test.py"
    tier_1_patterns:
      - "test_scene_imports"
      - "test_skill_registry"
      - "test_config"
    tier_2_patterns:
      - "test_penthouse*"
      - "test_phone*"
      - "test_lab*"
      - "test_multiplayer*"
    tier_3_patterns:
      - "test_pipeline*"
      - "test_copilot*"
      - "test_nexus*"

# ── v1.51.0 [2026-03-24] — System Maintenance ─────────────────────────────
maintenance:
  chrome_cache_cleanup: true         # Clear Chrome profile caches on daily cleanup
  har_max_age_days: 7                # Delete HAR/heap files older than this
  log_retention_days: 7              # Structured log retention (DB + JSONL)
  conversation_idle_seconds: 3600    # Evict conversations idle longer than this (1h)
  conversation_max_count: 200        # Hard cap on active ConversationManager entries
  wal_checkpoint_on_startup: true    # Checkpoint all SQLite WAL files at scene startup
  meta_metrics_retention_days: 30    # Prune meta_metrics data older than this

# ── v1.62.0 [2026-06-15] — OR-T1: Oracle omniscience (reads the comms log) ──
# The Oracle "sees all" by reading the GlobalCommsLog and turning overheard
# chatter (player↔NPC + NPC↔NPC) into cryptic fortunes, intel, and omens —
# all bounded by a privacy/spoiler budget (cryptic + occasional, NOT a dump).
oracle:
  comms:
    fortune_chance: 0.4        # P(a fortune weaves in real overheard comms); else stays atmospheric
    max_refs: 2                # hard cap on comms entries referenced in a single reading (never dump everything)
    recent_window: 30          # how many recent entries to scan for npc_dm chatter / signal sourcing
    omen_weight: 6             # OracleCompanion weighted-action weight for the rare comms omen (small → rare)
    signal_reward_credits: 75  # bounded credit reward granted by read_the_signal (0 disables)
    signal_reward_item: "intel_fragment"  # small intel item granted by read_the_signal ("" disables)
    signal_cooldown_sec: 900   # read_the_signal cooldown (also enforced by the @skill decorator)
    respect_sensitive: true    # skip/abstract comms flagged sensitive/mature/intimate (privacy + consent)

# ── v1.63.0 [2026-06-15] — Emergent Engine (A1: persistent sim store) ──
# The emergent engine persists the genuinely-new living-world state (NPC goals,
# world events) across restarts in a single SQLite store. Faction/territory
# state is owned by engine.world.territory.TerritoryManager — not duplicated
# here (reuse-first slim retired the emergent FactionRegistry).
emergent:
  store:
    db_path: "data/emergent.db"  # persistent sim store for the emergent engine
  # ── v1.63.0 [2026-06-15] — A3: per-NPC goal generation tuning ──
  # All weights/thresholds for the PURE goal generator + re-prioritiser. Tune
  # NPC drives here without code changes; engine/world/emergent/goals.py reads
  # these via get_config().get("emergent.goals.*", default).
  goals:
    rel_negative: -0.4       # relationship <= this is hostile -> revenge goal
    rel_positive: 0.6        # relationship >= this is close   -> romance goal
    base_wealth: 0.30        # baseline priority of the always-on wealth goal
    revenge_weight: 0.80     # multiplies |relationship| for revenge priority
    romance_weight: 0.70     # multiplies relationship for romance priority
    rank_priority: 0.45      # priority of a faction RANK goal
    territory_priority: 0.40  # priority of a faction TERRITORY goal
    lay_low_boost: 0.50      # added on top of the current max so LAY_LOW sorts first
    success_decay: 0.30      # subtracted from a satisfied goal's priority
    failure_bump: 0.30       # added to a thwarted goal's priority
  # ── v1.63.0 [2026-06-15] — A4: hybrid planner tuning ──
  # Weights for the PURE action planner (utility = priority * fit * feasibility)
  # and the verb dispatcher. engine/world/emergent/planner.py reads these via
  # get_config().get("emergent.planner.*", default). The planner DISPATCHES to
  # the existing managers (market/territory/crew/phone_hack/relationship_effects/
  # npc_comms) — it does not re-implement them.
  planner:
    priority_weight: 1.0     # weight on the goal's own priority
    fit_weight: 1.0          # weight on how well the verb fits the goal
    feasibility_weight: 1.0  # weight on whether the action is even possible
    min_utility: 0.01        # below this, plan_action returns None
    llm_chance: 0.05         # P(use_llm) for a PIVOTAL action (kept rare)
    trade_default_qty: 1     # default quantity for a trade dispatch
    contest_delta: 3.0       # control delta for a contest (clamped to CONTROL_SHIFT_RANGE)

