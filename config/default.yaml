# CosySim Default Configuration
# Base config file. Override settings in development.yaml or production.yaml

system:
  name: "CosySim AI Playground"
  version: "2.0.0"
  environment: "default"

# Paths configuration
paths:
  project_root: "."
  data_dir: "./data"
  models_dir: "./pretrained_models"
  cache_dir: "./cache"
  logs_dir: "./logs"
  media_dir: "./content/simulation/media"
  assets_dir: "./content/assets"
  database_dir: "."

# Database configuration
database:
  sqlite:
    path: "simulation.db"
    pool_size: 5
    timeout: 30
  chromadb:
    path: "./content/simulation/chroma_db"
    collection_name: "memories"
    embedding_model: "sentence-transformers/all-MiniLM-L6-v2"

# Scene configuration
scenes:
  phone:
    host: "localhost"
    port: 5555
    debug: false
    auto_reload: false
  
  dashboard:
    host: "localhost"
    port: 8501
    theme: "dark"
  
  bedroom:
    host: "localhost"
    port: 5556
    debug: false

# TTS configuration
tts:
  engine: "cosyvoice"
  model_name: "CosyVoice-300M"
  sample_rate: 22050
  warm_start: true
  stream: true
  device: "cuda"  # or "cpu"
  server_url: "http://localhost:8600"  # Qwen3-TTS FastAPI server

# STT configuration  
stt:
  engine: "whisper"
  model_size: "base"
  language: "en"
  device: "cuda"

# LLM configuration
llm:
  provider: "lmstudio"  # or "openai", "local"
  base_url: "http://localhost:1234/v1"
  model: "qwen3-vl-8b"
  temperature: 0.7
  max_tokens: 5000
  stream: true

# LMStudio SDK configuration
lmstudio:
  host: "127.0.0.1"
  port: 1234
  base_url: "http://127.0.0.1:1234"
  # API version: "v1" = legacy OpenAI-compat, "api_v1" = new LMStudio protocol
  api_version: "v1"
  # Default model-load options (tuned for RTX 2060 12 GB)
  default_load_opts:
    gpu: 0.9          # fraction of layers to offload to GPU
    ttl: 3600         # model time-to-live in seconds (0 = never unload)
    context_length: 4096
  # Hard cap: keep total GPU usage below this (MB)
  vram_cap_mb: 11500
  # CLI command (must be on PATH or full path)
  cli: "lms"
  # MCP integration
  mcp_enabled: false          # set true to use per-request MCP via REST API
  cosysim_mcp_url: ""         # URL of CosySim MCP server (e.g. http://localhost:8600/mcp/sse)
  mcp_json_path: ""           # path to LMStudio mcp.json for auto-registration
  # Model loading strategy
  # concurrent — one model always resident; up to concurrent_slots parallel requests
  # jit        — load on demand, evict previous model
  # jit_ttl    — like jit but auto-unload after jit_ttl_seconds of inactivity
  load_mode: "concurrent"     # concurrent | jit | jit_ttl
  concurrent_slots: 4         # must match LMStudio Server → Advanced → "Max parallel requests"
  concurrent_model: ""        # pin a model for concurrent mode (empty = auto-resolve)
  jit_ttl_seconds: 300        # idle TTL for jit_ttl mode (seconds)

# Hardware profile (used by LMStudioManager for VRAM estimation)
hardware:
  gpu_name: "NVIDIA GeForce RTX 2060"
  gpu_vram_mb: 12288   # 12 GB
  ram_gb: 32
  cpu: "Intel Core i9"

# ComfyUI configuration
comfyui:
  enabled: false
  base_url: "http://localhost:8188"
  timeout: 500
  generation:
    steps: 30
    cfg: 5.5
    sampler_name: "euler"
    scheduler: "normal"
    denoise: 1.0
    # model: auto (detected from available checkpoints)
    # width/height: from media_standards below

# Media standards — all services read dimensions from here
media_standards:
  image:
    selfie:    { width: 512, height: 768, format: png }
    portrait:  { width: 512, height: 768, format: png }
    thumbnail: { width: 200, height: 200, format: jpg }
  video:
    message: { width: 640, height: 480, fps: 24, codec: h264, max_duration: 15 }
    call:    { width: 640, height: 480, fps: 15, codec: h264 }
  audio:
    voice_message: { sample_rate: 22050, channels: 1, format: wav, min_duration: 10, max_duration: 3600 }
    voice_mail:    { sample_rate: 22050, channels: 1, format: wav, min_duration: 10, max_duration: 3600 }

# MCP (Model Context Protocol) servers
mcp:
  port: 8700
  base_url: "http://localhost:8700"
  servers: []
  # Example server entry:
  # - name: "filesystem"
  #   url: "ws://127.0.0.1:3001"
  #   allowed_tools: []   # empty = all tools
  #   enabled: true

# Character system
characters:
  default_personality: "playful"
  default_role: "girlfriend"
  memory:
    max_context_messages: 200
    importance_threshold: 0.5
    embedding_batch_size: 32

# Services configuration
services:
  autonomous_messenger:
    enabled: true
    frequency: "moderate"  # low, moderate, high
    active_hours:
      start: 8
      end: 23
  
  voice_calls:
    enabled: true
    max_duration: 3600  # seconds
  
  video_calls:
    enabled: true
    fps: 15
    resolution: [640, 480]

# Asset management
assets:
  validation:
    check_existence: true
    check_format: true
    check_integrity: true
  versioning:
    enabled: true
    max_versions: 5

# Security
security:
  input_validation:
    max_message_length: 10000
    max_file_size: 10485760  # 10MB
  rate_limiting:
    enabled: false
    requests_per_minute: 60

# Logging
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "./logs/cosysim.log"
  max_bytes: 10485760  # 10MB
  backup_count: 5

# Testing
testing:
  database: "simulation_test.db"
  mock_external_services: true

# Communications / Governance framework
comms:
  governance_enabled: false     # set true to route CharacterAgent.reply() through interceptors
  skill_manifest_path: "config/skill_manifests.yaml"
  interceptors:
    router_message_injector:  true
    auto_result_injector:     true
    skill_awareness:          true
    game_rules:               true
    personality_guard:        true
    policy_enforcer:          true
    memory_enhancer:          false   # extra RAG lookup — heavier, opt-in
    response_shaper:          true
    activity_logger:          true
  stats_poll_interval_ms: 2000  # how often the browser overlay polls /api/stats/live
