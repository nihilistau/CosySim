# External Model Catalog
# ====================================
# Registry of external GLB/VRM models available for import.
# Scanned from C:\Files\Models\avatat_models and other sources.
# Models are loaded on-demand via GLTFLoader when selected.

# Source directories to scan for models
source_directories:
  - path: "C:/Files/Models/avatat_models"
    label: "Avatar Models"
    auto_scan: true
  - path: "data/penthouse/models/imported"
    label: "Imported Models"
    auto_scan: true

# Import settings
import:
  max_file_size_mb: 200
  supported_formats: [".glb", ".gltf", ".vrm"]
  auto_normalize: true
  target_height: 1.8  # meters
  center_on_feet: true
  apply_shadow: true

