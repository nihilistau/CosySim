# ──── Model Categories ────
categories:
  character:
    label: "Characters"
    description: "Full body character models with or without skeleton"
    icon: "👤"
  prop:
    label: "Props & Items"
    description: "Objects, accessories, and decorations"
    icon: "🎁"
  clothing:
    label: "Clothing"
    description: "Standalone clothing/outfit models"
    icon: "👗"
  environment:
    label: "Environment"
    description: "Room elements, furniture, decorations"
    icon: "🏠"
  unknown:
    label: "Uncategorized"
    description: "Models not yet categorized"
    icon: "❓"

# ──── Skeleton Mapping ────
# Maps common bone names from external models to our internal skeleton
bone_mapping:
  # Common names → our bone names
  mixamorig:Hips: hips
  mixamorig:Spine: spine
  mixamorig:Spine1: spine1
  mixamorig:Spine2: spine2
  mixamorig:Neck: neck
  mixamorig:Head: head
  mixamorig:LeftShoulder: shoulder_l
  mixamorig:LeftArm: arm_l
  mixamorig:LeftForeArm: forearm_l
  mixamorig:LeftHand: hand_l
  mixamorig:RightShoulder: shoulder_r
  mixamorig:RightArm: arm_r
  mixamorig:RightForeArm: forearm_r
  mixamorig:RightHand: hand_r
  mixamorig:LeftUpLeg: thigh_l
  mixamorig:LeftLeg: shin_l
  mixamorig:LeftFoot: foot_l
  mixamorig:RightUpLeg: thigh_r
  mixamorig:RightLeg: shin_r
  mixamorig:RightFoot: foot_r
  # VRM/VRoid names
  J_Bip_C_Hips: hips
  J_Bip_C_Spine: spine
  J_Bip_C_Chest: spine2
  J_Bip_C_Neck: neck
  J_Bip_C_Head: head
  J_Bip_L_UpperArm: arm_l
  J_Bip_L_LowerArm: forearm_l
  J_Bip_L_Hand: hand_l
  J_Bip_R_UpperArm: arm_r
  J_Bip_R_LowerArm: forearm_r
  J_Bip_R_Hand: hand_r
  J_Bip_L_UpperLeg: thigh_l
  J_Bip_L_LowerLeg: shin_l
  J_Bip_L_Foot: foot_l
  J_Bip_R_UpperLeg: thigh_r
  J_Bip_R_LowerLeg: shin_r
  J_Bip_R_Foot: foot_r
