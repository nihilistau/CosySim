# Penthouse Animation Configuration
# ====================================
# Idle animations, expressions, pose definitions.
# Served to frontend via /api/config/animations.

# Idle animation parameters
idle:
  breathing:
    torso_scale_min: 1.0
    torso_scale_max: 1.015
    speed: 1.2
    axis: y

  body_sway:
    amplitude: 0.005
    speed: 0.7
    axis: x

  arm_swing:
    amplitude: 0.04
    speed: 0.8

  leg_flex:
    amplitude: 0.02
    speed: 0.6

  head_micro:
    amplitude_x: 0.015
    amplitude_z: 0.01
    speed: 0.5

# Facial expression definitions
# Each expression defines morph-like values for face features
expressions:
  neutral:
    label: "Neutral"
    mouth_open: 0.0
    smile: 0.0
    brow_raise: 0.0
    eye_squint: 0.0
    blush: 0.0
    pupil_dilate: 0.0

  happy:
    label: "Happy"
    mouth_open: 0.1
    smile: 0.8
    brow_raise: 0.2
    eye_squint: 0.15
    blush: 0.1
    pupil_dilate: 0.1

  aroused:
    label: "Aroused"
    mouth_open: 0.3
    smile: 0.2
    brow_raise: 0.1
    eye_squint: 0.3
    blush: 0.6
    pupil_dilate: 0.5

  seductive:
    label: "Seductive"
    mouth_open: 0.15
    smile: 0.4
    brow_raise: 0.3
    eye_squint: 0.4
    blush: 0.3
    pupil_dilate: 0.3

  orgasm:
    label: "Orgasm"
    mouth_open: 0.9
    smile: 0.1
    brow_raise: 0.0
    eye_squint: 0.9
    blush: 0.9
    pupil_dilate: 0.8

  sad:
    label: "Sad"
    mouth_open: 0.0
    smile: -0.5
    brow_raise: -0.3
    eye_squint: 0.0
    blush: 0.0
    pupil_dilate: -0.1

  angry:
    label: "Angry"
    mouth_open: 0.2
    smile: -0.7
    brow_raise: -0.6
    eye_squint: 0.3
    blush: 0.2
    pupil_dilate: 0.1

  fear:
    label: "Afraid"
    mouth_open: 0.4
    smile: -0.3
    brow_raise: 0.8
    eye_squint: 0.0
    blush: 0.0
    pupil_dilate: 0.6

  surprised:
    label: "Surprised"
    mouth_open: 0.6
    smile: 0.0
    brow_raise: 0.9
    eye_squint: 0.0
    blush: 0.1
    pupil_dilate: 0.5

  shy:
    label: "Shy"
    mouth_open: 0.0
    smile: 0.2
    brow_raise: -0.1
    eye_squint: 0.1
    blush: 0.5
    pupil_dilate: 0.2

  drunk:
    label: "Drunk"
    mouth_open: 0.2
    smile: 0.5
    brow_raise: 0.1
    eye_squint: 0.4
    blush: 0.4
    pupil_dilate: 0.3

  sleepy:
    label: "Sleepy"
    mouth_open: 0.05
    smile: 0.1
    brow_raise: -0.2
    eye_squint: 0.7
    blush: 0.0
    pupil_dilate: -0.2

  dominant:
    label: "Dominant"
    mouth_open: 0.1
    smile: 0.3
    brow_raise: 0.4
    eye_squint: 0.2
    blush: 0.0
    pupil_dilate: 0.2

# Transition speeds for expression blending (seconds)
expression_blend:
  default_duration: 0.5
  fast_duration: 0.2
  slow_duration: 1.0

# Position lerp speed (how fast characters move to new locations)
movement:
  lerp_speed: 3.0
  run_lerp_speed: 6.0

# Character placement offsets when multiple occupants at same location
occupant_offsets:
  two_occupants: [-0.6, 0.6]
  three_occupants: [-0.7, 0.0, 0.7]
  four_occupants: [-1.0, -0.35, 0.35, 1.0]

# Name label display
name_label:
  height_above_head: 2.0
  bob_amplitude: 0.03
  bob_speed: 1.5
  scale: [1.0, 0.25, 1.0]
  bg_opacity: 0.6

# Chat bubble display
chat_bubble:
  height_above_head: 2.5
  default_duration: 5.0
  fade_duration: 1.0
  max_chars: 60
  scale: [2.0, 0.5, 1.0]
  bg_color: "rgba(20, 20, 40, 0.85)"
  border_color: "0x667eea"

# ──── Animation State Machine ────

# State categories — each state belongs to a category with a priority level.
# Higher priority states override lower ones during blending.
state_categories:
  idle:
    priority: 0
    states: [idle]
    description: "Default resting state"
  movement:
    priority: 1
    states: [walk, run, crawl]
    description: "Locomotion states"
  standing:
    priority: 2
    states: [lean, arms_crossed, hands_behind]
    description: "Standing pose variations"
  seated:
    priority: 2
    states: [sit, sit_cross, sit_lean, sit_floor]
    description: "Seated positions"
  lying:
    priority: 2
    states: [lie, lie_side, lie_front, lounge]
    description: "Lying/reclining positions"
  ground:
    priority: 3
    states: [kneel, kneel_sit, all_fours, sprawl]
    description: "Ground-level positions"
  furniture:
    priority: 3
    states: [interact, drink, gaze, warm, primp, bathe]
    description: "Furniture interaction states"
  action:
    priority: 4
    states: [dance_slow, dance_sway, stretch, undress, massage, beckon, hair_flip, blow_kiss, shrug, phone, smoke, flirt]
    description: "Gestural and action animations"
  intimate:
    priority: 5
    states: [embrace, kiss_standing, lap_sit, straddle, ride, going_down, missionary, doggy, spooning, dominant_pose, submissive, seductive_pose, intimate_touch]
    description: "Intimate/paired animations"
  special:
    priority: 6
    states: [pose]
    description: "Special override states"

# State blend durations — override defaults for specific transitions
# Format: "from_state -> to_state": duration_seconds
blend_overrides:
  "idle -> walk": 0.4
  "walk -> idle": 0.6
  "idle -> sit": 0.8
  "sit -> idle": 0.7
  "idle -> lie": 1.0
  "lie -> idle": 1.2
  "idle -> kneel": 0.7
  "kneel -> idle": 0.8
  "walk -> run": 0.3
  "run -> walk": 0.4
  "sit -> lie": 1.0
  "lie -> sit": 1.0
  "sit -> kneel": 0.8
  "kneel -> sit": 0.8
  "idle -> embrace": 0.6
  "idle -> kiss_standing": 0.5
  "idle -> dance_slow": 0.7
  "idle -> dance_sway": 0.5
  "any -> pose": 0.5
  "pose -> any": 0.5
  default: 0.6

# ──── Paired Animation Config ────
# Paired animations involve two characters interacting
paired_animations:
  embrace:
    roles: [initiator, receiver]
    min_distance: 0.5
    max_distance: 1.2
    facing: towards
    sync: true
    expression_initiator: happy
    expression_receiver: happy

  kiss_standing:
    roles: [initiator, receiver]
    min_distance: 0.3
    max_distance: 0.8
    facing: towards
    sync: true
    expression_initiator: aroused
    expression_receiver: aroused

  lap_sit:
    roles: [sitter, seated]
    min_distance: 0.0
    max_distance: 0.5
    facing: towards
    sync: true
    base_state_seated: sit
    expression_sitter: seductive
    expression_seated: aroused

  straddle:
    roles: [rider, seated]
    min_distance: 0.0
    max_distance: 0.4
    facing: towards
    sync: true
    expression_rider: dominant
    expression_seated: aroused

  ride:
    roles: [rider, receiver]
    min_distance: 0.0
    max_distance: 0.3
    facing: towards
    sync: true
    rhythm_speed: 1.5
    expression_rider: aroused
    expression_receiver: aroused

  going_down:
    roles: [giver, receiver]
    min_distance: 0.2
    max_distance: 0.6
    facing: towards
    sync: true
    giver_state: kneel
    expression_giver: seductive
    expression_receiver: orgasm

  missionary:
    roles: [top, bottom]
    min_distance: 0.0
    max_distance: 0.3
    facing: towards
    sync: true
    bottom_state: lie
    rhythm_speed: 1.2
    expression_top: aroused
    expression_bottom: orgasm

  doggy:
    roles: [giver, receiver]
    min_distance: 0.0
    max_distance: 0.4
    facing: same
    sync: true
    receiver_state: all_fours
    rhythm_speed: 1.3
    expression_giver: dominant
    expression_receiver: aroused

  spooning:
    roles: [big_spoon, little_spoon]
    min_distance: 0.0
    max_distance: 0.3
    facing: same
    sync: true
    base_state: lie_side
    expression_big_spoon: happy
    expression_little_spoon: happy

  massage:
    roles: [giver, receiver]
    min_distance: 0.3
    max_distance: 0.8
    facing: towards
    sync: false
    receiver_state: lie_front
    expression_giver: neutral
    expression_receiver: aroused

  dance_slow:
    roles: [lead, follow]
    min_distance: 0.3
    max_distance: 0.8
    facing: towards
    sync: true
    rhythm_speed: 0.6
    expression_lead: happy
    expression_follow: happy

  intimate_touch:
    roles: [toucher, receiver]
    min_distance: 0.2
    max_distance: 0.6
    facing: towards
    sync: false
    expression_toucher: seductive
    expression_receiver: aroused

# ──── Clothing Animation Config ────
clothing_transitions:
  undress:
    duration: 2.0
    stages:
      - action: "reach"
        time: 0.0
        arm_state: "arms_up"
      - action: "pull"
        time: 0.4
        expression: shy
      - action: "drop"
        time: 0.8
        arm_state: "arms_down"
      - action: "complete"
        time: 1.0
        expression: seductive

  dress:
    duration: 1.5
    stages:
      - action: "pickup"
        time: 0.0
      - action: "pull_on"
        time: 0.4
      - action: "adjust"
        time: 0.8
      - action: "complete"
        time: 1.0

# ──── Event-Triggered Animations ────
# Map game events to animation state changes
event_triggers:
  character_enters:
    animation: walk
    expression: neutral
    duration: 2.0

  character_leaves:
    animation: walk
    expression: neutral
    duration: 2.0

  character_speaks:
    expression_boost: 0.2
    mouth_movement: true
    gesture_chance: 0.3

  intimate_initiated:
    expression: seductive
    blend_time: 0.8

  drink_served:
    animation: drink
    expression: happy
    duration: 3.0

  music_starts:
    animation: dance_sway
    expression: happy

  argument:
    expression: angry
    animation: arms_crossed
    gesture_chance: 0.5

  compliment_received:
    expression: shy
    blush_boost: 0.3

  surprise_event:
    expression: surprised
    blend_time: 0.2

# ──── Animation Intensity Levels ────
# Controls how pronounced animations are based on mood/context
intensity_levels:
  subtle:
    movement_scale: 0.5
    expression_scale: 0.6
    speed_scale: 0.8
  normal:
    movement_scale: 1.0
    expression_scale: 1.0
    speed_scale: 1.0
  intense:
    movement_scale: 1.5
    expression_scale: 1.3
    speed_scale: 1.2
  extreme:
    movement_scale: 2.0
    expression_scale: 1.5
    speed_scale: 1.5

# ──── Procedural Motion Parameters ────
procedural:
  breathing:
    idle_rate: 1.2
    active_rate: 2.0
    aroused_rate: 2.5
    exhausted_rate: 3.0
    amplitude_min: 0.003
    amplitude_max: 0.015

  eye_blink:
    interval_min: 2.0
    interval_max: 6.0
    blink_duration: 0.15
    double_blink_chance: 0.15

  head_movement:
    look_at_speed: 2.0
    idle_drift_amplitude: 0.02
    idle_drift_speed: 0.5
    conversation_nod_chance: 0.2

  body_sway:
    standing_amplitude: 0.005
    seated_amplitude: 0.002
    lying_amplitude: 0.001
    speed: 0.7

  walk_cycle:
    stride_length: 0.4
    arm_swing: 0.3
    hip_sway: 0.05
    head_bob: 0.02
    speed: 3.0

  run_cycle:
    stride_length: 0.7
    arm_swing: 0.5
    hip_sway: 0.03
    head_bob: 0.04
    speed: 6.0
