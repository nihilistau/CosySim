# Lighting presets (time of day)
lighting:
  morning:
    ambient_intensity: 0.4
    ambient_color: "0xfff5e0"
    directional_intensity: 0.6
    directional_color: "0xffeedd"
    neon_opacity: 0.3
    fog_density: 0.012
    background: "0x1a1a3a"

  afternoon:
    ambient_intensity: 0.5
    ambient_color: "0xffffff"
    directional_intensity: 0.7
    directional_color: "0xffffff"
    neon_opacity: 0.2
    fog_density: 0.010
    background: "0x2a2a4a"

  evening:
    ambient_intensity: 0.25
    ambient_color: "0x1a1a2e"
    directional_intensity: 0.35
    directional_color: "0xffeedd"
    neon_opacity: 0.75
    fog_density: 0.018
    background: "0x08081a"

  night:
    ambient_intensity: 0.15
    ambient_color: "0x0a0a1e"
    directional_intensity: 0.15
    directional_color: "0xaabbdd"
    neon_opacity: 1.0
    fog_density: 0.025
    background: "0x040410"

  romantic:
    ambient_intensity: 0.2
    ambient_color: "0x2a1020"
    directional_intensity: 0.2
    directional_color: "0xff9988"
    neon_opacity: 0.5
    fog_density: 0.020
    background: "0x0a0510"

# Effects
effects:
  fireplace:
    enabled: true
    ember_count: 15
    light_count: 3
    flicker_speed: 10.0
    color_warmth: 0.9

  neon:
    enabled: true
    pulse_speed: 1.2
    base_opacity: 0.75
    hue_shift: 0.03

  rain:
    enabled: true
    drop_count: 30
    drop_speed_min: 2.0
    drop_speed_max: 4.0

  city_lights:
    enabled: true
    dot_count: 150
    twinkle_speed_range: [0.5, 2.5]

  post_processing:
    vignette: true
    vignette_opacity: 0.7
    film_grain: true
    grain_opacity: 0.02
    bloom_copies: 3
    bloom_opacity: 0.08

# First-person camera
first_person:
  player_height: 1.7
  move_speed: 4.0
  look_sensitivity: 0.002
  fov: 70

# Auto-orbit in overview
auto_orbit:
  enabled: true
  speed: 0.3
