# Camera view presets
camera_views:
  overview:
    position: { x: 10, y: 9, z: 10 }
    target: { x: 0, y: 0.5, z: 0 }
    fov: 55
    label: "Overview"
  bed:
    position: { x: -1, y: 3, z: -1 }
    target: { x: -5, y: 0.6, z: -1 }
    fov: 48
    label: "Bed"
  couch:
    position: { x: 1, y: 3, z: 0 }
    target: { x: 5.5, y: 0.6, z: 0 }
    fov: 48
    label: "Couch"
  bath:
    position: { x: 3, y: 2.5, z: -3 }
    target: { x: 6.5, y: 0.5, z: -4.5 }
    fov: 46
    label: "Bath"
  fireplace:
    position: { x: 2, y: 2.5, z: 2 }
