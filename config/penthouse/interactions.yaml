# ──── Transition Rules ────
# Animation state transitions that require special handling
transitions:
  # Standing to floor transitions require lowering
  standing_to_ground:
    from: [idle, lean, arms_crossed, hands_behind]
    to: [kneel, kneel_sit, all_fours, sit_floor, crawl, sprawl]
    intermediate: kneel
    duration: 0.8

  # Floor to standing requires rising
  ground_to_standing:
    from: [kneel, kneel_sit, all_fours, sit_floor, crawl, sprawl]
    to: [idle, lean, arms_crossed, hands_behind, walk]
    intermediate: kneel
    duration: 1.0

  # Lying requires getting up through sitting
  lying_to_standing:
    from: [lie, lie_side, lie_front, lounge]
    to: [idle, walk, lean, arms_crossed]
    intermediate: sit
    duration: 1.5

  # Standing to lying goes through sitting
  standing_to_lying:
    from: [idle, walk, lean]
    to: [lie, lie_side, lie_front, lounge]
    intermediate: sit
    duration: 1.2
