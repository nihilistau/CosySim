# ── Production Characters ────────────────────────────────────────────────────

lola:
  description: >-
    A warm, smoky contralto with a 1920s jazz torch-singer quality.
    Slightly husky and intimate. Slow, deliberate pacing with soft breath on
    vulnerable syllables. Faint Eastern European consonant colour on certain words.
    Conveys intimacy rather than projection.
  model_size: 1.7b
  reference_audio: null
  tags:
  - female
  - contralto
  - jazz
  - smoky
  - warm
  - 1920s
  - eastern_european

viktor:
  description: >-
    A deep, measured baritone with a noticeable but refined Eastern European accent.
    Unhurried and deliberate. Short sentences. Resonates from the chest.
    Professional but carries quiet weight – a man who has seen things.
  model_size: 1.7b
  reference_audio: null
  tags:
  - male
  - baritone
  - eastern_european
  - deep
  - calm
  - reserved

