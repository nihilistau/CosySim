companion_f:
  description: >-
    A warm, expressive female voice in the mid range. Natural brightness with
    slight breathiness on affectionate phrases. Conversational pacing, emotionally
    responsive — rises slightly when excited, softens when tender.
  model_size: 1.7b
  reference_audio: null
  tags:
  - female
  - warm
  - playful
  - mid_range
  - conversational

companion_m:
  description: >-
    A confident, friendly male voice. Mid-to-low pitch, relaxed pacing.
