<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>CosySim Assistant</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- CosySim Design System -->
  <link rel="stylesheet" href="/shared/css/design_tokens.css">
  <link rel="stylesheet" href="/shared/css/cosysim-components.css">

  <!-- Markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Socket.IO -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <!-- App -->
  <link rel="stylesheet" href="/static/css/assistant.css">
</head>
<body>

  <!-- ── Sidebar ──────────────────────────────────────────────── -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <h1 class="sidebar-logo">◈ Assistant</h1>
      <button id="new-chat-btn" class="cs-btn cs-btn--accent" title="New Chat (Ctrl+N)">+ New Chat</button>
    </div>

    <div id="conversation-list" class="conversation-list"></div>

    <div id="provider-status" class="provider-status">
      <div class="provider-row" data-provider="copilot">
        <span class="status-dot"></span>
        <span class="provider-name">Copilot</span>
        <span class="provider-count"></span>
      </div>
      <div class="provider-row" data-provider="lmstudio">
        <span class="status-dot"></span>
        <span class="provider-name">LMStudio</span>
        <span class="provider-count"></span>
      </div>
      <div class="provider-row" data-provider="nlm">
        <span class="status-dot"></span>
        <span class="provider-name">NotebookLM</span>
        <span class="provider-count"></span>
      </div>
    </div>
  </aside>

  <!-- ── Main Chat Area ───────────────────────────────────────── -->
  <main id="chat-area">
    <!-- Top Bar -->
    <header id="top-bar">
      <button id="sidebar-toggle" class="cs-btn" title="Toggle sidebar">☰</button>

      <div class="model-selector">
        <select id="model-select">
          <optgroup label="Anthropic">
            <option value="claude-opus-4.6">Claude Opus 4.6</option>
            <option value="claude-sonnet-4.6">Claude Sonnet 4.6</option>
            <option value="claude-haiku-4.5">Claude Haiku 4.5</option>
          </optgroup>
          <optgroup label="OpenAI">
            <option value="gpt-5.4" selected>GPT-5.4</option>
            <option value="gpt-5.3-codex">GPT-5.3 Codex</option>
            <option value="gpt-5.4-mini">GPT-5.4 Mini</option>
          </optgroup>
          <optgroup label="Google">
            <option value="gemini-3.1-pro">Gemini 3.1 Pro</option>
            <option value="gemini-3-flash">Gemini 3 Flash</option>
            <option value="nlm">NotebookLM (Grounded)</option>
          </optgroup>
          <optgroup label="xAI">
            <option value="grok-code-fast-1">Grok Code Fast</option>
          </optgroup>
          <optgroup id="local-models" label="Local (LMStudio)">
          </optgroup>
        </select>
      </div>

      <button id="settings-btn" class="cs-btn" title="Settings">⚙</button>
    </header>

    <!-- Messages -->
    <div id="messages" class="messages">
      <div id="welcome" class="welcome">
        <h2>◈ CosySim Assistant</h2>
        <p>Chat with 38+ frontier models. Pick a model above and start typing.</p>
        <div class="welcome-shortcuts">
          <kbd>Enter</kbd> Send &nbsp;
          <kbd>Shift+Enter</kbd> Newline &nbsp;
          <kbd>Ctrl+N</kbd> New Chat
        </div>
      </div>
    </div>

    <!-- Input Area -->
    <div id="input-area" class="input-area">
      <div id="file-drop-zone" class="file-drop-zone">
        <div id="attachments" class="attachments"></div>
        <textarea id="message-input"
                  placeholder="Type a message..."
                  rows="1"
                  autofocus></textarea>
        <div class="input-actions">
          <label class="upload-btn cs-btn" title="Upload file">
            📎
            <input type="file" id="file-input" hidden multiple>
          </label>
          <button id="send-btn" class="cs-btn cs-btn--accent" title="Send (Enter)">Send</button>
        </div>
      </div>
      <div class="input-footer">
        <span id="char-count" class="char-count"></span>
      </div>
    </div>
  </main>

  <!-- ── Settings Modal ───────────────────────────────────────── -->
  <dialog id="settings-modal" class="settings-modal">
    <div class="modal-content cs-glass-panel">
      <header class="modal-header">
        <h2>Settings</h2>
        <button id="settings-close" class="cs-btn">✕</button>
      </header>
      <div class="modal-body">
        <div class="setting-group">
          <label for="setting-system-prompt">System Prompt</label>
          <textarea id="setting-system-prompt" rows="4" placeholder="You are a helpful assistant."></textarea>
        </div>
        <div class="setting-row">
          <div class="setting-group">
            <label for="setting-temperature">Temperature</label>
            <input type="range" id="setting-temperature" min="0" max="2" step="0.1" value="0.7">
            <span id="temperature-value">0.7</span>
          </div>
          <div class="setting-group">
            <label for="setting-max-tokens">Max Tokens</label>
            <input type="number" id="setting-max-tokens" min="256" max="32768" step="256" value="4096">
          </div>
        </div>
        <div class="setting-group">
          <label for="setting-default-model">Default Model</label>
          <select id="setting-default-model"></select>
        </div>
      </div>
      <footer class="modal-footer">
        <button id="settings-save" class="cs-btn cs-btn--accent">Save</button>
      </footer>
    </div>
  </dialog>

  <!-- App JS -->
  <script src="/static/js/assistant.js"></script>
</body>
</html>
